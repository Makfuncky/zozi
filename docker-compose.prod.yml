services:
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - MAX_CLIENT_CONN=200
      - DEFAULT_POOL_SIZE=20
      - POOL_MODE=transaction
      - SERVER_RESET_QUERY=DISCARD ALL
      - AUTH_TYPE=scram-sha-256
    ports:
      - "6432:5432"
    networks:
      - zozi_net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STORAGE_BACKEND=s3
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_CDN_BASE=${S3_CDN_BASE}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=10
      - DB_POOL_RECYCLE=600
      - DB_CONNECT_TIMEOUT=5
      - BACKGROUND_JOBS_ENABLED=1
      - ML_WORKERS=2
      - SENTRY_DSN=${SENTRY_DSN}
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "2"
          memory: "2G"
        reservations:
          cpus: "1"
          memory: "1G"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      pgbouncer:
        condition: service_started
    networks:
      - zozi_net
    restart: unless-stopped

  ml_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    command: python -m utils.ml_worker
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - STORAGE_BACKEND=s3
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - BG_MAX_CONCURRENT=2
      - BG_MAX_SESSION_CACHE=2
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "4"
          memory: "4G"
        reservations:
          cpus: "2"
          memory: "2G"
    networks:
      - zozi_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - zozi_net
    restart: unless-stopped

networks:
  zozi_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
