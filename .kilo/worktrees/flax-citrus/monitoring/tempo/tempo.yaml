server:
  http_listen_port: 3200
  grpc_listen_port: 4320

common:
  path_prefix: /tmp/tempo
  storage:
    trace:
      backend: local
      local:
        path: /tmp/tempo/blocks
        block_size: 1048576
  compaction:
    shared_store: local
  ingestion:
    wal:
      path: /tmp/tempo/wal

distributor:
  replication_factor: 1

compactor:
  working_directory: /tmp/tempo/compactor
  shared_store: local

ingester:
  lifecycler:
    address: 0.0.0.0:7946
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_timeout: 0s

query:
  range_query_threads: 10

storage_trace:
  backend: local
  local:
    path: /tmp/tempo/blocks