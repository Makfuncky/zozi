global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp:25'
  smtp_from: 'alertmanager@zozi.com'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 10s
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 30s

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:8000/api/alerts/notify'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://localhost:8000/api/alerts/notify'
        send_resolved: true
    pagerduty_configs:
      - service_key: ''
        severity: critical

  - name: 'warning'
    webhook_configs:
      - url: 'http://localhost:8000/api/alerts/notify'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'dev', 'instance']