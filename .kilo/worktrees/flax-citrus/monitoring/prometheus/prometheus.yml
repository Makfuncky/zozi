global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Backend FastAPI metrics
  - job_name: zozi-backend
    scrape_interval: 10s
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
        labels:
          app: zozi-backend
          env: production

  # PostgreSQL exporter (requires sidecar container)
  - job_name: postgresql
    scrape_interval: 15s
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          app: zozi-postgresql
          env: production

  # Redis exporter (requires sidecar container)
  - job_name: redis
    scrape_interval: 15s
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          app: zozi-redis
          env: production

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
