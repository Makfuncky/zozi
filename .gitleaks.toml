# Gitleaks configuration for ZOZI
# Documentation: https://github.com/gitleaks/gitleaks

# Extend default rules
extend = "default"

# Paths to ignore
[allowlist]
  description = "Global allowlist"
  paths = [
    '''vendor/''',
    '''node_modules/''',
    '''__pycache__/''',
    '''\.pyc$''',
    '''dist/''',
    '''build/''',
    '''\.min\.js$''',
    '''\.bundle\.js$''',
    '''package-lock\.json$''',
    '''yarn\.lock$''',
    '''pnpm-lock\.yaml$''',
    '''\.env\.example$''',
    '''test_.*\.py$''',
    '''.*_test\.py$''',
    '''tests/''',
    '''migrations/''',
  ]

# Custom rules for ZOZI-specific patterns
[[rules]]
  id = "zozi-secret-key"
  description = "ZOZI Secret Key"
  regex = '''(?i)zozi[_-]?secret[_-]?key\s*[:=]\s*['"]([^'"]+)['"]'''
  tags = ["secret", "zozi"]

[[rules]]
  id = "zozi-api-key"
  description = "ZOZI API Key"
  regex = '''(?i)zozi[_-]?api[_-]?key\s*[:=]\s*['"]([^'"]+)['"]'''
  tags = ["secret", "zozi"]

[[rules]]
  id = "stripe-secret-key"
  description = "Stripe Secret Key"
  regex = '''(?i)stripe[_-]?secret[_-]?key\s*[:=]\s*['"]([^'"]+)['"]'''
  tags = ["secret", "stripe"]

[[rules]]
  id = "stripe-publishable-key"
  description = "Stripe Publishable Key"
  regex = '''(?i)stripe[_-]?publishable[_-]?key\s*[:=]\s*['"]([^'"]+)['"]'''
  tags = ["secret", "stripe"]

[[rules]]
  id = "database-url"
  description = "Database URL with credentials"
  regex = '''(?i)(postgresql|mysql|mongodb)://[^:]+:[^@]+@[^:]+:[^/]+/[^\s'"]+'''
  tags = ["secret", "database"]

[[rules]]
  id = "redis-url"
  description = "Valkey URL with credentials"
  regex = '''(?i)redis://[^@]+@[^:]+:[^/]+'''
  tags = ["secret", "redis"]

[[rules]]
  id = "jwt-secret"
  description = "JWT Secret"
  regex = '''(?i)jwt[_-]?secret\s*[:=]\s*['"]([^'"]+)['"]'''
  tags = ["secret", "jwt"]

[[rules]]
  id = "aws-access-key"
  description = "AWS Access Key"
  regex = '''(?i)(?:^|[^A-Za-z0-9/+=])(AKIA[0-9A-Z]{16})(?:[^A-Za-z0-9/+=]|$)'''
  tags = ["secret", "aws"]

[[rules]]
  id = "aws-secret-key"
  description = "AWS Secret Key"
  regex = '''(?i)aws[_-]?secret[_-]?access[_-]?key\s*[:=]\s*['"]([A-Za-z0-9/+=]{40})['"]'''
  tags = ["secret", "aws"]

[[rules]]
  id = "github-token"
  description = "GitHub Token"
  regex = '''(?i)(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9_]{36,}'''
  tags = ["secret", "github"]

[[rules]]
  id = "generic-api-key"
  description = "Generic API Key"
  regex = '''(?i)(?:api[_-]?key|apikey|api[_-]?secret)\s*[:=]\s*['"]([A-Za-z0-9_\-]{20,})['"]'''
  tags = ["secret", "generic"]
