# documents\scope\layer_rules.yaml
# AUTHORITATIVE layer contract for ZOZI.
# Read by backend/scripts/backend_layout_audit.py.

forbidden_edges:
  controllers:
    - db.database
    - db.create_tables
    - db.init_db

  services:
    - routers
    - controllers

  models:
    - routers
    - controllers
    - services

  providers:
    - routers
    - controllers
    - services

mis_housed_controllers:
  - audit_controller
  - payments_controller
  - cache_utils

forbidden_controller_to_controller: true

ownership_layers:
  - services
  - models

domains:
  core:
    may_import:
      - mixins

  auth:
    may_import:
      - core
      - mixins

  users:
    may_import:
      - core
      - auth
      - mixins

  catalog:
    may_import:
      - core
      - mixins

  supplier:
    may_import:
      - core
      - catalog
      - finance
      - treasury
      - mixins

  logistics:
    may_import:
      - core
      - supplier
      - cash_management_service
      - mixins

  finance:
    may_import:
      - core
      - communication
      - gateways
      - payments
      - catalog
      - cash_management_service
      - mixins

  payments:
    may_import:
      - core
      - finance
      - mixins

  treasury:
    may_import:
      - core
      - finance
      - orders
      - mixins

  orders:
    may_import:
      - core
      - users
      - catalog
      - supplier
      - logistics
      - finance
      - payments
      - communication
      - mixins
 
  communication:
    may_import:
      - core
      - users
      - logistics
      - orders
      - mixins

  hr:
    may_import:
      - core
      - users
      - communication
      - mixins

  ai:
    may_import:
      - core
      - catalog
      - communication
      - mixins

  gateways:
    may_import:
      - core
      - mixins

  fraud:
    may_import:
      - core
      - mixins
      - payments