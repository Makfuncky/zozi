policy:
  # --------------------------------------------------
  # Previously hardcoded Python constants
  # --------------------------------------------------
  ignore_dirs:
    - .git
    - node_modules
    - .venv
    - venv
    - __pycache__
    - .mypy_cache
    - .pytest_cache
    - .ruff_cache
    - .next
    - .expo
    - dist
    - build
    - coverage
    - playwright-report
    - test-results

  surface_names:
    - admin
    - supplier
    - customer
    - public
    - webhooks
    - webhook
    - api
    - internal
    - external

  feature_stop_names:
    - __init__
    - index
    - page
    - layout
    - loading
    - error
    - not-found
    - route
    - main
    - app
    - init
    - package
    - types
    - utils
    - helpers
    - shared
    - common
    - ui
    - src
    - components
    - features
    - hooks
    - lib
    - services
    - models
    - controllers
    - routers

  feature_suffixes:
    - _service
    - _services
    - _controller
    - _controllers
    - _router
    - _routers
    - _model
    - _models
    - _provider
    - _providers
    - _event
    - _events
    - _job
    - _jobs
    - _page
    - _pages
    - _screen
    - _screens
    - _component
    - _components
    - _hook
    - _hooks
    - _store
    - _stores
    - _api
    - _utils
    - _helpers
    - _types
    - _test
    - _tests
    - _spec

  # --------------------------------------------------
  # Logical domain classification
  # --------------------------------------------------
  logical_domains:
    database:
      parts:
        - alembic
        - db
        - models
    security:
      parts:
        - middleware
        - dependencies
      basename:
        - security_config.ini
    frontend:
      first: frontend
    docs:
      first: documents
    infra:
      first:
        - monitoring
        - nginx
        - infra
    backend:
      first: backend

  # --------------------------------------------------
  # Frontend scaling paths
  # --------------------------------------------------
  frontend_flat_paths:
    - path: frontend/web_app/src/components
      threshold_key: frontend_flat_threshold
    - path: frontend/web_app/src/lib
      threshold_key: frontend_flat_threshold
    - path: frontend/web_app/src/hooks
      threshold_key: frontend_flat_threshold
    - path: frontend/mobile_app/components
      threshold_key: frontend_flat_threshold
    - path: frontend/mobile_app/lib
      threshold_key: frontend_flat_threshold
    - path: frontend/shared/src
      threshold_key: frontend_flat_threshold

  # --------------------------------------------------
  # CODEOWNERS generation
  # --------------------------------------------------
  codeowners:
    default_owner: "@zozi/platform"
    domain_owner_template: "@zozi/{domain}"
    domain_paths:
      - backend/services/{domain}/
      - backend/models/{domain}/
    surface_paths:
      - backend/routers/{surface}/
      - backend/controllers/{surface}/

  # --------------------------------------------------
  # Auto domain placement engine
  # --------------------------------------------------
  placement:
    enabled: true
    layers:
      - services
      - models
      - providers
      - events
      - jobs
      - controllers
    router_layer: routers
    min_confidence_root_move: 0.45
    min_confidence_wrong_folder: 0.65
    min_confidence_surface_to_domain: 0.60
    min_score: 6.0
    min_candidate_files: 2
    stop_tokens: []