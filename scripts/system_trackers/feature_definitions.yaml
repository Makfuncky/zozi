  - id: SYS_009     #* Discount Management System (Coupons · Country-Scoped Discounts · Validation & Stacking · Soft-Delete/Archive)
    name: Discount Management System (Coupons · Country-Scoped Discounts · Validation & Stacking · Soft-Delete/Archive)
    update_version: "16-08-2026"
    description: |
      The Discount Management System is the customer-facing savings subsystem for Zozi checkout. It manages **coupon codes** (percentage or fixed-amount), which are country-scoped and admin-managed. The system validates coupons at checkout, tracks usage via `CouponUsage`, supports soft-delete/archive with usage-history guards, and integrates with the promotion engine for stacking/best-only discount combination. All discounts are country-isolated by RLS, monetary values use Decimal-only math, and every application is recorded immutably. The subsystem inherits constitutional P1 rules: **RLS `country_code`, Alembic-only migrations, event-driven writes (outbox), append-only audit, no silent fallbacks, Decimal-only money math, thin routers, controllers import no FastAPI, services own the database, config-as-data, monthly partitioning, keyset cursors, read/write split, media bytes in R2/S3**. Strategy: **complete + wire the existing skeleton; do not rebuild.**

      ## Capabilities:
      - **Coupon code CRUD:** Admin creates, lists, updates, and deletes coupon codes (percentage or fixed-amount); codes normalized to UPPERCASE on creation; globally unique across all countries.
      - **Country-scoped discounts:** Coupons are scoped via nullable `country_code` FK to `country_configs.code`; `NULL` = global (every country), specific code = country-only; admin manages per assigned country.
      - **Coupon validation flow:** Public `POST /validate` endpoint normalizes code → looks up active coupon → checks expiry (410 Gone if expired) → checks usage count vs limit → checks minimum order against cart total → calculates discount (percentage: total × value/100; fixed: min(value, total)) → caps at `maximum_discount` if set → returns `{valid, discount_amount, new_total, coupon}`.
      - **Soft-delete / archive pattern:** `is_deleted=True`, `is_active=False`, `deleted_at=utcnow()`, `deleted_by_id=admin.id`; list endpoints default to `is_deleted=False`; `include_deleted=true` reveals all; **hard delete blocked** if `CouponUsage` rows exist.
      - **Discount stacking integration:** Coupons combine with order-tier discounts governed by `PromotionEngineConfig.stacking_mode` (`best_only` | `stack_all` | `custom`); combined-discount caps enforced by `max_combined_discount_percent` / `_amount`.
      - **Supplier-wise discount control (future):** Currently achieved via Flash Sales (`FlashSale.product_ids` JSON, supplier-owned products); future nullable `supplier_id` on `Coupon` enables per-supplier coupon codes without router/controller changes.
      - **Banner integration:** Coupon/promotion pages inherit global animated background effects from `BannerCarousel` (celebration/season/occasion theme) via Banner Canvas System.
      - **Admin Coupons Panel:** `CouponsPanel.tsx` uses `useAdminCountry()` for `selectedCountry`; displays code, discount type, value, min order, usage, expiry, status; supports archive/restore/bulk actions; status badges (active, inactive, archived, expired).
      - **Audit & compliance:** Every coupon create/update/delete/archive/restore is append-only logged; coupon validation is rate-limited and audited.

      ## Non-negotiables:
      - **All coupon data country-scoped** — RLS `country_code` enforced on `coupons` and `coupons_usage` tables; cross-country reads return zero rows without global/admin role.
      - **Decimal-only money math** — Python `Decimal` + Postgres `NUMERIC(16,4)` everywhere; **no floats** (Penny-Rounding law).
      - **Thin routers** — `backend/routers/{surface}_{domain}_{feature}_router.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/{domain}/*`; controllers delegate.
      - **Event-driven writes** — services publish commands/events to outbox in the same transaction as business data; consumers subscribe.
      - **No silent fallbacks** — any unavailable pipeline (validation, cache, notification) reports explicit error mode with audited alternate path.
      - **Config-as-data** — stacking modes, discount caps, usage policies stored in `configuration` tables, not hardcoded.
      - **Monthly partitioning on `coupons_usage`** for 100K-scale retention; keyset cursors for hot lists.
      - **Read/write split** — `get_db()` → primary (writes only); `get_read_db()` → replica (admin list/search reads); dashboards served from materialized views + read replicas.
      - **Hard-delete protection** — coupons with `CouponUsage` history cannot be hard-deleted; archive/disable instead.

      ## Step-by-step:
      - **Step 1 — Schema, RLS & migrations:** Add/verify `coupons` and `coupons_usage` tables in `backend/models/payments.py` with `country_code` nullable FK + RLS policies; register in `COUNTRY_AWARE_TABLES`; apply monthly partitioning to `coupons_usage`; create Alembic migrations with downgrade + contract tests. *Done when:* drift gate green + RLS verified for both tables.
      - **Step 2 — Coupon service & validation engine:** Implement `coupon_service.py` (validation, usage tracking, stacking, country-scoping, soft-delete/archive); wire `POST /validate` public endpoint; implement UPPERCASE normalization, global uniqueness, expiry 410, hard-delete guard. *Done when:* coupon validation returns correct discount quote for all type/value/min/max combinations.
      - **Step 3 — Admin CRUD & country-scoped routers:** Implement global admin CRUD in `backend/routers/coupons.py` and country-scoped CRUD in `backend/routers/admin_promotions.py` (`/admin/{code}/promotions/coupons`); enforce `enforce_country_access`; support archive/restore/bulk-archive/bulk-restore. *Done when:* country-admin manages only assigned-country coupons; global admin sees all.
      - **Step 4 — Stacking & promotion engine integration:** Wire `coupons_controller.validate_coupon` and `promotion_controller` (order-tier preview + ledger); enforce `PromotionEngineConfig.max_combined_discount_percent` / `_amount` and `stacking_mode` (`best_only` | `stack_all` | `custom`). *Done when:* coupon + order-tier discount combine correctly per stacking mode; combined cap enforced.
      - **Step 5 — Soft-delete/archive enforcement:** Implement soft-archive/restore pattern; default lists to `is_deleted=False`; `include_deleted=true` query param; block hard delete when `CouponUsage` rows exist. *Done when:* hard delete on used coupon returns explicit error; archive hides from default list.
      - **Step 6 — Frontend Coupons Panel:** Build `CouponsPanel.tsx` using `useAdminCountry()` for `selectedCountry`; API base `/admin/promotions/coupons`; displays code, discount type, value, min order, usage, expiry, status; form supports all fields; archive/restore/bulk actions; status badges (active, inactive, archived, expired). *Done when:* Admin can CRUD coupons per country; archive/restore works.
      - **Step 7 — E2E test & close-out:** Run full matrix (golden validation + all edge cases + country-scoping + stacking + soft-delete + no-fallback checks) on clean Postgres via Alembic; load-test hot lists (p95 < 300ms); update `CODEBASE_STATUS_MATRIX_DETAILED.md` section-by-section. *Done when:* every row green and matrix committed.

      ## Discussion notes:
      - **Point 1 — Coupon vs. Promotion scope:** The Discount Management System is the coupon-specific subset of the broader Promotion Engine (SYS_008). Coupons are one promotion type; the promotion engine evaluates all types in precedence order. This feature owns coupon CRUD, validation, usage tracking, and soft-delete; the promotion engine owns stacking orchestration and ledger.
      - **Point 2 — Country-scoping discipline:** `Coupon.country_code` is a nullable FK. `NULL` means global (every country); a specific code means country-only. This pattern is shared by Flash Sales and Banners. The admin router path `/admin/{code}/promotions/coupons` uses the `{code}` path segment as the country scope, not the coupon's own country — the coupon's `country_code` is set from the path on creation.
      - **Point 3 — Hard-delete guard:** A coupon with usage history cannot be hard-deleted because `CouponUsage` rows would become orphaned and the audit trail would break. Archive/disable instead. This is a business rule enforced at the service layer, not just the router.
      - **Point 4 — Decimal precision:** Discount values are `Numeric(5,2)` for percent (0-100) or fixed amount. Order totals and minimum orders are `Numeric(10,2)`. All calculations use Python `Decimal`; no floats. The Penny-Rounding law applies: `(total * discount_value / 100)` is rounded half-up to 2 decimal places at the application layer, then stored as `NUMERIC(16,4)` in the ledger.
      - **Point 5 — Uppercase normalization:** Coupon codes are normalized to UPPERCASE on creation via `code.strip().upper()`. Validation must also normalize before lookup to prevent case-sensitivity bypasses.
      - **Point 6 — Stacking boundary:** Coupon stacking is governed by the promotion engine's `PromotionEngineConfig.stacking_mode`. The coupon service validates and calculates its own discount; the promotion engine decides whether to apply it alone (`best_only`) or combined with other promotions (`stack_all` / `custom`). The coupon service must not make stacking decisions independently.
      - **Point 7 — Supplier extension path:** Adding per-supplier coupon codes requires only a nullable `supplier_id` column on `Coupon` plus an Alembic migration. The existing router/controller forward arbitrary fields via `model_dump(exclude_none=True)`, so no other code change is needed. Supplier scope is derived from the product set until then.

