  - id: SYS_002     #* Order Tracker & Order Management
    name: Order Tracker & Order Management
    update_version: "16-08-2026"
    description: |
      The Order Tracker & Order Management is the `commerce.orders` / `order_items` / `carts` lifecycle plus `logistics.shipments` / `shipment_events` / `proof_of_delivery` and returns/refunds, spanning customer, supplier, admin and logistics views. Inherits constitutional rules: **RLS `country_code`, Alembic-only migrations, event-driven writes (outbox), append-only audit, no silent fallbacks, media bytes in R2.** Strategy: **complete + wire the existing skeleton; do not rebuild.**

      ## Capabilities:
      - **Canonical lifecycle (order → delivery):** `PENDING_PAYMENT` → `CONFIRMED` → `PROCESSING` → `PACKED` → `SHIPPED` → `IN_TRANSIT` → `OUT_FOR_DELIVERY` → `DELIVERED`, with `CANCELLED` / `RETURNED` / `REFUNDED` branches. Each transition is role-guarded and proof-gated.
      - **Status & transition rules:** Server-side validated transitions (config-driven state machine, not UI logic) written to `shipment_events` + published as outbox event. Who-may-do-what enforced server-side.
      - **Packaging & printing material:** On `PACKED`, generate shipping label + packing slip PDF via shipping label provider; print queue.
      - **Returns & replacements:** First-class returns/refunds tracked; return request → approve → pickup/refund; replacement re-creates order line.
      - **Proof at every handover:** Pickup = QR scan or supplier-confirmed request; delivery = e-signature or customer-confirmed request; packaging = packed-parcel photo. All proofs are media files (bytes in R2, metadata in DB).
      - **Panel visibility matrix:** Customer sees own orders + tracking; supplier sees fulfillment for assigned products; admin sees all + ops; logistics sees shipments + POD capture.
      - **Events, notifications & reconciliation:** Every transition emits `outbox_events` → notifications (in-app/email/SMS/push), customer tracking updates, and finance/treasury money-flow reconciliation (payment ↔ order ↔ payout).
      - **Location service:** GPS + IP-geo sidecar for delivery location; explicit manual-pin mode on failure.
      - **QR token & label endpoint:** Signed QR token generated at placement; `/orders/{id}/label` payload endpoint returns structured JSON + printable PDF/HTML.
      - **E2E test matrix:** Golden path + all exception paths + no-fallback assertions.

      ## Non-negotiables:
      - **Strict lifecycle + role guards**; invalid transitions rejected server-side.
      - **Proof-gated `DELIVERED`** (POD/signature); no silent delivery.
      - **Returns/refunds first-class** with audit trail.
      - **Outbox events** on every transition → notifications + finance recon.
      - **RLS `country_code`**; cross-country order reads return 0 rows.
      - **No silent fallbacks** (fail loud + DLQ for notify/recon).
      - **One order, one identity:** every order gets a unique Order ID + signed QR token at placement.
      - **Single source of truth for status:** status lives only in DB.
      - **Admin is the referee:** Admin can correct any wrongly-set status and cancel any wrong order with mandatory reason + audit log + notification.
      - **Media bytes in object storage (R2/S3), never in-database blobs** — `media_assets` stores only metadata.
      - **Thin routers** — parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services.
      - **Services own the database** — all persistence in services; controllers delegate.
      - **Config-as-data** — transition matrix stored in `configuration.order_status_rules`; server enforces it.
      - **Monthly partitioning on `logistics.shipment_events`** for 100K-scale retention; keyset cursors for hot lists.
      - **Event-driven writes** — services publish commands/events to outbox in the same transaction as business data.

      ## Step-by-step:
      - **Step 1 — Schema & state machine.** Alembic migration (with downgrade + contract test) creating/updating `commerce.packages`, `logistics.shipments`, `logistics.shipment_events` (monthly-partitioned), `logistics.proof_of_delivery`, `commerce.return_requests`, `commerce.refunds`, `commerce.order_status_history`, `commerce.shipping_labels`, `configuration.order_status_rules`; add `country_code`+RLS + audit mixins; seed the transition matrix as config data. *Done when:* illegal transition rejected in test; drift gate green.
      - **Step 2 — Placement, location & QR.** Order creation writes `delivery_lat/lng` (GPS + IP-geo sidecar; explicit manual-pin mode on failure); generate signed QR token + `/orders/{id}/label` payload endpoint (all print fields). *Done when:* label renders with QR + COD amount; scan token resolves server-side with role/status checks.
      - **Step 3 — Supplier workflow.** Order queue → accept (`PROCESSING`) → pack → **Print Parcel Sheet** button → upload packed photo (bytes→R2) → `PREPARED` + outbox event. *Done when:* photo missing blocks `PREPARED` with explicit error.
      - **Step 4 — Logistic claim & handover.** Flashing pick-up board for all partners at `PREPARED`; claim → `PICKING UP` (row-level visibility filter hides from others); claim-cancel returns to `PREPARED`; Path A QR scan + Path B request/confirm → `PICKED FROM SUPPLIER` (idempotent, double-scan rejected). *Done when:* visibility assertions pass.
      - **Step 5 — Transit & exceptions.** Transit sub-statuses with GPS trail; DELAYED/RESCHEDULED/FAILED; FAILED enforces return-to-supplier before `SHIPMENT CANCELLED`; door-reject → `SHIPMENT RETURNED`. *Done when:* each exception path leaves a full audited trail.
      - **Step 6 — Delivery proof.** In-app e-signature capture (PNG→R2) or customer confirm request → `DELIVERED` + `proof_of_delivery` row + COD flag for reconciliation. *Done when:* both paths produce POD record.
      - **Step 7 — Returns/replacements & money.** RMA flow → reverse shipment → inspection → ledger-only refund or linked replacement order; wire reconciliation entries (COD & Card paths) + nightly variance cron. *Done when:* COD run reconciles Order→Logistic→Treasury→Supplier with zero variance.
      - **Step 8 — Admin controls & panels.** Status-override + cancel-with-reason (audit + notify); disputes/communication/command-center merges; finance/treasury/commission wiring; build timeline/boards/scan/signature/print UIs in **web_app and mobile_app** with loading + empty + explicit-error states. *Done when:* parity check web vs mobile passes.
      - **Step 9 — E2E test & close-out.** Run the full matrix (golden + all exception paths + no-fallback checks) on clean Postgres via Alembic; load-test hot lists (p95 < 300ms); then update `CODEBASE_STATUS_MATRIX_DETAILED.md` section-by-section. *Done when:* every row green and matrix committed.

      ## Discussion notes:
      - **Point 1 — Unified visibility vs. role-scoped actions:** The same order + same timeline is visible to Customer, Supplier, Logistic Partner, and Admin, but each role has different allowed actions. The UI must render role-aware action buttons while showing a consistent timeline.
      - **Point 2 — QR token as physical passport:** The QR code encodes a signed token URL resolved server-side on every scan, with role + status checks. Never expose raw order IDs in QR payloads.
      - **Point 3 — Proof-gated transitions:** `DELIVERED` requires POD/signature proof; `PACKED` requires packed-parcel photo. These proofs are media files stored in R2/S3, referenced by `media_assets` metadata. Missing proof must block the transition with an explicit error.
      - **Point 4 — Config-as-data state machine:** Transition rules are stored in `configuration.order_status_rules`, not hardcoded. Adding a new status or transition rule requires only a config change, not a code deploy.
      - **Point 5 — Event-driven reconciliation:** Every status change writes to `outbox_events` in the same transaction, then fans out to notifications, customer tracking, and finance reconciliation. No silent zeros; if any pipeline fails, the system reports an explicit error mode.
      - **Point 6 — Backend hybrid state:** Several existing routers and controllers (`admin_orders_status.py`, `logistics_controller.py`) predate the thin-router contract and still import FastAPI or perform DB writes directly. New order code must comply with the target contract from day one.
      - **Point 7 — Mobile parity:** Logistics handoff + POD capture must work identically on mobile (scan, signature, GPS, claim board). Loading, empty, and explicit-error states must match web_app.
      - **Point 8 — Returns as first-class citizen:** Returns and replacements are not an afterthought; they are wired into the same tracking engine with reverse shipment, inspection, and ledger-only refund or linked replacement order.

