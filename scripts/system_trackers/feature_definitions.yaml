  - id: SYS_016     #* Logistic Panel - Countries wise vary and Product wise vary
    name: Logistic Panel - Countries wise vary and Product wise vary
    update_version: "16-08-2026"
    description: |
      The Logistic Panel is the logistics partner self-service profile workspace plus the admin approval gate for partner-visible charges, service areas, and partner visibility. It governs how logistics partners declare the countries, pickup cities, delivery cities, and associated charges they operate in; how those charges flow into the customer cart and order summary at checkout; and how Admin approves or rejects both charge updates and partner profile activation before they become visible to customers or eligible for shipment assignment. The panel is tightly coupled to the `location` and `GPS` system because charge resolution and partner assignment depend on supplier city, customer city, and country_code. Every approval, rejection, or charge update produces an append-only audit trail, and all money fields use Decimal-only arithmetic.

      ## Capabilities:
      - **Logistics Partner Profile Page ("Delivery Settings" tab):** Logistics partners manage their operational footprint — country, pickup city + pickup charges, delivery city + delivery charges — via a dedicated tab on their profile page. Partners can create, edit, and delete city-pair charge entries.
      - **Admin Approval Workflow for Charges:** Every new or updated charge entry starts in `pending` state. Admin must explicitly approve charges before they become active. Approved charges are the only ones visible to the cart/order system. Rejected charges remain invisible to customers and do not affect order summaries.
      - **Admin Approval Workflow for Partner Profile:** Logistics partner profile and profile visibility require Admin approval. Only approved partners appear in customer-facing search results and the logistics partner directory. Unapproved partners are hidden from public endpoints.
      - **Cart & Order System Reflection:** When a customer places an order, the system resolves the supplier's city and the customer's city, looks up the approved logistics partner service area charges for that city pair, and adds pickup + delivery charges to the cart and order summary. Only approved charges are used for resolution.
      - **Shipment Board Gating:** If Admin rejects a logistics partner's charges or profile changes, the partner must not appear on the shipment board (`/logistics-partner/shipments`) for new `PREPARED` orders. Existing claimed shipments are not affected; only new flashing/assignment is gated.
      - **Country-City-GPS Coupling:** Charge lookup and partner assignment are country-aware and city-aware, leveraging the existing location/GPS sidecar. Cross-country or unmatched city pairs return no active charge rule and block logistics assignment until an approved rule exists.
      - **Audit & Governance:** Every charge creation, update, approval, and rejection is logged with actor, timestamp, and reason/note. Partner profile submissions and admin decisions are audit-logged. No silent fallbacks — if no approved charge exists, the system returns an explicit error rather than guessing.
      - **Payout Integration:** Approved charges flow into the logistics partner payout calculation. Each completed order contributes `pickup_charges + delivery_charges` to the partner's settlement statement.

      ## Non-negotiables:
      - **Admin is the gatekeeper** — no charge or partner profile change goes live without explicit Admin approval.
      - **Rejected charges never reach the cart/order system** — only `approved` rows are queryable by checkout and order management.
      - **Unapproved partners are invisible to customers** — public search and partner directory filter by `verification_status = approved` and profile approval.
      - **Thin routers** — `backend/routers/*` parse/validate only; no business logic or DB writes.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/logistics/*`; controllers delegate.
      - **Decimal-only arithmetic** — all logistics money fields (`pickup_charge`, `dropoff_charge`, `base_in_city_fee`, `per_km_rate`, etc.) use Python Decimal; never float for currency.
      - **RLS on every logistics table** keyed on `country_code`; cross-country reads return zero rows without global/admin role.
      - **Alembic is the single schema source of truth** — no ad-hoc DDL in code.
      - **No silent fallbacks** — missing approved charge rule returns explicit error; checkout does not proceed with guessed charges.
      - **Config-as-data** — charge rules, approval thresholds, and visibility policies stored in database tables, not hardcoded.
      - **Event-driven writes** — services publish charge-approved/partner-approved events to outbox in the same transaction as business data; consumers subscribe for cart cache invalidation and notification fan-out.
      - **Append-only audit logs** — charge and profile changes are immutable; adjustments are new rows with audit references.

      ## Step-by-step:
      - **Step 1 — Schema & data validation:** Verify `logistics.logistics_partner_service_areas` carries `pickup_charge`, `dropoff_charge`, `approval_status`, `review_note`, `reviewed_by`, `reviewed_at`; verify `logistics.logistics_pricing_profiles` carries `approval_status`, `review_note`, `reviewed_by`, `reviewed_at`; verify `logistics.logistics_partners` carries `verification_status` and profile approval linkage. Confirm RLS policies on all `logistics` tables keyed on `country_code`. *Done when:* drift gate green + RLS verified for every logistics table.
      - **Step 2 — Partner profile approval flow:** Wire `LogisticsPartner.verification_status` and `LogisticsPartnerProfile` approval through existing review endpoints. Ensure only `approved` partners pass the public-list filter in `list_public_logistics_partners`. *Done when:* unapproved partner is absent from `/logistics-partners/public` and partner search results.
      - **Step 3 — Service area charge CRUD with approval:** Ensure logistics partners can create/edit/delete service area rows with `pickup_charge`, `dropoff_charge`, `origin_city`, `city_name`, `country_code`. New/updated rows default to `approval_status = pending`. Only Admin can transition to `approved` or `rejected`. *Done when:* partner sees pending row in their dashboard; admin sees it in review queue; cart ignores pending rows.
      - **Step 4 — Pricing profile approval:** Ensure pricing profiles (`LogisticsPricingProfile`) also default to `pending` on create/update and require Admin approval. Approved profiles feed the shipping quote calculator. *Done when:* unapproved profile is excluded from `/logistics-partners/shipping-quote` resolution.
      - **Step 5 — Cart & order charge resolution:** Implement deterministic charge lookup at cart/checkout: resolve supplier city + customer city + country_code → find approved `LogisticsPartnerServiceArea` with matching city pair → sum `pickup_charge + dropoff_charge` (or compute from `LogisticsPricingProfile` if distance/weight-based). If no approved rule exists, return explicit error blocking checkout. *Done when:* order summary reflects correct pickup + delivery charges for approved city pair; rejected/pending rules are ignored.
      - **Step 6 — Shipment board gating:** Ensure the flashing `PREPARED` board at `/logistics-partner/shipments` only includes orders where the assigned logistics partner has `verification_status = approved` AND the relevant service area/pricing profile is `approved`. If Admin rejects after assignment, remove from board and reassign or hold for manual intervention. *Done when:* rejected partner does not receive new `PREPARED` flashes; existing claims remain intact.
      - **Step 7 — Admin review panels:** Build or verify Admin UI for reviewing partner profiles, service area charges, and pricing profiles. Include approve/reject actions with mandatory `review_note`. Wire review endpoints to update `approval_status`, `reviewed_by`, `reviewed_at`. *Done when:* Admin can approve/reject a charge and see the change reflected in cart within one approval action.
      - **Step 8 — Audit, notifications & payout wiring:** Wire append-only audit hooks for every charge/profile approval event. Emit outbox events for `charge_approved`, `charge_rejected`, `partner_approved`, `partner_rejected`. Wire approved charges into logistics partner payout calculation (`pickup_charges + delivery_charges` per completed order). *Done when:* audit log captures every approval/rejection; payout statement includes correct charge totals.

      ## Discussion notes:
      - **Point 1 — Charge resolution is city-pair specific, not just country-wide:** The lookup must match both origin city (supplier/pickup) and destination city (customer/delivery) within the same country scope. A partner operating in Muscat → Sohar is not automatically eligible for Muscat → Nizwa unless they have an explicit approved rule for that city pair.
      - **Point 2 — Approval is opt-in for visibility, not just a flag:** An approved charge is not merely "visible" — it is the *only* charge considered by the cart and order system. Pending and rejected rows must be completely excluded from resolution queries, not just deprioritized.
      - **Point 3 — Partner profile approval gates public visibility:** `LogisticsPartner.verification_status` controls search/directory visibility, but profile-level approval (`LogisticsPartnerProfile`) controls whether the partner can operate at all. Both must be `approved` for the partner to be assignable to shipments.
      - **Point 4 — Rejection after assignment requires care:** If Admin rejects a charge or profile while an order is already assigned to that partner, the system must not silently break the existing shipment. New `PREPARED` flashing stops, but the current shipment continues with the partner until delivery or manual reassignment.
      - **Point 5 — Money fields are Decimal-only:** `pickup_charge`, `dropoff_charge`, `base_in_city_fee`, `per_km_rate`, `minimum_charge`, `maximum_charge`, `fuel_multiplier`, `bulk_discount_percent` all use `Numeric(10,2)` or `Numeric(5,4)` in the DB and Python `Decimal` in the API. No bare floats.
      - **Point 6 — Location/GPS coupling is mandatory:** The system cannot resolve charges without accurate city and country data. GPS and IP-geo sidecar provide the authoritative city resolution for supplier and customer addresses. Explicit manual-pin mode is required when geo resolution fails.
      - **Point 7 — Backend hybrid state:** Existing logistics routers and controllers predate the thin-router contract and still import FastAPI or perform DB writes directly. New logistics-panel code must comply with the target contract from day one; existing code is being migrated.

