  - id: SYS_010     #* Banner Management System (Canvas · Country-Scoped · Background Effects · Promotion Integration)
    name: Banner Management System (Canvas · Country-Scoped · Background Effects · Promotion Integration)
    update_version: "16-08-2026"
    description: |
      The Banner Management System is the visual promotion canvas for Zozi storefronts. It lets admin/employees design, schedule, and publish animated banners using a complete free-form canvas editor. Banners are **country-wise** (nullable `country_code` FK), support an arbitrary number of draggable shapes (rect, ellipse, text, image, video, button) stored as `layout_json`, and carry a celebration/season/occasion **background effect** that drives the global `BackgroundEffect.tsx` overlay via `effectStore`. Banners render on the product page after the header and before the search bar, and on the home hero. The subsystem follows constitutional P1 rules: **RLS `country_code`, Alembic-only migrations, event-driven writes (outbox), Decimal-only money math (where applicable), thin routers, controllers import no FastAPI, services own the database, config-as-data, monthly partitioning, keyset cursors, read/write split, media bytes in R2/S3**. Strategy: **complete + wire the existing skeleton; do not rebuild.**

      ## Capabilities:
      - **Admin/managed banners:** Admin team / employees create, edit, schedule, activate, and delete banners through `BannerTab.tsx`; banners carry `title`, `subtitle`, `image_url`, `video_url`, `cta_label`/`cta_url`, `badge_text`/`badge_color`, `bg_color`, text colors, `starts_at`/`ends_at`, `banner_type`, and `sort_order`.
      - **Country-wise scoping:** `Banner.country_code` is a nullable FK to `country_configs.code`; `NULL` = global banner shown in every country; a specific code = country-only; `GET /banners` returns `(country_code == X) OR (country_code IS NULL)`.
      - **Complete canvas system:** Admin/employee can add any shape (rectangle, ellipse, text, image, video, button), drag it anywhere (inside or outside banner bounds), resize from 8 handles, rotate, recolor, set opacity, border-radius, font, and wire buttons to a CTA URL; the whole scene is persisted as `layout_json` (JSON string).
      - **Background effect animation:** Each banner carries an `effect` (`balloons`, `poppers`, `ramadan`, `eid`, `christmas`, `diwali`, `newyear`, `aurora`, or `""`); `BannerCarousel` pushes `banner.effect` to the global `effectStore` on active-banner change, driving `BackgroundEffect.tsx`; effect resets to `"none"` on carousel unmount.
      - **Banner carousel & placement:** `BannerCarousel` parses `banner.layout_json`; if present renders `<BannerCanvasView layout={layout} />` (full canvas), else falls back to legacy image/video block; placed at `products/page.tsx` (after header, before `FilterSearchBar`, `position="product"`) and `HomeClient.tsx` (`position="hero"`); `app/layout.tsx` mounts `<BackgroundEffect />` globally.
      - **Admin canvas editor:** `BannerCanvasEditor.tsx` is the interactive editor (`value: BannerLayout | null`, `onChange`) with toolbar (add rect/ellipse/text/image/button/video), 8 resize handles, rotate, opacity, color pickers, layer front/back, delete, and a Background & Effect section for bg color/gradient/image/video and celebration/season effect; `BannerCanvasView` is the read-only renderer.
      - **Banner integration:** Banner effects drive global animated backgrounds on coupon/promotion pages because `BannerCarousel` sets the effect store on mount; the banner canvas system is the source of truth for the storefront atmosphere.
      - **Video & appearance:** `Banner` supports `video_url` (autoplay/muted/loop background video) plus `image_url`, gradient/`bg_color`, text/subtitle/button colors, `badge_text`/`badge_color`, and `cta_label`/`cta_url` — all editable in the canvas + `BannerTab`.
      - **Soft-delete / audit:** Banners support soft-delete via `is_deleted`, `deleted_at`, `deleted_by_id`; default list endpoints filter `is_deleted=False`; `include_deleted=true` reveals all; every create/update/delete is append-only logged.

      ## Non-negotiables:
      - **All banner data country-scoped** — RLS `country_code` enforced on `banners` table; `GET /banners` filters by request country; cross-country reads return zero rows without global/admin role.
      - **Thin routers** — `backend/routers/banners.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/promotions/banner_service.py`; controllers delegate.
      - **Event-driven writes** — services publish commands/events to outbox in the same transaction as business data; consumers subscribe.
      - **No silent fallbacks** — any unavailable pipeline (canvas render, effect, image/video) reports explicit error mode with audited alternate path.
      - **Config-as-data** — banner types, effect allowlist, and canvas defaults stored in configuration tables, not hardcoded.
      - **Monthly partitioning on `banners`** for 100K-scale retention; keyset cursors for hot lists.
      - **Read/write split** — `get_db()` -> primary (writes only); `get_read_db()` -> replica (public list/search reads); dashboards served from materialized views + read replicas.
      - **Media bytes in R2/S3** — `image_url` and `video_url` are storage references (R2/S3 signed URLs); no blobs in database.

      ## Step-by-step:
      - **Step 1 — Schema, RLS & migrations:** Add/verify `banners` table in `backend/models/payments.py` with `country_code` nullable FK, `layout_json`, `effect`, `video_url`, soft-delete fields; register in `COUNTRY_AWARE_TABLES`; create Alembic migration with downgrade + contract tests. *Done when:* drift gate green + RLS verified.
      - **Step 2 — Banner service & country-scoped read:** Implement `banner_service.py` (CRUD, soft-delete, country-scoping, canvas validation); wire `GET /banners` with country-aware filter; implement global uniqueness, hard-delete guard. *Done when:* public list returns only active + country-matched banners.
      - **Step 3 — Admin CRUD & canvas persistence:** Implement global admin CRUD in `backend/routers/banners.py` and country-scoped CRUD in `backend/routers/admin_promotions.py` (`/admin/{code}/promotions/banners`); enforce `enforce_country_access`; persist `layout_json` and `effect` from `BannerTab.tsx`. *Done when:* admin can create/update banners with full canvas layout per country.
      - **Step 4 — Frontend canvas & carousel:** Build `BannerCanvasEditor.tsx` (interactive editor with toolbar, resize handles, rotate, opacity, color pickers, Background & Effect section) and `BannerCanvasView.tsx` (read-only renderer); wire `BannerCarousel.tsx` to parse `layout_json` and push effect to `effectStore`. *Done when:* admin-designed canvas renders correctly on product page and home hero.
      - **Step 5 — Background effects integration:** Implement `BackgroundEffect.tsx` overlay (balloons, poppers/confetti, ramadan, eid, christmas/snow, diwali/diyas, newyear/sparklers, aurora); `effectStore` (`lib/effectStore.ts`) holds active effect; `BannerCarousel` sets effect on active banner and resets on unmount. *Done when:* animated background matches banner's celebration/season/occasion.
      - **Step 6 — E2E test & close-out:** Run full matrix (golden validation + all edge cases + country-scoping + canvas persistence + effect integration + no-fallback checks) on clean Postgres via Alembic; load-test hot lists (p95 < 300ms); update `CODEBASE_STATUS_MATRIX_DETAILED.md` section-by-section. *Done when:* every row green and matrix committed.

      ## Discussion notes:
      - **Point 1 — Banner scope:** The Banner Management System owns banner CRUD, canvas persistence, country-scoping, background effects, and storefront placement. It is distinct from but integrated with the Promotion Engine (SYS_008) and Discount Management (SYS_009): banners drive global animated backgrounds that coupon/promotion pages inherit via `BannerCarousel` -> `effectStore`.
      - **Point 2 — Country-scoping discipline:** `Banner.country_code` is a nullable FK. `NULL` = global banner shown in every country; a specific code = country-only. This pattern is shared by Flash Sales and Coupons. The admin router path `/admin/{code}/promotions/banners` uses the `{code}` path segment as the country scope; the banner's `country_code` is set from the path on creation.
      - **Point 3 — Canvas as data:** `layout_json` stores the complete canvas scene as a JSON string (not blobs). The `BannerLayout` interface defines `bg` (color/gradient/image/video), `effect`, and `elements` (array of `CanvasElement` with id/type/x/y/w/h/rotation/z/fill/stroke/borderRadius/opacity/content/src/ctaUrl). Coordinates are percentages for full responsiveness.
      - **Point 4 — Effect as atmosphere:** The animated background effect is chosen inside the banner canvas (Background & Effect dropdown), so the storefront atmosphere always matches the banner's celebration/season/occasion. Effects are rendered by `BackgroundEffect.tsx` at `zIndex:0`, `pointer-events:none`, so they never interfere with checkout or form interactions.
      - **Point 5 — Placement contract:** Product page placement is after the header and before `FilterSearchBar`; home hero placement is at the top of `HomeClient.tsx`. These are the only two canonical placements. Adding a new placement requires a new `position` prop on `BannerCarousel` and a corresponding entry in the banner scheduler.

