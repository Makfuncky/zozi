  - id: SYS_012     #* Advanced Smart Search · Filter · Sort Bar (Hybrid FTS + pgvector + CLIP)
    name: Advanced Smart Search · Filter · Sort Bar — Implementation
    update_version: "16-08-2026"
    description: |
      Build the **Advanced Smart Filtering · Sorting · Searching Bar** for the ZOZI customer storefront by **reusing and extending** what already exists — not by creating a new component or a new look. The bar supports **text (AI-parsed) + image + voice** search, **combined faceted filtering** (Category + Price + Rating + Supplier together), is **fully wired to the database**, and meets a **<300ms p95** latency budget. Reuse the existing `FilterSearchBar` (web) and `ProductSearchFilterBar` (mobile) and the system theme: `glass-search`, `glass-dropdown`, theme tokens (`surface0/1/2`, `text/textMuted`, `glass.border`), the density system, and **RTL/i18n** (Arabic strings already exist — preserve them). Keep the exact bar look; only its placement changes (centered in the header after the ZOZI logo). Do not restyle the component itself.

      Hybrid search is not vector-only: keep PostgreSQL FTS/ILIKE for lexical; **add** pgvector for semantic; **add** CLIP for visual. Fuse with Reciprocal Rank Fusion (RRF). Voice and image must funnel into the **existing** NLP query parser (`parsed`: brand/color/size/price/min_rating/quality/sort/has_video) — do **not** build a second parser. Read every file listed in Step 1 in full before editing anything. No hardcoded fallbacks that silently mask a broken pipeline.

      Bar layout (preserve exactly):
      ```
      ┌────────────┬───────┬────────┬──────────┬───────────────────────────┬────────┬────────┐   ┌─────────────┐
      │     🛍️     │  🏷️  │   ⭐   │    🏪   │                           │   📷  │   🎙️   │   │     🔍      │
      │ Categories │ Price │ Rating │ Supplier │   AI search input space   │ image  │ voice  │   │   Search    │
      └────────────┴───────┴────────┴──────────┴───────────────────────────┴────────┴────────┘   └─────────────┘
              └──────────── combined facets (apply together) ────────────┘   └─ new builds ─┘
      ```

      ## Capabilities:
      - **Hybrid Search Core:** Single search brain accepts text, image, and voice inputs; routes voice/Whisper and image/CLIP through the existing NLP parser; lexical retrieval via PostgreSQL FTS/ILIKE, semantic retrieval via pgvector HNSW, visual retrieval via CLIP embedding nearest-neighbor; fuse results with Reciprocal Rank Fusion (RRF).
      - **Combined Faceted Filtering:** Category, Price, Rating, and Supplier filters apply simultaneously as SQL `WHERE` clauses over `products` plus variant and filter-attribute JSONB; disjunctive facet counts ignore each facet's own selection so options never self-hide; zero-count options auto-hidden, trending options auto-promoted.
      - **Cursor Pagination + Sorting:** Keyset cursor pagination (NEVER OFFSET on large tables); sort modes `relevance|price_asc|price_desc|rating|newest`; Redis-backed popular-query cache + materialized-view facet counts refreshed on cron (~15 min) with event-driven invalidation on product write.
      - **Frontend Reuse + Relocation:** Reuse existing `FilterSearchBar` (web) and `ProductSearchFilterBar` (mobile); relocate the bar to the global header centered after the ZOZI logo on web; reconcile mobile header to avoid duplicate bars; preserve LTR/RTL, light/dark, all densities, and exact styling.
      - **AI Provider Layer:** Embedding provider (text → vector), CLIP provider (image+text → shared vector space), Whisper provider (audio → text) — CPU-friendly, quantized, lazy-load, cached in memory; graceful degradation with explicit `mode` reporting (`lexical|semantic|visual|hybrid`); never silent zeros or silent fallbacks.
      - **Vectorization & Indexing:** Enable `pgvector`; add `products.embedding vector(N)` with HNSW/IVFFlat index; composite indexes on `(category, is_active, is_deleted)`, `(price)`, `(supplier_id)`; GIN index on `attributes_json`; generated `search_vector tsvector` + GIN for lexical path.
      - **Performance Guardrails:** Enforce <300ms p95 with Redis warm; cap candidate set before RRF; paginate; lazy-load providers; rate-limit image/voice endpoints; background heavy analytics and enrichment off the request path.
      - **Testing & Observability:** Backend contract tests for lexical exact, semantic fuzzy/typo, image CLIP, voice→parser, combined filters, multi-item voice query, empty/no-results, facet-count correctness, rate-limit, provider-fallback (`mode:"lexical"`); frontend Playwright e2e + Jest/component tests for header placement, combined filter updates, image upload, voice query, RTL, light/dark, densities, debounce + load-more.

      ## Non-negotiables:
      - **Reuse, do not redesign.** Use the existing `FilterSearchBar` (web) and `ProductSearchFilterBar` (mobile) and the system theme: `glass-search`, `glass-dropdown`, theme tokens (`surface0/1/2`, `text/textMuted`, `glass.border`), the density system, and **RTL/i18n** (Arabic strings already exist — preserve them).
      - **Keep the exact bar look** below. Only its *placement* changes (centered in the header after the ZOZI logo). Do **not** restyle the component itself.
      - **Hybrid search, not vector-only.** Keep PostgreSQL FTS/ILIKE for lexical; **add** pgvector for semantic; **add** CLIP for visual. Fuse with Reciprocal Rank Fusion (RRF).
      - **One search brain.** Voice and image must funnel into the **existing** NLP query parser (`parsed`: brand/color/size/price/min_rating/quality/sort/has_video) — do **not** build a second parser.
      - **Read before you change.** Read every file listed in Step 1 in full before editing anything.
      - **No hardcoded fallbacks** that silently mask a broken pipeline.
      - **Thin routers** — `backend/routers/{surface}_{domain}_{feature}_router.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/{domain}/*`; controllers delegate.
      - **Alembic is the single schema source of truth** — all schema changes via migrations with downgrade + contract tests; no `create_all` in prod.
      - **RLS on every table** keyed on `country_code`; search endpoints must respect RLS so country-scoped results never leak.
      - **Cursor pagination, never OFFSET** on large tables.
      - **Decimal-only** for prices, ratings, and monetary values; never float.
      - **No silent fallbacks** — any unavailable pipeline (semantic, visual, voice, provider) reports explicit error mode with audited alternate path; always return `mode` in the response.
      - **Config-as-data** — synonyms, boosts, thresholds, facet definitions, and provider settings stored in `configuration` tables, not hardcoded.
      - **Background jobs for heavy async work** — enrichment, analytics, batch embeddings, and facet aggregation run off the request path via background jobs/Celery.
      - **Event-driven writes** — search events, video events, and product-change events publish to outbox in the same transaction as business data; consumers subscribe and invalidate caches.
      - **Redis topology:** single Redis + RDB persistence (Phase A), Sentinel (Phase B), Cluster (Phase C) as throughput grows; Redis fronts popular queries + warm facets.
      - **Read model (Phase C only):** CDC (Debezium) → Kafka → OpenSearch for catalog/search reads; Redis hydrates price/stock after OpenSearch returns IDs; removes ~80% read load from PostgreSQL at scale.

      ## Step-by-step:
      - **Step 1 — RECON (read in full before any edit):** Frontend: `FilterSearchBar.tsx`, `ProductSearchFilterBar.tsx`, the products page (`searchProducts` client + URL-param state: `search, category, sort, minPrice, maxPrice, brand, color, supplier, minRating, trending, newArrivals`), the web `Header`, the mobile `HeaderBar`, `themeStore`, translations (EN/AR search keys). Backend: `routers/search.py` (`/search/advanced`, `/search/filtered`, `/search/fuzzy`, `/search/predict`, `/search/trending`), `services/advanced_filter_service.py`, `AdvancedSearchEngine`, `AISearchService` (NLP `parsed` dict, `expand_query` synonyms, `_build_postgres_tsquery`, `_build_postgres_search_document`, `_database_supports_postgres_fts`, `get_autocomplete_suggestions`, fuzzy `get_close_matches`), the chatbot NL search (`_extract_search_keywords`) as the reference parser, and `providers/`. Output: a short note confirming current behavior + the exact response shape of `/search/filtered` today. Do not change code yet.
      - **Step 2 — RELOCATE BAR TO HEADER (no restyle):** Move the existing bar into the global header, centered after the ZOZI logo, on web. Reconcile mobile: the mobile `HeaderBar` is intentionally tall and currently states "the search lives in ProductSearchFilterBar, not here." Decide one source of truth (recommended: keep `ProductSearchFilterBar` as the bar, mount it inside/under the header region) so you do not render two search bars or break the lime header layout. Done when: one bar, correct position, identical styling, LTR + RTL, all three densities.
      - **Step 3 — HYBRID SEARCH CORE (backend):** Keep the lexical path (PostgreSQL FTS + ILIKE) as-is. Add a semantic path: embed the parsed query → nearest-neighbor over `products.embedding` (pgvector). Fuse lexical + semantic with **Reciprocal Rank Fusion**; then apply hard filters as SQL `WHERE` (category, min/max price, min rating, supplier, in_stock, brand, color, size, has_video); then `sort` (`relevance|price_asc|price_desc|rating|newest`); then **cursor pagination**. Extend the existing parser (do not replace): add multi-item parsing so "black blouse with black pant" yields two product intents. Done when: exact brand/price queries still resolve lexically; fuzzy/typo queries improve via semantic; combined filters apply simultaneously.
      - **Step 4 — AI PROVIDERS (`backend/providers`):** Add an **embedding provider** (text → vector) and a **CLIP provider** (image+text → shared vector space) and a **Whisper provider** (audio → text). CPU-friendly, quantized models; lazy-load; cache the model in memory. All providers behind a single interface with graceful degradation: if semantic/visual is unavailable, fall back to lexical **and report `mode: "lexical"`** (never silent zeros). Done when: providers return vectors/transcripts and are unit-tested with a tiny fixture.
      - **Step 5 — IMAGE SEARCH (new build):** `POST /search/by-image` (multipart `file`): validate type/size → CLIP-embed → nearest-neighbor in pgvector → same response shape as `/search/filtered`. Wire the existing 📷 `onImageSearch` handler (currently a stub: `searchImageSoon: "AI image search coming soon!"`) to this endpoint with an upload progress + preview state. Add **rate limiting + abuse guards** (this is a cost surface). Done when: uploading a product photo returns visually similar products.
      - **Step 6 — VOICE SEARCH (new build, reuses parser):** 🎙 → browser **Web Speech API** (fallback: `POST /search/voice` → Whisper) → **text** → feed the **existing** NLP parser → call `/search/filtered`. Show listening state + interim transcript; respect RTL/Arabic locale. Done when: "Do you have black blouse with black pant" → transcript → lists black blouses **and** black pants.
      - **Step 7 — FACETED COUNTS + CACHE + INDEXES:** Return **facet counts** that reflect the *current* filter state (count per category/brand/price-range/supplier given the other active filters). Back hot facets with **materialized views** refreshed on a cron (~15 min) + a **Redis** cache for popular query+filter combos (invalidate on product write). DB: enable `pgvector`; add `products.embedding vector(N)`; create an **HNSW/IVFFlat** index; add composite indexes `(category, is_active, is_deleted)`, `(price)`, `(supplier_id)`, and a GIN index on `attributes_json`. Done when: facet chips show live counts; repeated popular queries served from cache < 300ms.
      - **Step 8 — FRONTEND WIRING:** Debounce the input; drive results via cursor pagination ("Load More"); render the grid + facet chips; keep `glass-dropdown` panels floating (existing `z-[999]` fix); preserve URL-param sync and supplier-storefront redirect on exact supplier match. Show `mode` (lexical/semantic/visual/hybrid) subtly for debugging; show `corrected_query`/`suggestions`. Done when: Category + Price + Rating + Supplier apply **together** and update counts without a full reload; works LTR/RTL, light/dark, all densities.
      - **Step 9 — PERFORMANCE GUARDRAILS:** Enforce **<300ms p95** with Redis warm; cap candidate set before RRF; paginate; lazy-load providers; rate-limit image/voice. Done when: a load test (k6/Locust) holds p95 < 300ms at target concurrency.

      ## Discussion notes:
      - **Point 1 — Reuse over redesign:** The bar's exact visual appearance is a non-negotiable system token (`glass-search`, `glass-dropdown`, `surface0/1/2`, `text/textMuted`, `glass.border`). Only its placement moves. Restyling breaks density/i18n/RTL parity and wastes existing QA.
      - **Point 2 — Hybrid search correctness:** PostgreSQL FTS + ILIKE is the lexical anchor (precision for exact brand/price queries). pgvector adds semantic recall for typos and paraphrases. CLIP adds visual recall. RRF fuses ranked lists without score normalization wars. Vector-only would break exact-match precision and is therefore forbidden for the primary path.
      - **Point 3 — One parser, many inputs:** Voice and image inputs must be transcribed/embedded *before* the NLP parser, never alongside a second parser. The parser's `parsed` dict (brand/color/size/price/min_rating/quality/sort/has_video) is the single contract. Duplicating parser logic causes drift.
      - **Point 4 — Disjunctive faceting:** Each facet's counts must ignore its own selection so options never self-hide. This requires counting across the *other* active filters, not the full catalog. Materialized views (`mv_facet_counts`) plus event-driven invalidation on product write keep counts fresh without per-request aggregation.
      - **Point 5 — No silent fallbacks:** Providers (embedding, CLIP, Whisper) may fail or be disabled. The response must always include `mode` (`lexical|semantic|visual|hybrid`) so the UI and telemetry can surface degradation. Never return zeros or silently drop a retrieval path.
      - **Point 6 — Cursor pagination vs OFFSET:** OFFSET grows linearly with page depth and explodes under combined filters. Keyset cursor pagination uses the last seen `created_at`/`id` composite, keeping p95 flat regardless of page depth.
      - **Point 7 — Existing backend state:** `routers/search.py`, `services/advanced_filter_service.py`, `AdvancedSearchEngine`, and `AISearchService` already exist. The task is to extend, not replace. Any legacy fat routers or DB-writing controllers must be migrated to the thin-router/controller/service target.
      - **Point 8 — Frontend state sync:** The products page already syncs `search, category, sort, minPrice, maxPrice, brand, color, supplier, minRating, trending, newArrivals` via URL params. Preserve this contract; adding image/voice must integrate into the same param model.

