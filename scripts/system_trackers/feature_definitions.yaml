    name: Unified Communication Workspace (Chat · Email · Video · Contacts · Files)
    weight: 8
    scope: Admin · Employee · Supplier
    description: |
      Unified Communication Workspace — a Confluence-style hub combining Chat,
      Email, Video Conferencing, Contacts and Files for internal staff and
      entity-to-entity communication.

      Core capabilities:
      - Direct chat rooms (`DirectChatRoom`) and entity chat threads
        (`EntityChatThread`) with realtime WebSocket delivery and read receipts.
      - Internal channels (`InternalChannel`) with masked external contacts
        (`is_masked`) and proxy communication (`ProxyMessage`, `ProxyChannel`,
        `ProxySession`); masked proxy numbers protect personal contacts.
      - Video rooms (`VideoRoom`) with presence, metrics and admin monitoring.
      - Unified inbox aggregating `conversations` across chat, email and
        tickets, with `channel_type` routing and thread messages.
      - Admin communication console, employee communication threads, and a
        supplier support inbox; full audit trail for compliance (eDiscovery).

      Non-negotiables: realtime presence, message masking for external parties,
      channel membership management, media attachments, moderation controls,
      and explicit error states when the realtime feed is unavailable.
    sections:
      §I: "Realtime infrastructure: WebSocket chat delivery, channel masking, unified inbox aggregation, seed data."
      §III: "Supplier support inbox page handling customer conversations."
      §V: "Admin communication hub, video monitoring panel, employee communications tab, moderation."

