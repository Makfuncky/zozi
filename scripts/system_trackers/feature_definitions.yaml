  - id: SYS_004     #* Finance & Treasury ERP System (GL · Treasury · Automation · Payments · Commission · Reporting)
    name: Finance & Treasury ERP System (GL · Treasury · Automation · Payments · Commission · Reporting)
    update_version: "16-08-2026"
    description: |
      The Finance & Treasury ERP System is the authoritative marketplace finance engine for Zozi. It enforces **event-based double-entry bookkeeping** as the single source of financial truth: balances are never `UPDATE`d directly but derived from immutable `journal_entry_lines` with `SUM(Dr) == SUM(Cr)` enforced at DB level. The system spans four tiers: **Tier 1 Chart of Accounts** (account_groups, accounts, account_balances), **Tier 2 Immutable Ledger** (journal_entries, journal_entry_lines, pending_journal_entries, fiscal_periods), **Tier 3 Treasury** (treasury_accounts, treasury_transactions, cash_position_snapshots, gateway_settlement_schedules, cash_flow_forecasts, exchange_rates), and **Tier 4 Sub-ledgers & Automation** (ar_invoices/ar_ledger_entries, ap_bills/ap_ledger_entries, commission_ledger_entries, payout_rules/batches/batch_items/payouts, bank_statement_imports/lines, bank_mapping_rules, scanned_expenses, accruals, vat_remittances, fixed_assets, finance_audit_logs, automation_runs, exception_queue, report_definitions). The **Treasury engine** tracks real-time cash position (event-refreshed account_balances + EOD/hourly snapshots), gateway settlement tracking (webhook + CSV auto-match), COD remittance engine, reserve transfers with Maker-Checker, 30/60/90 cash-flow forecasts, and month-end FX revaluation auto-posts. **14 automation items** handle the full money circuit: OCR expense/asset capture, Email-to-Ledger inbox, auto bank reconciliation, auto supplier payouts, auto-accrual & reversal, depreciation run, FX revaluation, VAT remittance, orphan detector, voice-to-text finance ops, finance chatbot (RAG over CoA+ledger+docs), import & purchase automation (3-way match + landed cost), loans & investments wizards, and wholesale/B2B revenue with IFRS-15 recognition. The **Payment Gateway layer** provides a universal connector with `BasePaymentGateway` abstract contract, `PaymentGatewayRegistry` auto-discovery, `PaymentEngine` central router, `ZoziPaymentEvent` universal webhook normalizer (standardized internal schema for all providers), and AES-256-GCM Admin Credential Vault for gateway secrets. Smart routing with tier-based fallback ensures high availability. The **Commission engine** resolves rates via admin override → category rate → badge tier → global default → low-value cap, with immutable commission ledger entries per order item. The **Command Center UI** (`/admin/finance?section=…`) provides lazy-loaded sections: Dashboard, Treasury, Ledger, Settlements, Receivables, Payables, Purchasing, Assets & Capital, Tax & Compliance, Reports, and Automation Tower. All writes are event-driven; all money math uses Python `Decimal` + Postgres `NUMERIC(16,4)`; no floats. Media bytes (scanned receipts, invoices, asset photos) are stored in R2/S3, referenced by `media_assets` metadata. Append-only `finance_audit_logs` log every action including `actor=system:<automation>` for auto-posts. Config-as-data rules (`configuration.automation_rules`) hold all thresholds (confidence %, auto-post caps, date variance, 3-way-match tolerance, dunning cadence). The system inherits constitutional rules: Alembic-only migrations, RLS `country_code`, media bytes in R2, no silent fallbacks.

      ## Capabilities:
      - **Event-based double-entry truth:** Never `UPDATE` a balance column; balances = `SUM` of immutable `journal_entry_lines`; `SUM(Dr) == SUM(Cr)` enforced at DB level (trigger + service check); posted entries immutable; reversals only via counter-entries.
      - **Four-tier data architecture:** Tier 1 CoA (account_groups, accounts, account_balances), Tier 2 Immutable Ledger (journal_entries, journal_entry_lines, pending_journal_entries, fiscal_periods), Tier 3 Treasury (treasury_accounts, treasury_transactions, cash_position_snapshots, gateway_settlement_schedules, cash_flow_forecasts, exchange_rates), Tier 4 Sub-ledgers & Automation (ar/ap/commission/payout/bank/expense/accrual/VAT/fixed_assets + automation_runs, exception_queue, report_definitions).
      - **Chart of Accounts (CoA):** Hierarchical account groups (1000–6000), accounts with `normal_side` and currency, locked materialized `account_balances` cache. GCC CoA seeded idempotently (1010 Cash Op, 1020 Gateway Clearing, 1030 COD Receivable, 2010 Supplier Payables, 2020 Logistics Payables, 2040 VAT Payable, 2060 Deferred Revenue, 4010 Commission Revenue, 6010 Gateway Fees). GMV ≠ revenue — only commission/markups/SaaS are revenue.
      - **General Ledger (GL):** Journal entries with status (draft/posted/reversed), currency, fx_rate; immutable lines with account, side, amount>0, cost-center, entity. Trial balance, balance sheet, income statement, cash flow statement generated from GL.
      - **Treasury engine:** Real-time cash position (event-refreshed `account_balances` + EOD/hourly snapshots); **Free Cash = cash − reserves** (VAT/supplier/refund reserves can never be spent accidentally); gateway settlement tracking (webhook + CSV auto-match vs 1020), COD remittance engine vs 1030, reserve transfers (Maker-Checker), 30/60/90 cash-flow forecast (ML over open AR/AP + payout schedules + historical refund rate), month-end FX revaluation auto-posts.
      - **Double-entry matrix (auto-posted per event):** Card payment → Dr 1020/Cr 2060; Gateway settles → Dr 1010+6010/Cr 1020; Delivered (card) → Dr 2060/Cr 2010+2020+4010+2040; Delivered (COD) → Dr 1030/Cr same split; Logistics remits COD → Dr 1010/Cr 1030; Supplier payout → Dr 2010/Cr 1010; Refund → Rev/Deferred+payables reversed/Cr 1010/1020; Month-end FX reval → Dr/Cr FX asset/AR/AP accounts.
      - **14 automation items:** (1) OCR expense & asset capture → `scanned_expenses` staging + pgvector embed → AP bill or fixed_assets card; (2) Email-to-Ledger inbox → IMAP watcher on `finance@` → `scanned_expenses`/`gateway_settlement_schedules`; (3) Auto bank reconciliation → CSV/API → `bank_statement_lines` → amount exact + ref match + date ±3d → `is_reconciled`; (4) Auto supplier payouts → nightly cron → `payout_batches(draft)` → Maker-Checker dispatch; (5) Auto-accrual & reversal → month-end cron → `accruals`; (6) Depreciation run → monthly cron → draft JEs from `fixed_assets`; (7) FX revaluation → month-end cron → draft JEs; (8) VAT remittance → continuous aggregation → `vat_remittances` → ZATCA/FTA CSV export; (9) Orphan detector → daily 03:00 → alerts for delivered/paid orders without journal entries; (10) Voice-to-text finance ops → Whisper STT → intent draft card → confirm-gated maker-checker; (11) Finance chatbot (RAG) → NL query over CoA+ledger+docs via pgvector → `ai_staging_journals` → confirm card; (12) Import & Purchase automation → PO/GRN/vendor-invoice → `ap_bills(draft)` → 3-way match + landed-cost allocation; (13) Loans & Investments → wizard → `schedules` → effective-interest amortization JEs; (14) Wholesale/B2B revenue → bulk-order → `ar_invoices` + `ar_ledger_entries` → net-30, credit limits, IFRS-15 deferred amortization + auto dunning cadence.
      - **Automation governance:** `configuration.automation_rules` holds every threshold (confidence %, auto-post caps, date variance, 3-way-match tolerance, dunning cadence) — editable in UI, versioned, audited; `automation_runs` logs each run (job, started, status, posted/exception counts, error) powering the Control Tower; DLQ via `event_dead_letter`; local Ollama `moondream` for vision when available, explicit degraded-queue mode when not.
      - **Payment Gateway Universal Connector:** `BasePaymentGateway` abstract contract (5 mandatory methods: authorize_and_capture, process_refund, verify_webhook_signature, normalize_webhook_payload, test_connection); `PaymentGatewayRegistry` auto-discovery via pkgutil; `PaymentEngine` central router; `PaymentGatewayConnection` DB model for credentials/fees; live adapters for Stripe, Tap, Thawani, PayTabs, Mada, STC Pay; `ZoziPaymentEvent` universal webhook normalizer (provider_code, gateway_event_id, event_type, zozi_order_id, gateway_transaction_id, gross_amount, currency, gateway_fee, net_settlement, fraud_score, three_ds_status, avs_result, raw_payload); strict idempotency gate via `ProcessedWebhookEvent` table.
      - **AES-256-GCM Admin Credential Vault:** Master Encryption Key (MEK) injected via env var/KMS; unique 12-byte Nonce per encryption; 16-byte Auth Tag; DB payload format `v1$[Base64 Nonce]$[Base64 Ciphertext]$[Base64 Auth Tag]`; `VaultService` with encrypt_secret/decrypt_secret; transparent SQLAlchemy `TypeDecorator` (`EncryptedString`) for `secret_key` and `webhook_secret` columns; memory wiping + zero-logging middleware; key rotation strategy with versioned prefixes.
      - **Smart Routing & Fallback:** Priority tiers (Tier 1 Primary, Tier 2 Fallback); `PaymentEngine` tracks success rate over rolling 1-hour window; auto-degradation when Tier 1 success rate drops below 85%; Command Center alerting.
      - **Commission engine:** Hybrid model: admin override → category rate → badge tier → global default → low-value cap (5 OMR threshold, 0.500 OMR fixed cap); immutable commission_ledger_entries per order item; supplier settlement logic (gross − commission − VAT on commission − gateway fee deductions = net payable).
      - **Settlement & Payout engine:** Nightly auto payout_batches from commission_ledger_entries + payout_rules; Maker-Checker dispatch; supplier pre-review links; batch pipeline chips (draft→pending→approved→dispatched→settled).
      - **Tax engine:** Configurable tax type/rate/name, inclusivity, reduced/exempt category maps; auto-applied at checkout; ZATCA/FTA CSV export wizard; VAT remittance continuous aggregation.
      - **AR/AP with aging:** ar_invoices/ar_ledger_entries, ap_bills/ap_ledger_entries; net-30 terms, credit limits, IFRS-15 deferred amortization; auto dunning cadence (emails day 3/7/14, late-fee per config); aging reports.
      - **Expense management with OCR:** Camera/upload/`finance@` email → R2 bytes → `scanned_expenses` staging with per-field confidence + pgvector embed → conf ≥95% + duplicate check + within auto-limit → drafts AP bill or fixed_assets card; split-screen review UI.
      - **Fixed assets:** Asset register, categories, straight-line/declining depreciation, disposal gain/loss; depreciation run posts draft JEs monthly.
      - **Financial reporting:** report_definitions (JSONB fields/filters/group-by) + preview + save + scheduled email/CSV/PDF; heavy reports on materialized views + read replicas; P&L, balance sheet, cash flow, trial balance, general ledger, journal report, supplier statement, customer statement, bank statement, commission report.
      - **Automation Control Tower:** Card per automation (OCR, bank-rec, payouts, accruals, depreciation, FX, VAT, dunning, orphan, voice, chatbot) with ON/OFF toggle, cron, last-run, posted/exception counters, threshold sliders, "View DLQ"; paused = explicit badge.
      - **Command Center UI:** Route-driven sidebar (`/admin/finance?section=…`) with sections: Dashboard, Treasury, Ledger, Settlements, Receivables, Payables, Purchasing, Assets & Capital, Tax & Compliance, Reports, Automation Tower. Topbar with hybrid search (FTS+vector), voice chip, chatbot drawer, country switcher (RLS), exception-count bell.
      - **Multi-country support:** Country-scoped finance (tax, logistics, commissions, payment gateways, treasury, reconciliation); RLS `country_code` on all finance tables; Draft → Approve → Publish → Rollback lifecycle for country configs; version history via `CountryConfigVersion`.
      - **Shadow-mode cutover:** New ledger runs parallel to legacy `wallet_balance`; nightly drift cron; cutover only at 0 variance; legacy killed after.
      - **Orphan detector cron (03:00):** Any delivered/paid order or payout without a journal entry → Critical alert to Finance Command Center.

      ## Non-negotiables:
      - **Event-based double-entry truth** — never `UPDATE` a balance column; balances = sums of immutable `journal_entry_lines`; `SUM(Dr) == SUM(Cr)` enforced at DB level; posted entries immutable; reversals only via counter-entries.
      - **Money math** — Python `Decimal` + Postgres `NUMERIC(16,4)` everywhere; **no floats** (Penny-Rounding law).
      - **Event-driven ledger** — Orders/Logistics/Payments publish outbox events; only `TreasuryService`/`GeneralLedgerService` write to the GL.
      - **75% zero-touch automation** — routines auto-run; humans work only the **Exception Queue**.
      - **Triple-Verification for every auto-post** — ① rule/logic match ② AI confidence ≥ 95% (threshold config-driven) ③ GL/sub-ledger cross-reference; any fail → Exception Queue, never a guess.
      - **Maker-Checker** — manual journals & payout batches live in `pending_journal_entries`/`payout_batches(draft)` until a second, distinct user with approve rights posts; checker ≠ maker enforced.
      - **Period-close locking** — `fiscal_periods.is_closed` rejects back-dated postings at DB level.
      - **Shadow-mode cutover** — new ledger runs parallel to legacy `wallet_balance`; nightly drift cron; cutover only at 0 variance; legacy killed after.
      - **Orphan Detector cron (03:00)** — any delivered/paid order or payout without a journal entry → Critical alert to Finance Command Center.
      - **Automation staging law** — every AI/OCR/parsed result lands in a staging table first and is committed explicitly; auto-post is the commit step, logged as `actor=system:<automation>` in `finance_audit_logs`.
      - **Idempotency law** — every automation run/line carries an idempotency key (`inbox_events`), e.g. `bankrec:{import_id}:{line_id}` — retries can never double-post.
      - **Kill-switch law** — each automation has an independent pause toggle; paused/failed states show explicit badges — never silent stoppage.
      - **Thin routers** — `backend/routers/{surface}_{domain}_{feature}_router.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/{domain}/*`; controllers delegate.
      - **Append-only audit logs** — `finance_audit_logs`, `communication_audit_trails`, `employee_activity_logs` are immutable; no UPDATE/DELETE allowed.
      - **No silent fallbacks** — any unavailable pipeline (bank import, OCR, transcription, SMTP relay, payment gateway) reports explicit error mode with audited alternate path.
      - **Media bytes in object storage (R2/S3), never in-database blobs** — `media_assets` stores only metadata (url, mime, hash, w/h, ai_status).
      - **RLS `country_code`** on every finance table; cross-country reads return zero rows without global/admin role.
      - **Monthly partitioning on `audit.audit_logs`, `events.outbox_events`, `analytics.snapshots`, `communication.messages`** for 100K-scale retention; keyset cursors for all hot lists.
      - **Config-as-data** — transition matrices, automation thresholds, tax rates, commission rules, payout rules stored in `configuration` tables, not hardcoded.
      - **Decimal-only** — all money fields use `Decimal` + `NUMERIC(16,4)`; no float math anywhere.
      - **Read/write split** — `get_db()` → primary (writes only); `get_read_db()` → replica (catalog, search, analytics reads); dashboards/reports served from materialized views + read replicas.

      ## Step-by-step:
      - **Step 1 — Governance:** Freeze mandates §1.1; define RBAC matrix; create `configuration.automation_rules` + `automation_runs` + `exception_queue` designs. *Done when:* thresholds & roles signed off (ADR log updated).
      - **Step 2 — Schema & seeds:** One Alembic migration set (downgrade + contract tests) for the 4 tiers + automation tables; immutable-ledger DB trigger; seed GCC CoA, treasury buckets, fiscal periods. *Done when:* drift gate green; trial-balance endpoint returns seeded zeros balanced.
      - **Step 3 — Core engines:** `GeneralLedgerService.post_journal_entry()` (Dr==Cr abort, `SELECT … FOR UPDATE` on `account_balances`) + `TreasuryService` (position, snapshots, forecasts, settlements). *Done when:* Penny-Rounding + Time-Travel unit tests pass.
      - **Step 4 — Shadow mode & cutover:** Inject GL into payments/orders/payouts controllers in shadow; nightly drift cron legacy-vs-ledger; at 0 variance kill legacy wallet writes; wire gateway webhook auto-match + COD remittance engine. *Done when:* 7 clean drift-free nights.
      - **Step 5 — Automation Wave 1 (documents & money-in):** OCR auto-expense/asset pipeline; Email-to-Ledger; auto bank rec; orphan detector. *Done when:* malformed-file tests land 100% in Exception Queue; ≥95%-conf fixtures auto-post.
      - **Step 6 — Automation Wave 2 (schedulers):** Nightly payout batch generator + supplier pre-review links + Maker-Checker dispatch; accrual/reversal; depreciation; FX reval; VAT aggregation/export; dunning cadence. *Done when:* one full simulated month closes with zero manual routine posts.
      - **Step 7 — Voice & chatbot:** Whisper STT service + intent parser (confirm-gated); RAG chatbot over CoA/ledger/docs with draft-journal cards. *Done when:* voice→draft→approve E2E passes; degraded-mode test shows explicit errors only.
      - **Step 8 — Advanced ERP modules:** AR/AP aging + approvals; Import & Purchase 3-way match + landed cost; Loans & Investments wizards + schedule crons; Wholesale/B2B credit, AR invoicing, IFRS-15 recognition. *Done when:* 3-way-match tolerance tests + amortization math tests pass.
      - **Step 9 — Report builder & analytics:** `report_definitions` (JSONB fields/filters/group-by) + preview + save + scheduled email/CSV/PDF; heavy reports on materialized views/read replicas. *Done when:* admin builds, saves, schedules a custom P&L-by-cost-center with no code.
      - **Step 10 — Command Center UI (web + mobile parity):** Build per §4; lazy-loaded routes; skeletons; WS live ticks. *Done when:* Playwright E2E full lifecycle green on both apps.
      - **Step 11 — Payment Gateway Universal Connector:** Standardize 5 mandatory methods on `BasePaymentGateway`; build `ZoziPaymentEvent` normalizer; implement idempotency gate; wire to Treasury Engine; build Generic REST Adapter for no-code gateway setup. *Done when:* new gateway added without core logic changes; webhook normalizer handles all live adapters.
      - **Step 12 — AES-256 Credential Vault:** Implement `VaultService` (encrypt/decrypt); transparent SQLAlchemy `TypeDecorator`; memory wiping + zero-logging middleware; key rotation strategy. *Done when:* app refuses to boot without MEK; DB breach yields only ciphertext.
      - **Step 13 — Smart Routing & Fallback:** Priority tiers; health monitor (rolling 1-hour success rate); auto-degradation below 85%; Command Center alerting. *Done when:* traffic reroutes automatically on gateway failure.
      - **Step 14 — Hardening & close-out:** Chaos Monkey, load (k6), security (RLS fail-closed per country), restore drills; update `CODEBASE_STATUS_MATRIX_DETAILED.md` section-by-section. *Done when:* all gates green + sign-off.

      ## Discussion notes:
      - **Point 1 — Double-entry as law, not convention:** The entire finance system is built on immutable double-entry bookkeeping. Balances are never updated directly — they are always recalculated from journal_entry_lines. This means there is no "update balance" method anywhere in the codebase. Any attempt to bypass this (e.g., direct SQL UPDATE on account_balances) must be blocked at the DB trigger level and flagged in code review.
      - **Point 2 — Money math discipline:** Python `Decimal` + Postgres `NUMERIC(16,4)` is enforced everywhere. No float math is permitted. The "Penny-Rounding law" means all intermediate calculations preserve full precision; rounding only occurs at the final display or reporting layer. Unit tests must include Penny-Rounding tests.
      - **Point 3 — Event-driven ledger boundary:** Only `TreasuryService`/`GeneralLedgerService` write to the GL. Other services (Orders, Logistics, Payments) publish outbox events; the Treasury service consumes and posts. This is ADR-006/014. Controllers must never write to journal tables directly.
      - **Point 4 — Shadow mode is mandatory:** The new ledger runs in parallel to legacy `wallet_balance` for a full drift-clean period. Only after 7 consecutive clean nights (zero variance) does the system cut over. This prevents silent data corruption during migration.
      - **Point 5 — Automation staging law:** Every AI/OCR/parsed result lands in a staging table first. Auto-post is the explicit commit step. This means `scanned_expenses`, `bank_statement_lines`, `ai_staging_journals`, `ap_bills(draft)` are all intermediate states. The human reviews the staged data, not the raw input.
      - **Point 6 — Triple-verification gate:** No auto-post happens without three checks passing: ① rule/logic match ② AI confidence ≥ 95% (threshold config-driven via `configuration.automation_rules`) ③ GL/sub-ledger cross-reference. Any failure routes to the Exception Queue for human review. This is the core trust mechanism for 75% zero-touch automation.
      - **Point 7 — Payment Gateway normalization:** Every gateway (Stripe, Tap, Thawani, PayTabs, Mada, STC Pay) sends webhooks in different formats. The `ZoziPaymentEvent` universal normalizer translates all formats into a single internal schema. From this point forward, the Order Controller, Treasury Ledger, and Customer Emails never need to know which gateway was used. Adding a new gateway only requires writing the adapter translation layer.
      - **Point 8 — Credential vault security:** Gateway secret keys and webhook secrets are encrypted via AES-256-GCM before touching the database. The MEK is never stored in the database or Git — it comes from env vars/KMS/Vault at startup. If the app can't find a valid 32-byte key, it refuses to boot. A DB breach yields only ciphertext.
      - **Point 9 — Commission is first-class finance:** Commission is not an afterthought calculated at payout time. It is computed per order item at delivery, recorded in immutable `commission_ledger_entries`, and wired into the settlement engine. The supplier sees the true realized commission percentage on every transaction.
      - **Point 10 — Country-scoped finance:** Every finance table is RLS-protected by `country_code`. A finance admin in Oman cannot see Saudi Arabia's ledger entries. The Multi-Country Admin Onboarding system provides the Draft → Approve → Publish → Rollback lifecycle for country finance configs (tax, commissions, payment gateways, logistics).
      - **Point 11 — Free Cash vs. Reserves:** The treasury engine maintains separate buckets for cash_operating, cash_gateway_settlement, reserve_supplier_payable, reserve_logistics_payable, reserve_refund, reserve_vat, reserve_commission, receivable_customer. Free Cash = total cash minus ALL reserves. Reserves can never be spent accidentally because they live in separate treasury_accounts rows.
      - **Point 12 — Backend hybrid state:** Several existing controllers (`payments_controller.py`, `treasury_controller.py`) predate the thin-router contract and still import FastAPI or perform DB writes directly. These are being migrated; new finance code must comply with the target contract from day one.
      - **Point 13 — Exception Queue is the human inbox:** When automation can't verify something (low OCR confidence, bank rec mismatch, orphaned order), it lands in the Exception Queue with a split-screen review UI. Humans approve, edit, or reject. The queue is prioritized by source, confidence chip, and amount. Approve is disabled for the maker (Maker-Checker).
      - **Point 14 — Report builder is no-code:** Admins build custom reports by dragging fields (CoA ranges, dimensions: country/supplier/cost-center/period) + filter builder + group-by → live preview → Save / Schedule (daily/weekly/monthly email) / Export CSV·PDF. No developer needed. Reports run on materialized views + read replicas.

