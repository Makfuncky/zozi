  - id: SYS_006     #* Country Intelligence & Auto-Research Feature
    name: Country Intelligence & Auto-Research Feature
    update_version: "16-08-2026"
    description: |
      The Country Intelligence & Auto-Research Feature is a single-page "Country Dynamics" feature that automatically researches any country in the world from the internet and presents a complete, e-commerce-ready intelligence profile — covering 20 modules of market intelligence (identity, demographics, economy, tax, consumer psychology, consumption preferences, seasonality, digital landscape, payments, logistics, legal regulations, language, community, marketing, competition, customer service, technology, news, risk/compliance, and AI-generated strategic recommendations). It is the **"understanding" side of the coin**: given a country name input, it resolves basics via REST Countries API, enriches economy via World Bank Open Data API, fetches live exchange rates via Frankfurter ECB API, enriches cities via GeoNames/CountriesNow API, gathers context via Wikipedia API, collects current news via Google News RSS, surfaces web evidence via DuckDuckGo search, and optionally runs deep qualitative research via a local Ollama LLM (e.g. llama3.1 / llama3.2:3b). Every qualitative field is returned with `confidence` (high|medium|low), `verification_notes`, and `sources` so uncertain data is flagged for official verification before being used in production. Output is threefold: **JSON report** (machine-actionable, seeds `country_configs` during onboarding), **Markdown report** (human-readable), and a **single-page admin dashboard** with stat cards, charts, timelines, alerts, and map overlays. The entire tech stack is 100% free — no paid API keys required. If Ollama is not installed, the script still works: it collects facts, economic data, news, and web evidence, but marks deep qualitative modules as needing AI or manual review. This feature feeds directly into the companion Multi-Country Admin Onboarding & Management System (SYS_005), where research confidence flags tell compliance which values must be verified before publish.

      ## Capabilities:
      - **One-input country research:** Operator types any country name and receives a complete structured intelligence report; no code changes needed for new countries.
      - **20-module intelligence framework:** Covers identity/basics (14 data points), demographics (12), economy/wealth (17), tax/duties (14), consumer psychology (15), consumption preferences (13), shopping seasonality (10), digital landscape (12), payment infrastructure (14), logistics/shipping (13), legal/regulations (15), language/communication (10), community/social (10), marketing/advertising (12), competition (8), customer service expectations (8), technology/infrastructure (8), news/current context (7), risk/compliance (7), strategic recommendations (10) — 200+ data points total.
      - **Free data source stack:** REST Countries API (basics), World Bank Open Data API (economy), Frankfurter ECB API + open.er-api.com fallback (exchange rates), GeoNames + CountriesNow API (cities), Wikipedia API (context summary), Google News RSS (current news), DuckDuckGo search (web evidence for tax/payments/rules/behavior), optional local Ollama LLM (deep qualitative research — psychology, mindset, gateway landscape, regulations, marketing channels, strategy).
      - **Confidence-tagged output:** Every qualitative field carries `confidence` (high|medium|low), `verification_notes`, and `sources`; production system must never blindly use AI-generated legal/tax/payment values — confidence decision tree governs use.
      - **Three output formats:** JSON (normalized 20-module structure, ideal for seeding `country_configs`), Markdown (human-readable narrative), Single-page dashboard (stat cards, gauge/progress bars, pie/donut charts, ranked lists, traffic-light badges, alert boxes, calendar/timeline, comparison tables, checklists, map overlays, sparklines, tag clouds, narrative cards).
      - **E-commerce system integration mapping:** Currency/exchange rate → dynamic pricing; tax slabs → cart tax calculation; payment methods → checkout gateway selection; COD % → enable/disable COD; language → UI localization; cities → shipping zones; return window → return policy display; prohibited items → product listing filters; peak hours → ad scheduling; festival calendar → automated sale campaigns.
      - **Research engine pipeline:** `fetch_basic()` → `fetch_economy()` → `fetch_exchange()` → `fetch_cities()` → `fetch_wikipedia()` → `fetch_news()` → `fetch_web_evidence()` → `build_ai_input()` → `build_prompt()` → `generate_ai_modules()` (Ollama) → `placeholder_modules()` (fallback) → `apply_ai_modules()` → `build_meta()` → `write_markdown()` → `run()` orchestrates full sequence producing JSON + Markdown.
      - **Ollama prompt guardrails:** AI instructed to use only provided facts + web evidence; never invent exact legal/tax numbers (use "unknown" for missing fields); mention uncertainty in `verification_notes`; return ONLY valid JSON; low temperature (0.2) for factual consistency; 8k context window; model auto-selection with fallback.
      - **"Latest" data freshness:** Country code/currency/language from REST Countries (live); population/GDP/inflation/unemployment from World Bank latest available year; exchange rate from Frankfurter ECB latest business day; news from Google News RSS (last 1 day); tax/payments/rules from DuckDuckGo recent-month search; AI analysis uses collected latest evidence + current date.

      ## Non-negotiables:
      - **All data sources are free** — no paid API key required for core operation; REST Countries, World Bank, Frankfurter, GeoNames (free tier), Wikipedia, Google News RSS, DuckDuckGo are all zero-cost.
      - **Confidence tagging on all qualitative fields** — `confidence` (high|medium|low), `verification_notes`, `sources`; production commerce system must never blindly use AI-generated legal/tax/payment values.
      - **Thin routers** — `backend/routers/{surface}_{domain}_{feature}_router.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/{domain}/*`; controllers delegate.
      - **Event-driven writes** — services publish commands/events to outbox in the same transaction as business data; consumers subscribe.
      - **No silent fallbacks** — if Ollama is unavailable, the system produces partial results with explicit `raw_evidence_only` / `needs_local_ai_or_manual_research` flags; if any external API fails, the system reports explicit error mode with retry logic.
      - **Output is both human-readable and machine-actionable** — JSON for system integration (`country_configs` seeding), Markdown for human review, dashboard for operator consumption.
      - **Any country in the world can be researched with one input** — no code changes required; the engine resolves country names via REST Countries API `fullText` search with partial match fallback.
      - **AI never invents exact legal or tax numbers** — instructed to use "unknown" for missing fields; uncertainty is explicit in `verification_notes`.
      - **Research feeds onboarding, does not replace it** — this feature produces intelligence; the companion SYS_005 system turns that intelligence into a live configurable country via Draft→Approve→Publish→Rollback.
      - **Config-as-data** — research output maps directly to `country_configs` fields; the onboarding wizard auto-populates from JSON; no hardcoded country assumptions.

      ## Step-by-step:
      - **Step 1 — Research engine core (`free_country_ecommerce_research.py`):** Implement `FreeEcommerceCountryResearch` class with method pipeline: `fetch_basic()` (REST Countries API), `fetch_economy()` (World Bank), `fetch_exchange()` (Frankfurter + open.er-api fallback), `fetch_cities()` (GeoNames → CountriesNow → capital fallback), `fetch_wikipedia()` (Wikipedia REST summary), `fetch_news()` (Google News RSS, last-1-day fallback to broader), `fetch_web_evidence()` (DuckDuckGo per qualitative module, recent-month window), `build_ai_input()` (assemble facts + news + web evidence), `build_prompt()` (wrap into strict JSON instruction, truncate >90k chars), `generate_ai_modules()` (Ollama `/api/chat`, temperature 0.2, num_ctx 8192, format json, auto-select model), `placeholder_modules()` (Ollama unavailable fallback with confidence:low flags), `apply_ai_modules()` (merge AI output or placeholders), `build_meta()` (generation time, freshness, data sources, disclaimer), `write_markdown()` (human-readable per-module report), `run()` (orchestrate full sequence, write JSON + Markdown). *Done when:* engine produces valid JSON + Markdown for any country name input without code changes.
      - **Step 2 — 20-module schema & data model:** Define `CountryResearch` (master record: country_code, status, generated_at, data_sources, meta), `ResearchModule` (module_id, module_name, data_points JSONB, confidence, verification_notes, sources), `ResearchWebEvidence` (module_id FK, query, title, href, snippet, fetched_at), `CountryResearchHistory` (country_code, research_id, created_at, created_by) — all in `backend/models/geography/`. *Done when:* Alembic migration passes; research JSON persists with full 20-module structure.
      - **Step 3 — Backend API layer:** Thin routers: `routers/country_research.py` (POST /research/run, GET /research/{code}, GET /research/{code}/history, GET /research/{code}/json, GET /research/{code}/dashboard). Controllers: `controllers/geography/country_research_controller.py` (orchestrates, delegates to country_research_service). Services: `services/geography/country_research.py` (orchestrates engine pipeline, persists results, manages history). *Done when:* admin can trigger research for any country, view JSON + dashboard, browse history.
      - **Step 4 — Dashboard API:** `GET /research/{code}/dashboard` returns aggregated data optimized for the single-page dashboard — stat cards, chart data, alerts, map overlays. Service: `services/geography/country_research_dashboard_service.py` (aggregates 20 modules into dashboard payload). *Done when:* dashboard loads in under 2 seconds for any researched country.
      - **Step 5 — Onboarding integration (SYS_005 handshake):** `/admin/countries/new` wizard accepts research JSON → `services/geography/country_auto_populate.py` seeds `country_configs` → routes through Draft→Approve→Publish. Confidence flags route high-confidence fields directly; medium/low fields flag for compliance review. *Done when:* new country can be launched from research JSON without manual data entry for standard fields.
      - **Step 6 — Frontend single-page dashboard (web_app):** `frontend/web_app/src/app/admin/research/[country]/page.tsx` — single-page dashboard with: header (country name, flag, ISO codes, last-updated timestamp), stat cards grid (population, GDP, tax rate, AOV, internet penetration), charts section (age distribution pie, payment split donut, market share pie, GDP trend sparkline), ranked lists (top cities, top payment methods, top categories, top logistics), traffic-light badges (risk levels, political stability), alert boxes (legal restrictions, COD %, data localization), calendar/timeline (shopping festivals, peak hours), comparison tables (urban vs rural, local vs foreign), checklists (compliance requirements), map overlays (warehouse hubs, delivery zones), tag clouds (languages, platforms), narrative cards (psychology, cultural notes), confidence/verification panel (flagged fields with sources). *Done when:* operator can type "India" and see full dashboard within 30 seconds.
      - **Step 7 — Frontend (mobile_app):** `frontend/mobile_app/app/admin/research/[country].tsx` — mobile-optimized research dashboard (scrollable stat cards, collapsible modules, export JSON button). *Done when:* mobile dashboard renders all 20 modules with collapsible sections.
      - **Step 8 — Background worker for long research jobs:** `jobs/country_research_worker.py` (Celery/Redis) — runs research pipeline asynchronously for large countries; publishes progress events via Redis pub/sub; frontend shows real-time progress. *Done when:* research for any country completes without blocking the API request path; WebSocket progress updates visible.
      - **Step 9 — Confidence decision tree enforcement:** Implement `ResearchConfidenceService` — high + official source → auto-use; medium → default + flag for review; low → require manual verification before enabling checkout/tax/shipping/payment rules. Wire into SYS_005 onboarding wizard so flagged fields cannot be published without compliance sign-off. *Done when:* no low-confidence field reaches production checkout without manual verification.
      - **Step 10 — E2E test & validation:** Golden-path test (type country → get JSON + dashboard), API failure tests (REST Countries down, World Bank down, Ollama unavailable), confidence-flag tests (verify high/medium/low routing), onboarding integration test (research JSON → country_configs seed → publish), Playwright browser smoke (admin triggers research, views dashboard, initiates onboarding). *Done when:* all tests pass; research for 5 diverse countries (India, Pakistan, Nigeria, Brazil, Germany) produces valid reports.

      ## Discussion notes:
      - **Point 1 — Research as input, not authority:** This feature produces intelligence; it does not configure the platform. The companion SYS_005 system turns intelligence into live configuration. Research output maps to `country_configs` fields, but every value must pass through Draft→Approve→Publish before affecting production. Confidence flags are the handshake between the two features.
      - **Point 2 — Free tech stack discipline:** The entire engine runs on free APIs and optional local Ollama. No paid API keys, no cloud AI services. This keeps marginal cost per country research at zero and removes vendor lock-in. If any external API is down, the system degrades gracefully: REST Countries → cached fallback, World Bank → cached last value, Ollama → placeholder modules with confidence:low.
      - **Point 3 — Confidence as a first-class concept:** Every qualitative field (tax rates, payment gateways, consumer behavior, legal requirements) carries confidence metadata. The production system must enforce a decision tree: high+official → auto-use; medium → default + flag; low → manual verification required. This is not optional — it is the safety boundary between research and commerce operations.
      - **Point 4 — 20-module structure is the contract:** The module IDs and data-point keys form the stable API contract between research engine, onboarding wizard, and admin dashboard. Adding a new module requires updating: AI schema prompt, dashboard component, onboarding seed mapping, and e-commerce integration mapping table. Module keys must not change without a version bump.
      - **Point 5 — Ollama as optional accelerator:** The engine works fully without Ollama — it collects structured facts, economic data, news, and web evidence. Ollama only adds the deep qualitative narrative modules (psychology, mindset, gateway landscape, regulations, strategy). The `placeholder_modules()` method ensures every module has a valid structure even without AI, with explicit `raw_evidence_only` or `needs_local_ai_or_manual_research` flags.
      - **Point 6 — "Latest" is best-effort, not guaranteed:** Tax, law, payment gateways, and regulations change quickly. The engine uses live APIs and recent-month web search, but the `verification_notes` and `sources` fields make this explicit. The confidence decision tree and compliance verification step exist precisely because freshness cannot be guaranteed for all data points.
      - **Point 7 — Single-page dashboard as the operator surface:** The dashboard is the primary interface for non-technical operators. It must load in under 2 seconds, present all 20 modules in a scrollable single-page layout, and allow drill-down into individual modules. The design uses the element map in section 5 of FEATURES.md: stat cards, gauges, charts, ranked lists, alert boxes, timelines, tag clouds, narrative cards.
      - **Point 8 — Background processing for scale:** Research for a single country makes ~15-20 HTTP requests plus an optional Ollama call. This can take 10-30 seconds. The API must not block on this — POST /research/run returns a job ID immediately; Celery worker processes in background; Redis pub/sub pushes progress to frontend; GET /research/{code}/dashboard returns cached results when ready.

