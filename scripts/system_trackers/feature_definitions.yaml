  - id: SYS_003     #* Customer Return Policy & Returns Management
    name: Customer Return Policy & Returns Management
    update_version: "16-08-2026"
    description: |
      The Customer Return Policy & Returns Management is the product-specific return and replacement lifecycle for the Zozi marketplace. It enforces per-product return windows (minimum 10 days, maximum supplier profile default), delivered-only eligibility, one return request per order, and customer-owned requests. The backend is the authoritative policy source: supplier-configured windows are validated server-side, return requests are validated against delivery date plus product window, and the system distinguishes between return (auto-refund on completion) and replacement (no refund, notification only). The flow spans supplier policy setup, customer request submission, supplier review per supplier (not per item), admin/support resolution, and automatic refund or replacement completion. All state transitions are audited, and the system emits notifications at every stage.

      ## Capabilities:
      - **Product-specific return windows:** Each product defines its own return window in days; supplier profiles cap the maximum (default 30 days); platform minimum is 10 days; fallback to 10 days when no explicit window is set.
      - **Delivered-only eligibility:** Return requests are accepted only after order delivery; multi-shipment orders resolve delivery from shipment state, not a single row.
      - **Customer return/replacement request:** Customer chooses return or replacement intent, submits reason, request is tied to order owner; duplicate requests blocked.
      - **Supplier review queue:** Per-supplier review (not per item); decisions: pending, approved, rejected, restocked; restocked updates restore inventory; review state stored as JSON.
      - **Admin/support resolution:** List, inspect, update return requests; statuses: pending, approved, rejected, completed; resolution notes; resolved timestamp; bulk update support.
      - **Automatic refund on completion:** Completed return requests trigger refund via Stripe payment intent or Tap refund endpoint; order status updated to refunded; refund ledger entries and notifications written.
      - **Replacement tracking:** Completed replacement requests trigger customer notification only; no auto-refund; replacement is tracked but has no separate shipment workflow yet.
      - **Return policy display:** Product detail pages show actual per-product return window; help and chatbot copy avoids fixed site-wide promises.
      - **Return history visibility:** Customers view return requests from tracking and return history on both web and mobile; refund status shown where payment provider and finance records are available.
      - **Audit logging:** Every creation and update is logged; return-created email queued; immutable audit trail for traceability.

      ## Non-negotiables:
      - **Backend is authoritative policy source** — product-specific windows enforced server-side, never client-side only.
      - **Product-specific return window** — not a single site-wide period; each product defines its own window in days.
      - **Minimum 10 days, maximum supplier profile default** — editor prevents values below 10 days; backend validates against supplier profile maximum.
      - **Delivered-only requests** — return requests blocked before delivery; multi-shipment orders resolve delivery from shipment state.
      - **One return request per order** — duplicate requests for the same order are blocked.
      - **Return intent is return or replacement** — only completed return requests trigger automatic refund; replacement requests do not auto-refund.
      - **Supplier review per supplier** — review is per supplier in the order, not per order item in isolation.
      - **Append-only audit logging** — creation and updates logged; no silent fallbacks.
      - **Return-created email queued** — notification sent on request creation.
      - **Thin routers** — parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in services; controllers delegate.
      - **Event-driven writes** — services publish commands/events to outbox in the same transaction as business data; consumers subscribe.
      - **No silent fallbacks** — any unavailable refund pipeline (Stripe, Tap) reports explicit error mode with audited alternate path.
      - **Config-as-data** — return policy rules, minimum/maximum windows, and supplier profile caps stored in `configuration` tables, not hardcoded.

      ## Step-by-step:
      - **Step 1 — Supplier sets product policy:** Supplier sets product return window during create/update; editor prevents values below 10 days; backend validates against supplier profile maximum; product detail page shows actual window. *Done when:* product return window saved and displayed correctly.
      - **Step 2 — Product published with policy:** Product detail pages show actual per-product return window; customer-facing help/chatbot copy avoids fixed site-wide promises; backend remains authoritative source. *Done when:* product page displays correct return window.
      - **Step 3 — Customer places order:** Customer checks out normally; return eligibility does not begin until delivery confirmed. *Done when:* order placed successfully with delivery tracking.
      - **Step 4 — Delivery confirmed:** System marks order delivered; return requests blocked before delivery; multi-shipment orders resolve delivery from shipment state. *Done when:* delivery state correctly enables return eligibility.
      - **Step 5 — Customer opens return flow:** Customer opens order detail or tracking; chooses return or replacement; submits reason; request tied to customer who owns order. *Done when:* return/replacement form submit succeeds for eligible order.
      - **Step 6 — Backend validates request:** Order exists and belongs to customer; order is delivered; no existing return request; request within product return window from delivery; intent is valid. *Done when:* invalid requests rejected with explicit error.
      - **Step 7 — Request record created:** ReturnRequest row created with status pending; supplier review state initialized per supplier; timestamps stored; audit logging records creation; return-created email queued. *Done when:* ReturnRequest row created with correct initial state.
      - **Step 8 — Supplier review:** Supplier queue shows only owned items; supplier sets decision: pending, approved, rejected, or restocked; restocked updates restore inventory; review state stored as JSON. *Done when:* supplier review state persisted and inventory updated on restock.
      - **Step 9 — Admin/support resolution:** Admin/support list, inspect, update return requests; statuses: pending, approved, rejected, completed; resolution notes attached; resolved timestamp stored; bulk update support. *Done when:* admin can resolve request with notes and timestamp.
      - **Step 10 — Completion outcome:** Completed return triggers automatic refund (Stripe payment intent or Tap endpoint); order status updated to refunded; refund ledger entries and notifications written. Completed replacement triggers customer notification only, no refund. *Done when:* return completion posts refund and updates status; replacement completion sends notification.
      - **Step 11 — Customer visibility:** Customer views return request from tracking and return history on web and mobile; refund status shown where payment provider and finance records available. *Done when:* return status and refund status visible to customer on both surfaces.

      ## Discussion notes:
      - **Point 1 — Product-specific vs site-wide policy:** The return policy is product-specific, not a single site-wide period. Each product defines its own window; supplier profiles cap the maximum. This requires the backend to resolve the effective window per order line at validation time, not a global config.
      - **Point 2 — Supplier review granularity:** Supplier review is per supplier in the order, not per order item in isolation. A multi-supplier order has one return request but multiple supplier review states stored as JSON. The UI must render per-supplier decisions.
      - **Point 3 — Return vs replacement divergence:** Returns and replacements share the same request model but diverge at completion: returns trigger automatic refund, replacements do not. The completion handler must branch on intent, and replacement has no reverse shipment workflow yet.
      - **Point 4 — Backend as authoritative source:** All policy rules (minimum days, maximum days, delivery-only, duplicate blocking, window calculation) are enforced server-side. Client-side validation is convenience only; the backend must re-validate every rule.
      - **Point 5 — Delivery resolution for multi-shipment orders:** For orders split across multiple shipments, delivery is resolved from shipment state, not a single row. The backend must aggregate shipment states to determine order-level delivery before enabling returns.

