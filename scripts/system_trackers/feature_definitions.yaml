    update_version: "16-08-2026"
    description: |
      The Communication Workspace (also known as "Confluence") is the unified internal communication suite for the Zozi Employee Management System. It consolidates chat (1:1, group, entity threads), video conferencing, internal email, internal channels (Slack-style), proxy/external contact masking, and a unified inbox into a single conversation-deck UI. All communication is country-isolated by RLS, media bytes are stored in object storage (R2/S3) referenced by `media_assets` (never in-database blobs), and every write is appended to an immutable audit trail. Heavy async work (transcoding, PDF generation) runs on Celery/Redis queues off the request path. Real-time delivery uses WebSockets for new messages, typing indicators, read receipts, and online presence. The frontend implements a five-zone "Confluence" layout: command bar, modality rail, conversation list, morphing stage renderer, and contextual inspector — all keyboard-first, density-aware, and theme-agnostic.

      ## Capabilities:
      - **Unified Chat System:** 1:1 direct chats, group chats, entity-linked threads (order/supplier B2B), all with real-time WebSocket delivery, read receipts, typing indicators, online presence, reply threading, edit/delete with audit, emoji reactions, full-text search on body, message forwarding, and configurable retention per channel.
      - **Rich Attachments & Media:** Support for images, videos, voice notes (compressed .ogg/.m4a with waveform JSON), and documents — all bytes stored in Cloudflare R2/S3 with metadata in `media_assets`; inline playback, drag-and-drop upload, and thumbnail generation via async workers.
      - **Video Conferencing:** Create/manage video rooms, participant management, token-based access, watermarked frames, WORM-compliant recording storage, real-time transcription via Whisper, translation, action-item extraction, and calendar scheduling; DB stores only metadata, media bytes go to object storage.
      - **Internal Email System:** Per-employee inbox (Inbox/Sent/Drafts/Trash/custom folders), smart recipient routing (internal-first: matches `users.email` → in-database delivery, instant and audited; external → SMTP relay), threading, DLP scanning before external send, role-based allow-lists, mandatory BCC to compliance for sensitive roles, bulk send, send-from-alias, full-text search, user labels/rules, and open/click tracking.
      - **Internal Channels:** Slack-style department/country/project channels (`internal_channels`) with public/private visibility, topic + pinned messages, member management, and real-time messaging; country-scoped and RLS-protected.
      - **Proxy / External Contact Masking:** Masked communication channels (`proxy_channels`) for employee-to-external-party interactions, preserving true-contact identity behind a gateway with full audit logging.
      - **Unified Inbox ("Confluence"):** A single cursor-paginated, server-sorted triage stream merging DMs, group mentions, channel posts, emails, missed videos, and tickets — ranked by urgency (you → mentions → DMs → groups → email → channels); real-time deltas patch the inbox via WebSocket; the rail renders this unified list, not separate lists.
      - **Universal Composer:** One composer dock supporting send-as toggle (chat | email | SMS-bridge), drag-and-drop file attachment, voice note recording with waveform preview, @mentions, #channel shortcuts, and emoji reactions — same draft, different transport.
      - **Context Inspector:** Collapsible right rail with tabs for People/360 (cross-transport interaction history), Shared files, Pinned & tasks, AI/DLP (summarize, draft reply, extract action items), and Audit/eDiscovery — re-keys per transport type.
      - **Communication Audit & eDiscovery:** Append-only `communication_audit_trails` logging every message/email/video write; privacy-gated viewers (employee sees own, manager sees subtree, HR/legal sees all); eDiscovery export for legal investigations; legal-hold on rooms/channels freezes deletion.
      - **Automation Hooks:** Auto-translate chat/email AR↔EN; announcement mandatory read-confirmation tracking; auto-COI detection on communications; DLP quarantine review; retention purge per policy with legal-hold override.
      - **Search:** Global ⌘K search across people, messages, files, rooms, emails, wired to eDiscovery `search_communications`; local search in conversation list; full-text search on message body and email subject+body.

      ## Non-negotiables:
      - **All media bytes in object storage (R2/S3), never in-database blobs** — `media_assets` stores only metadata (url, mime, hash, w/h, ai_status).
      - **RLS on every `comms`/`hr` table** keyed on `country_code`; cross-country reads return zero rows without global/admin role.
      - **Thin routers** — `backend/routers/{surface}_{domain}_{feature}_router.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/{domain}/*`; controllers delegate.
      - **Event-driven writes** — services publish commands/events to outbox in the same transaction as business data; consumers subscribe.
      - **Celery/Redis for heavy async work** — video/voice transcoding, thumbnail generation, analytics aggregation, PDF generation never block the API request path.
      - **Append-only audit logs** — `communication_audit_trails` and `employee_activity_logs` are immutable; no UPDATE/DELETE allowed.
      - **No silent fallbacks** — any unavailable pipeline (QR, transcription, SMTP relay) reports explicit error mode with audited alternate path.
      - **Monthly partitioning on `communication.messages` and chat message tables** for 100K-scale retention; keyset cursors for all hot lists.
      - **Maker-Checker on sensitive actions** — external email send with DLP flags, permission grants, admin overrides require second approval.
      - **Config-as-data** — retention policies, DLP rules, allow-lists, SLA thresholds stored in `configuration` tables, not hardcoded.

      ## Step-by-step:
      - **Step 1 — Schema alignment & gap fill:** Add missing tables (`chat_attachments`, `chat_read_receipts`, `email_folders`, `internal_emails` extensions if needed), verify RLS policies on all `comms` tables, register in `COUNTRY_AWARE_TABLES`, apply monthly partitioning to `communication.messages`, create Alembic migrations with downgrade + contract tests. *Done when:* drift gate green + RLS verified for every comms table.
      - **Step 2 — Chat completion:** Implement rich attachments via `media_assets`, voice note recording with waveform, read receipts (`chat_read_receipts`), typing indicators/presence via Redis, reply threading, edit/delete with audit logging, emoji reactions, full-text search, message forwarding, retention policies, and legal-hold support. *Done when:* 1:1 voice-note + image chat realtime E2E passes.
      - **Step 3 — Video conferencing hardening:** Ensure WORM storage for recordings, real-time transcription pipeline, action-item extraction → task creation, watermark enforcement, boardroom mode, and transcript translation. *Done when:* recording lands in WORM storage with transcript and action items.
      - **Step 4 — Internal email completion:** Implement smart routing (internal-first resolver), DLP scanning before external send, role-based allow-lists, mandatory BCC to compliance, bulk send (`POST /email/bulk`), send-from-alias (`POST /email/from-alias`), folder management, and full-text search. *Done when:* external DLP block test passes; internal email never touches SMTP.
      - **Step 5 — Unified Inbox API & frontend deck:** Build `GET /comms/unified-inbox?lens=&cursor=&limit=` (cursor-paginated, server-sorted merge), wire WebSocket deltas to inbox patches, build Confluence five-zone UI (command bar, rail, stage morphing renderer, context inspector, status dock), universal composer with send-as toggle, ⌘K search, keyboard navigation, density toggle, and responsive collapse (tablet/mobile). *Done when:* user resolves mixed email-and-chat thread, finds shared file, jumps on call without switching top-level tabs.
      - **Step 6 — Audit, eDiscovery & compliance:** Wire append-only audit hooks across all Phase 8-5 modules, privacy-gated viewers, eDiscovery export, legal-hold enforcement, retention purge with hold override, and GDPR/PDPL export. *Done when:* every Phase 8-5 action appears in ledger; legal-hold blocks deletion.
      - **Step 7 — Automation wiring:** Auto-translate chat/email AR↔EN, announcement read-confirmation tracking, auto-COI detection on communications, DLP quarantine review queue, and retention policy automation. *Done when:* all automations show run health in admin dashboard.

      ## Discussion notes:
      - **Point 1 — Unified Inbox vs. separate tabs:** The Confluence design inverts the traditional tabbed approach (email | chat | video silos) by making modality a filter, not a room. This requires a unified data model where DMs, channels, emails, videos, and tickets are all threads with a `transport` badge, served by a single aggregator endpoint. The rail renders this merged list; the stage morphs the renderer per transport.
      - **Point 2 — Internal email routing:** The smart resolver must check `users.email` against the recipient list before hitting SMTP. Internal-first delivery is instant, free, and fully audited in-database. External relay requires DLP scan + allow-list check + compliance BCC. This split must be transparent to the composer UI.
      - **Point 3 — Media storage discipline:** Video recordings, voice notes, images, and documents must never touch PostgreSQL columns. The flow is: upload → R2/S3 → `media_assets` metadata row → reference by ID in chat/email/video tables. Async workers handle transcoding, thumbnail generation, and virus scanning.
      - **Point 4 — Real-time vs. HTTP boundary:** WebSocket handles live messages, typing, presence, and inbox patches. REST handles history, search, settings, and admin actions. The boundary must be explicit: WebSocket for ephemeral/real-time, REST for durable/queryable. Do not conflate them.
      - **Point 5 — RLS and country isolation in chat:** A chat room/channel is scoped to `country_code` at creation; every message query is filtered by the session's `app.current_country_code`. Cross-country mentions resolve to notification only, never message content. Admin/global roles see all countries.
      - **Point 6 — WORM and legal-hold:** Video recordings and audit trails are append-only/WORM. A legal-hold on a room/channel freezes deletion for all participants; retention purge jobs must check for active holds before deleting. This is a compliance requirement, not optional.
      - **Point 7 — Frontend morph architecture:** The stage renderer must cross-fade between transports without route changes. This means the page shell (rail + stage + inspector) is persistent; only the stage content swaps. This preserves scroll position, composer draft, and keyboard context.
      - **Point 8 — Backend hybrid state:** Several existing routers (`video_controller.py`, `internal_channels.py`, `audit.py`) and controllers predate the thin-router contract and still import FastAPI or perform DB writes directly. These are being migrated; new comms code must comply with the target contract from day one.

