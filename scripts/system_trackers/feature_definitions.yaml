# =============================================================================
# ZOZI FEATURE DEFINITIONS — SPEC-DRIVEN (v2 schema)
# =============================================================================
# You write WHAT the feature must do. Never file names, never paths.
#   - name        : feature title
#   - scope       : roles (Customer · Supplier · Logistor · Admin · Employee · Internal)
#   - description : the FULL binding build spec (paste your complete prompt).
#                   The tracker auto-extracts checkpoints from it:
#                     * `schema.table`          -> DB table checkpoint
#                     * `/route/{param}/...`    -> API route checkpoint
#                     * UPPER_CASE statuses     -> state-machine checkpoint
#                     * `snake_case` backticks  -> field/identifier checkpoint
#                     * **bold phrases**        -> capability checkpoint
#                     * **Step N — ...** blocks -> milestone checkpoints
#   - sections    : section-wise job per panel (§I Infra, §II Customer,
#                   §III Supplier, §IV Logistor, §V Admin). One sentence each.
# feature_tracker.py does everything else: finds files, tables, routes, tests,
# and computes the completion percentage.
# =============================================================================

version: 2
schema: spec-driven

