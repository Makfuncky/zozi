  - id: SYS_013     #* Admin Command Center — Unified Operations Single Window (6 Zones · 4-Tier Data · Escalation · News · Decision Engine)
    name: Admin Command Center — Unified Operations Single Window
    update_version: "16-08-2026"
    description: |
      Build the **ZOZI Unified Operations Command Center** as the single "Single Window" merging the existing Command Center + Analytics into one role-shaped, RLS-enforced dashboard. Every employee gets a **limited personal dashboard**; Admin gets the **full Command Center**; Admin may **grant Command Center access to others with limited, zone-scoped, country-scoped rights** (Maker-Checker for sensitive zones like Treasury/Fraud). The UI is dynamic, modern, and glanceable: widgets over tables, traffic-light semantics, deep-link every number to its filtered workspace, data-freshness badges per widget (tier + last-updated + `degraded` flag), and alert-fatigue control with dedupe/aggregate repeats and quiet-hours per tier (Tier-3 always breaks through).

      The data architecture uses a strict **4-Tier strategy**: **T1 Real-Time** (2–5s via Redis PubSub → `/ws/admin/telemetry`) for heartbeat, fleet, system issues; **T2 Cache** (5-min TTL via cron → Redis JSON) for growth trends, news, external intel; **T3 Ledger** (instant SQL on `account_balances` only — never order sums) for treasury, VAT, payables; **T4 Nightly MV/OLAP** for trend aggregates, health scores, CLV. Analytics never live-aggregate on the request path (ADR-008). Financial truth comes only from the double-entry ledger (ADR-006).

      The Command Center organizes operational visibility into **6 Zones**: **Z1 Heartbeat** (today's orders/GMV/revenue, active users, live fleet, employees working, system issues); **Z2 Treasury** (available/locked/operating cash, supplier/logistics payables, refund reserve, VAT liability, commission reserve, pending payouts/refunds/disputes); **Z3 Growth** (revenue trend 30d, country-wise sales map, category/product trends, top searches + zero-results, gender split, signups, CLV, cash-runway forecast); **Z4 Workforce/Ops** (on-duty roster, performance tickers, bottlenecks, shift handovers, grievances); **Z5 External Intel** (Market Radar news ticker, Regulatory Shield, FX ticker + margin alerts, supply-chain alerts, competitor price index, sentiment/NPS pulse, PR crisis radar); **Z6 Engine Room & Fraud** (API p95/p99, error rate, CPU/mem, DB conns/replication-lag/disk, Redis hit/eviction, gateway success heatmap, CDN health, live attack map, chargeback velocity, ATO radar).

      The **Human Operations layer** provides the active cockpit: **Broadcasts** (Global vs Local color-coded dismissible banners with read-confirmation tracking); **Shift handover logs** (mandatory end-of-shift digital sign-off, incoming shift must acknowledge, block clock-out until filed); **Escalation Siren** (Tier-1 Country Manager 2h ack timer → Tier-2 Country Head/Finance in-alert Approve/Block → Tier-3 Admin/CTO SMS/email fallback + red flash; every ack/action → append-only audit); **War-Room chat** (entity-attached threads, @mentions deep-link to exact screen with action button ready, auto-translate AR↔EN); **Safe Box** (supplier grievances vs staff + anonymous whistleblower channel visible only to Global Admin/Compliance, SLA-penalty tracker requiring Admin sign-off); **Follow-the-sun handoff view** (auto-highlights which country shift is handing over now).

      The **News & Market Intelligence pipeline** ingests `news_sources` (RSS/API/scrape) and `news_articles` with SHA256 `content_hash` dedupe, AI enrichment staged (entity→country/module map, sentiment, relevance score <40 discarded, ADR-007), PubSub → WS ticker, audience routing (Admin Market Radar / Supplier Insights / Public SEO blog), moderation queue + flush-now + publish toggle, auto-publish only ≥ confidence threshold. **Regulatory Shield** tracks ZATCA Phase-2 e-invoicing, PDPL/GDPR audit countdown + encryption %, VAT filing countdowns linked to ledger `2040` with T-7/T-3/T-1 alerts. **What-If Simulation Engine** reads snapshots only, outputs labeled "projection — not truth", never writes to ledger; launched via Ctrl+K.

      The **Decision Engine & monitoring** uses config-driven anomaly rules (delayed >5% active → red; zero-search spike → "Alert Procurement"; VAT > threshold + due ≤4d → "Generate Tax Report"; gateway <85% → auto-reroute + badge) with deep-link action buttons into pre-filtered workspaces. Zone 6 monitoring embed tracks app p95/p99, error rate, CPU/mem; DB conns/slow-query/replication-lag/disk; Redis mem/hit/eviction; business metrics; alerts with thresholds.

      The **Country Control Plane** is integrated, not siloed: normalized schema splits `country_configs` into basics/economics/tax/legal + `country_cities`, `country_category_tax_rates`, `country_config_versions` (draft→approve→publish→rollback), `country_feature_flags`, `country_staff_assignments`. **Heuristic Orchestrator** fetches from RestCountries/WorldBank/GeoDB/Nager.Date with 48h Redis cache and explicit `degraded` flags; gateway ranking 0–100; commission-tier generator; KYC-tier auto-assign; logistics model recommender; restricted-category auto-tag; source-transparency badges in UI. **Ghost-Row Ledger UI** provides inline expandable create row, 600ms debounced auto-map search, 17-tab workspace, inline editors within algorithmic bounds, masked keys + "Test Connection". **Downstream auto-wiring** ensures checkout gateways, supplier KYC fields, moderation blocks, payout holds/minimums, ETA holiday-skip all read country config live (no deploys). Cross-border detection, dynamic currency/tax swap, deep localization (Eastern Arabic numerals, Hijri, RTL logical CSS, dynamic address builder), draft-to-publish safety net, localized legal PDF generation, immutable financial edit audit with mandatory reason, data-residency KMS + export redaction, geospatial maps.

      The **Automation System** runs 16 automations: metric aggregation (T2 Redis JSON + T4 MV refresh); live telemetry push (outbox → PubSub → WS heartbeat); escalation engine (tier timers → auto-escalate → SMS/email); news flush & enrich (15-min cron); gateway health & reroute (<85% auto-reroute); fraud watch (attack map, chargeback >1% critical); decision-engine anomalies (deep-link action cards); handover enforcement (block clock-out); broadcast targeting (global/local routing + read-confirm); regulatory countdowns (VAT from ledger, ZATCA/PDPL timers T-7/3/1); sentiment & PR radar; What-If sims (snapshot-only projections); auto-digests (daily CEO briefing); dashboard personalization (role login, zone/widget layout per role, saved layouts, compare-mode); country orchestrator (new-country search → draft → publish approval with degraded flags); KPI watchdog (hourly targets vs actuals, auto-tickets).

      ## Capabilities:
      - **Unified Single Window:** Merge Command Center + Analytics into one role-shaped dashboard; delete duplicate page after cutover; same URL for all, UI + data auto-shaped by role layer (Global > Country > Hierarchy) + RLS.
      - **Role-Based Access & Visibility:** CEO/Global Admin = aggregated global; Country Head = identical UI filtered to assigned countries; Employee = personal KPIs only; zone-level permission strings (`cc.treasury.view`, `cc.fraud.view`, `cc.workforce.view`…) in frozen permission catalog; sensitive grants use Maker-Checker; assignment audited in `admin_change_audit_logs`.
      - **4-Tier Data Strategy:** T1 Real-Time (2–5s Redis PubSub/WS), T2 Cache (5-min cron Redis JSON), T3 Ledger (instant SQL on `account_balances` — never order sums), T4 Nightly MV/OLAP (`daily_trend_aggregates`); data-freshness badge per widget (tier + last-updated + `degraded` flag); explicit stale/degraded badges on lag.
      - **6-Zone Dashboard:** Z1 Heartbeat, Z2 Treasury, Z3 Growth, Z4 Workforce/Ops, Z5 External Intel, Z6 Engine Room & Fraud — each with traffic-light semantics, sparklines, deep-link action buttons, and skeletons on load.
      - **Human Operations Cockpit:** Broadcasts (global/local, color-coded, dismissible, read-confirm tracked); shift handover logs (mandatory sign-off, block clock-out); Escalation Siren (Tier-1→2→3 with timers, SMS/email fallback, append-only audit); War-Room chat (entity-attached threads, deep-link, auto-translate AR↔EN); Safe Box (Global Admin/Compliance only, SLA-penalty tracker); Follow-the-sun handoff view.
      - **News & Market Intelligence:** `news_sources` + `news_articles` with SHA256 dedupe, AI enrichment staged (sentiment/tags/relevance ≥40), audience routing (Admin/Supplier/Public), moderation queue + flush-now, Regulatory Shield (ZATCA/PDPL/VAT countdowns linked to ledger), What-If Simulation Engine (snapshot-only, labeled projections, Ctrl+K launch).
      - **Decision Engine & Monitoring:** Config-driven anomaly rules with deep-link action cards (procurement, tax report, SLA breach); Zone 6 embed (Prometheus/Grafana/Loki) for app/infra/DB/Redis/business metrics; alert thresholds; auto-reroute gateway <85%.
      - **Country Control Plane:** Normalized schema (`country_configs` split, `country_cities`, `country_category_tax_rates`, `country_config_versions`, `country_feature_flags`, `country_staff_assignments`); Heuristic Orchestrator (RestCountries/WorldBank/GeoDB/Nager.Date, 48h cache, degraded flags, gateway ranking, commission-tier, KYC-tier, logistics recommender, restricted-category auto-tag); Ghost-Row Ledger UI (inline expandable, 17-tab workspace, masked keys); downstream auto-wiring (checkout/KYC/moderation/payouts/ETA); cross-border detection, dynamic currency/tax swap, deep localization, localized legal PDF, data-residency KMS, geospatial maps.
      - **16-Part Automation System:** Metric aggregation, live telemetry push, escalation engine, news flush & enrich, gateway health & reroute, fraud watch, decision-engine anomalies, handover enforcement, broadcast targeting, regulatory countdowns, sentiment & PR radar, What-If sims, auto-digests (daily CEO briefing), dashboard personalization (role-based layouts, compare-mode), country orchestrator (draft→publish), KPI watchdog (hourly targets vs actuals).
      - **Mobile & Accessibility:** Condensed heartbeat + tier-3 alerts + action drawer on mobile; push digests; tap→deep-link; RTL-first Arabic; ARIA/keyboard; density toggle; traffic-light semantics; skeletons + explicit stale badges; compare toggle; admin-pinnable annotations.

      ## Non-negotiables:
      - **Merge Command Center + Analytics into ONE "Single Window"** — read all existing dashboard/analytics code in detail before merging; delete the duplicate page after cutover.
      - **Thin routers** — `backend/routers/{surface}_{domain}_{feature}_router.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/{domain}/*`; controllers delegate.
      - **Alembic is the single schema source of truth** — all schema changes via migrations with downgrade + contract tests; no `create_all` in prod.
      - **RLS on every table** keyed on `country_code` + role; cross-country reads return zero rows without global/admin role; RLS fail-closed per zone.
      - **4-Tier data strategy enforced:** T1 real-time via WS/Redis PubSub, T2 cache via cron+Redis, T3 ledger instant SQL on `account_balances` only, T4 nightly MV/OLAP. No live aggregates on request path for transactional tables.
      - **Financial truth only from double-entry ledger** (ADR-006) — never from order sums, never from denormalized widgets.
      - **No silent fallbacks** — explicit `degraded` flags on every widget/tier; transparency badges; never fake-live data.
      - **Cursor pagination, never OFFSET** on large tables.
      - **Decimal-only** for prices, ratings, and monetary values; never float.
      - **Event-driven writes** — search events, video events, product-change events publish to outbox in the same transaction as business data; consumers subscribe and invalidate caches.
      - **Config-as-data** — permission strings (`cc.*`), alert thresholds, synonyms, boosts, facet definitions, broadcast targets stored in `configuration` tables, not hardcoded.
      - **Background jobs for heavy async work** — metric aggregation, news enrichment, batch embeddings, facet aggregation, and analytics run off the request path via background jobs/Celery.
      - **Append-only audit** — every ack/action/grant/broadcast-read logged to `admin_change_audit_logs`; immutable financial edit audit with mandatory reason.
      - **Read before you change.** Read every existing dashboard/analytics file in full before editing; map duplicates; freeze permission strings before build.
      - **No media bytes in database** — media metadata in `media_assets` (url, mime, hash); bytes in R2/S3.

      ## Step-by-step:
      - **Step 1 — Audit & freeze:** Read all existing Command Center/Dashboard/Analytics code in detail; map duplicates; define unified zone taxonomy + widget catalog; freeze permission strings (`cc.*`) + alert thresholds in config tables. Done when: duplicate-feature map signed off; old routes listed for deletion.
      - **Step 2 — Schema & MVs:** Alembic (downgrade + contract tests): `search_logs`, `user_sessions`, `system_health_events`, `news_sources`, `news_articles`, `escalations`, `broadcasts` (+read_confirms), `shift_handover_logs`, `grievances`; MVs `supplier_health_scores`, `logistics_sla_alerts`, `daily_trend_aggregates`; RLS + indexes on all. Done when: drift gate green.
      - **Step 3 — Tier services:** Cron cache jobs (T2) + WS telemetry channel (T1) hooked to order/shipment/auth events; T3 ledger reader; gateway-health monitor + reroute hook; freshness/degraded metadata on every payload. Done when: dashboard API < 500ms with 50+ metrics; zero raw-table aggregates in request path.
      - **Step 4 — Unified frontend:** Build 6-zone Single Window + Action Drawer + Ctrl+K palette; role variants (employee-limited / country-filtered / global); delete old Analytics page; skeletons, traffic-lights, sparklines, compare-mode, annotations, RTL/AR. Done when: Playwright E2E on all three role views; Lighthouse green.
      - **Step 5 — Human Ops:** Broadcasts + read-confirm; handover enforcement; escalation matrix with timers + audit; entity-attached war-room chat + translate; Safe Box; penalty tracker. Done when: unacked Tier-1 auto-escalates in test; every ack audited.
      - **Step 6 — News & Shield:** Ingestion workers + dedupe + AI enrichment + routing; Market Radar ticker; Regulatory countdowns wired to ledger VAT; moderation queue + flush-now. Done when: 7 clean cron nights; duplicate wire stories deduped 100%.
      - **Step 7 — Engine Room & Fraud:** Prometheus/Grafana/Loki embeds; attack map; chargeback/ATO alerts; CDN-by-region health. Done when: all 5 infra alert rules fire correctly in chaos test.
      - **Step 8 — Decision & Simulation:** Anomaly rule engine + deep-link action cards; What-If simulators (snapshot-only, labeled projections). Done when: each card lands on the pre-filtered workspace with action ready.
      - **Step 9 — Country Plane wiring:** Ghost-row + 17-tab workspace; orchestrator with degraded flags; downstream syncs (checkout/KYC/moderation/payouts/ETA); localization + residency + legal PDFs; geospatial maps. Done when: adding a country changes checkout/KYC/payout behavior with zero deploys.
      - **Step 10 — Watchdog, digests & hardening:** KPI watchdog + auto-tickets; daily auto-digests; alert-fatigue controls; load test (k6) on dashboard; security (RLS fail-closed per zone). Done when: MTTA/ack-SLA baselines met.
      - **Step 11 — Close-out:** Full E2E (CEO/CountryHead/Employee views), heuristics Pytest, schema-drift gate, update `CODEBASE_STATUS_MATRIX_DETAILED.md`. Done when: old duplicate pages removed and matrix green.

      ## Discussion notes:
      - **Point 1 — Single Window merger:** Command Center and Analytics currently replicate/complement each other. The merger must be total: one URL, one set of zones, one data contract. Read every existing dashboard/analytics file before merging; delete the duplicate page after cutover to avoid shadow data.
      - **Point 2 — Role-shaped, not role-gated:** The same URL serves all roles. UI + data auto-shape by role layer (Global > Country > Hierarchy) + RLS. Employee sees personal KPIs + team roster + announcements only; Country Head sees full zones filtered to assigned countries; Admin/CEO sees global + grant management. This avoids maintaining N role-specific routes.
      - **Point 3 — 4-Tier data discipline:** T1 real-time via WS/Redis PubSub (2–5s); T2 cache via 5-min cron + Redis JSON; T3 instant SQL on `account_balances` (1010/2010/2020/2040…) — never order sums; T4 nightly MV/OLAP. Any widget that live-aggregates transactional tables violates ADR-008 and must be moved to T2/T4.
      - **Point 4 — Financial truth from ledger only:** Treasury widgets must read from the double-entry ledger (ADR-006), not from order sums or denormalized snapshots. Widgets showing cash, VAT, payables, commission reserve must query `account_balances` directly.
      - **Point 5 — No silent degradation:** Every widget must surface its data-freshness badge (tier + last-updated + `degraded` flag). If a source is stale or a provider failed, the UI must show explicit `degraded` state. Never fake-live or silently fall back to zeros.
      - **Point 6 — Escalation audit trail:** Every ack/action on an escalation is append-only logged ("alert 14:00, acked 14:05, no action"). The escalation Siren's tier timers must be reliable; missed-SLA must auto-flag for performance review.
      - **Point 7 — News pipeline safety:** AI enrichment is staged (ADR-007). Relevance score <40 discards the article. Auto-publish only ≥ confidence threshold. Moderation queue + flush-now + publish toggle give human control. Regulatory Shield countdowns are linked to ledger `2040` for VAT, not to external estimates.
      - **Point 8 — What-If guardrail:** Simulation outputs are labeled "projection — not truth" and read snapshots only. They must never write to the ledger or trigger real financial actions. Launch via Ctrl+K to keep them discoverable but deliberate.
      - **Point 9 — Country Control Plane live wiring:** All downstream systems (checkout gateways, supplier KYC fields, moderation blocks, payout holds/minimums, ETA holiday-skip) must read country config live (no deploys). Adding a country must change behavior with zero deploys.
      - **Point 10 — Alert-fatigue control:** Dedupe/aggregate repeats; quiet-hours per tier (Tier-3 always breaks through). Unacked Tier-1 auto-escalates in test. Every alert carries a deep-link action button into the pre-filtered workspace.

