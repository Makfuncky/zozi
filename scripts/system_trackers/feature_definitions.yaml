    scope: "Admin · Employee · Internal · Supplier · Logistics"
    sections: |
      §I Infra: Alembic migrations for 4 finance tiers + automation tables; RLS policies on all finance tables keyed by `country_code`; monthly partitioning on audit.audit_logs and events.outbox_events; PgBouncer + get_read_db() for reports; Redis for cache/presence/events; R2/S3 for scanned receipts/invoices/asset photos; materialized views for dashboards; composite indexes (country_code, created_at), (status, due_date), (entity_type, entity_id).
      §II Customer: Customer sees order invoices, payment receipts, refund status; customer-facing checkout with fee-aware payment method totals; payment gateway webhooks drive order fulfillment.
      §III Supplier: Supplier settlements derived from commission_ledger_entries + payout_rules; supplier pre-review links for payout batches; supplier bank account details reflected in payout system; supplier sees payment status and payout status on payout page and order page.
      §IV Logistics: Logistics partner settlements (pickup + delivery charges); COD remittance engine (logistics collects COD → remits to Zozi treasury); logistics partner bank account details reflected in payout system; logistics sees payment status and payout status.
      §V Admin: Full Finance Command Center (`/admin/finance?section=…`) — Dashboard, Treasury (cash·banks·reconciliation·gateway), Ledger (CoA tree·journals·trial balance·pending), Settlements (commissions·payouts·COD·refunds), Receivables (invoices·receipts·aging·dunning), Payables (bills·payments·aging·OCR dropzone), Purchasing (PO·GRN·imports·landed cost), Assets & Capital (fixed assets·loans·investments), Tax & Compliance (VAT·WHT·period close), Reports (builder·saved·scheduled), Automation Tower (controls·exception queue·audit). Admin manages payment gateways (wizard, credential vault, smart routing), commission rules (global/category/supplier/badge), tax configs, bank reconciliations, and all finance configs per country.
      §VI Employee (EMS): Expense submission (camera/upload/`finance@` email → OCR staging), invoice upload, approver actions (maker-checker), voice-to-text finance commands, chatbot queries over CoA/ledger.

