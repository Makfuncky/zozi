  - id: SYS_017     #* AI Provider System and Automation List
    name: AI Provider System and Automation List
    update_version: "16-08-2026"
    description: |
      The AI Provider System and Automation List is the unified AI adapter layer plus the platform-wide automation engine for the Zozi e-commerce marketplace. The AI Provider System centralizes all third-party and in-house AI/ML providers under `backend/providers/**`, enforcing the P1 contract: providers subclass `BaseProvider`/`BaseAIProvider`, implement `health_check()`, are called ONLY by services/ and jobs/, and never import FastAPI. The Automation List defines 20+ automation engines (Workflow, Event, Notification, Scheduled Jobs, Approval, Rule, Assignment, Reminder, Escalation, Finance, Inventory, Order, Logistics, AI, Data, Security, Customer, Supplier, Admin, Monitoring & Recovery) plus platform-level governance (Central Automation Dashboard, enable/disable toggles, dry-run mode, audit trail, version control, role-based permissions). All AI providers must be lightweight (VPS-safe), concurrent/multi-threaded for 1000s of users, thoroughly tested in `backend/tests/_test_provider/**` with results archived in `provider_test/`, and validated against product images from the `image/` directory. Heavy AI/off-request work runs in `backend/jobs/**` via Celery/Redis queues. Media bytes (product images, scanned receipts) go to object storage (R2/S3) referenced by `media_assets`, never in-database blobs.

      ## Capabilities:
      - **Unified AI Provider Registry:** All AI capabilities (image bg removal, image-to-text, voice-to-text, OCR, chatbot, advanced search/vectorization, IP detection, maps/location, country intelligence, admin analytics) are exposed as typed provider classes under `backend/providers/{domain}/{name}_provider.py`, each with `health_check()`, retry logic, and circuit-breaker semantics. Providers are discovered and routed through a central registry, enabling hot-swapping and A/B staging.
      - **Lightweight & Concurrent Execution:** Every provider implementation is optimized for VPS-scale throughput (1000s of concurrent users). CPU-bound inference uses thread-pool or process-pool executors; I/O-bound calls use async/await. Providers never block the API request path — heavy work is delegated to `backend/jobs/**`.
      - **Image Background Removal:** Product image background removal pipeline (referenced Working API models: `br_13.py`, `br_05.py`, `br_06.py`, `br_08.py`, `br_11.py`, `br_12.py`) integrated as `backend/providers/image/background_removal_provider.py`. Accepts product image bytes → returns transparent PNG bytes (or `media_assets` reference). Tested against images in `D:\Projects\10- E-COMMERCE WEBSITE\zozi\image`.
      - **Image-to-Text (Product Analysis):** Reads product images and generates structured product descriptions, tags, product name identification, and variant suggestions. Referenced from `zozi_variant_config.json` and `upload_auto_05.py`. Exposed as `backend/providers/image/product_analysis_provider.py`. Output feeds the supplier product upload modal (SYS_014) and catalog enrichment pipeline.
      - **Voice-to-Text (Product & Finance):** Dual-purpose voice transcription: (1) Supplier product upload — voice commands for adding variants, quantities, and attributes; (2) Finance — voice-driven task creation and expense logging. Exposed as `backend/providers/voice/voice_to_text_provider.py`. Uses lightweight Whisper/CTC models optimized for short commands.
      - **OCR System (Expenses & Assets):** Scans bills and receipts for expense and asset onboarding. Extracts vendor, date, amount, tax, and line items into structured JSON. Exposed as `backend/providers/ai/ocr_provider.py`. Output feeds `finance.expenses` and `assets` tables via services.
      - **AI Chatbot (Customer-Facing):** Vectorized product chatbot for customer queries. Uses RAG over product catalog + order history + support KB. Exposed as `backend/providers/ai/chatbot_provider.py`. Wired to `backend/controllers/ai/chatbot_controller.py` and `backend/services/ai/chatbot_service.py`.
      - **Advanced Search Engine + Vectorization:** Hybrid search combining full-text search (PostgreSQL FTS) with pgvector embeddings for product images and descriptions. CLIP embeddings for image search; Whisper for voice search. Exposed as `backend/providers/ai/search_vectorization_provider.py` and `backend/providers/analytics/search_analytics_provider.py`.
      - **IP Address Detection & Location:** Customer IP → country/city detection for pricing, RLS context, and logistics assignment. Exposed as `backend/providers/geography/ip_detection_provider.py`. Fallback to manual pin when geo resolution fails.
      - **Map & Location Provider:** Map rendering, geocoding, reverse geocoding, distance matrix for logistics and supplier addresses. Exposed as `backend/providers/geography/map_location_provider.py`.
      - **Country Details Search AI:** AI-powered country intelligence for admin analytics — market entry research, regulatory summaries, currency info, holiday calendars. Exposed as `backend/providers/ai/country_intelligence_provider.py`. Wired to SYS_006 (Country Intelligence) and SYS_013 (Admin Command Center).
      - **Admin Analytics AI:** AI analysis layer for admin dashboards — anomaly detection, trend forecasting, supplier risk scoring, logistics performance insights. Exposed as `backend/providers/ai/admin_analytics_provider.py`.
      - **Automation Engine Catalog:** 20+ reusable automation engines: Workflow (visual builder, trigger→condition→action, approvals, parallel/scheduled, versioning), Event (pub/sub, queue, retry, DLQ, monitoring), Notification (email/SMS/WhatsApp/push/in-app, templates, retry), Scheduled Jobs (cron, recurring, delayed, one-time, history, monitoring), Approval (single/multi-level, auto-approval, escalation, history), Rule (business/country/supplier/customer/promotion/logistics rules), Assignment (delivery/support/complaint/task assignment, load balancing), Reminder (payment/KYC/expiry/follow-up/renewal), Escalation (SLA monitoring, auto-escalation, levels, manager notification), Finance Automation (auto journal, commission, settlement, payout, reconciliation, refund), Inventory Automation (stock updates, low-stock alerts, out-of-stock, auto reservation, sync), Order Automation (validation, supplier routing, split-order, status updates, return workflow), Logistics Automation (delivery assignment, route optimization, pickup scheduling, tracking, POD verification, COD reconciliation), AI Automation (product description, categorization, image optimization, duplicate detection, content moderation), Data Automation (import/export, cleanup, archive, backup verification), Security Automation (login monitoring, suspicious activity, account lock, session cleanup, API monitoring), Customer Automation (welcome journey, cart abandonment, review requests, loyalty rewards, re-engagement), Supplier Automation (KYC, store approval, product approval, performance alerts, payout notifications), Admin Automation (dashboard alerts, health monitoring, error reporting, daily/weekly summary), Monitoring & Recovery (automation logs, failure alerts, retry queue, execution history, performance metrics).
      - **Platform Automation Governance:** Central Automation Dashboard with enable/disable per automation, execution priority, dependency management, dry-run/test mode, audit trail, version control, role-based permissions, and API-triggered automations.
      - **Test-Driven Provider Validation:** Every provider has unit and integration tests in `backend/tests/_test_provider/**`. Test results are archived in `provider_test/` with before/after comparisons. Tests run twice per validation cycle to ensure 100% correctness. Test images are drawn from the `image/` directory.

      ## Non-negotiables:
      - **All AI providers subclass `BaseProvider`/`BaseAIProvider`** and implement `health_check()` — no provider bypasses the registry.
      - **Providers called ONLY by services/ and jobs/** — never by routers or controllers directly.
      - **Lightweight models only** — every provider must be VPS-safe; heavy models are rejected unless quantized/optimized.
      - **Concurrent/multi-threaded execution** — CPU-bound inference uses thread/process pools; I/O-bound uses async; never block the API request path.
      - **Media bytes in object storage (R2/S3), never in-database blobs** — `media_assets` stores only metadata (url, mime, hash, w/h, ai_status).
      - **Thin routers** — `backend/routers/{surface}_{domain}_{feature}_router.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/{domain}/*`; controllers delegate.
      - **Heavy AI/off-request work in `backend/jobs/**`** — Celery/Redis queues for transcoding, batch inference, PDF generation, analytics aggregation.
      - **Event-driven writes** — services publish commands/events to outbox in the same transaction as business data; consumers subscribe.
      - **No silent fallbacks** — any unavailable AI pipeline (bg removal, OCR, transcription) reports explicit error mode with audited alternate path.
      - **Config-as-data** — provider model versions, thresholds, enable/disable flags, retry policies stored in `configuration` tables, not hardcoded.
      - **Append-only audit logs** — every AI inference call and automation execution is logged with actor=system, model version, latency, tokens, and result hash.
      - **RLS on every AI/automation table** keyed on `country_code`; cross-country reads return zero rows without global/admin role.
      - **Decimal-only arithmetic** for all money fields in finance automations; never float for currency.
      - **Maker-Checker on sensitive automations** — finance disbursement, permission grants, admin overrides require second approval.
      - **Automation logs immutable** — execution history, retry queue, and failure alerts are append-only; no silent deletions.

      ## Step-by-step:
      - **Step 1 — Provider inventory & migration:** Audit all existing AI/automation code across `backend/`, catalog current providers and jobs, identify gaps against the 10 AI provider types + 20 automation engines. Migrate any orphaned scripts into `backend/providers/**` and `backend/jobs/**`. *Done when:* every AI capability maps to one provider class; every automation maps to one engine module.
      - **Step 2 — Lightweight model selection & integration:** For each provider, select or fine-tune lightweight models (quantized ONNX/TensorRT, distilled Whisper/CLIP, TinyLlama/Phi for chatbot). Implement concurrent execution pools. Validate against product images in `image/` and test receipts. *Done when:* all providers pass latency SLA (p95 < 500ms for inference, < 2s for batch) under 100 concurrent users in staging.
      - **Step 3 — Provider registry & health checks:** Build `backend/providers/registry.py` as the central discovery and routing layer. Every provider implements `health_check()` returning status, model version, and last-used timestamp. Circuit-breaker semantics: 3 consecutive failures → circuit open → explicit error. *Done when:* registry lists all providers; health endpoint `/health/ai-providers` returns live status.
      - **Step 4 — OCR & document automation:** Implement `ocr_provider.py` for bill/receipt scanning. Wire to `backend/services/finance/expense_service.py` and `backend/services/audit/asset_service.py`. Output structured JSON (vendor, date, amount, tax, line items). *Done when:* sample receipt scan produces correct structured JSON in 2 tests.
      - **Step 5 — Image bg removal & product analysis:** Implement `background_removal_provider.py` and `product_analysis_provider.py` using referenced Working API models. Wire to supplier product upload modal (SYS_014) for auto-background removal and auto-tagging. *Done when:* product image uploaded → bg removed → description/tags/variant suggestions generated in < 3s.
      - **Step 6 — Voice-to-text & chatbot:** Implement `voice_to_text_provider.py` (short-command optimized) and `chatbot_provider.py` (RAG over product catalog + order history). Wire to supplier mobile upload and customer support chat. *Done when:* voice command "add red variant size L quantity 50" produces correct product mutation; chatbot answers product query with citation.
      - **Step 7 — Advanced search vectorization:** Implement `search_vectorization_provider.py` (CLIP for images, FTS+pgvector for text) and wire to SYS_012 (Advanced Smart Search). Hybrid ranking: vector similarity + FTS + business rules. *Done when:* image search returns visually similar products with > 85% precision@10.
      - **Step 8 — IP detection, maps & country intelligence:** Implement `ip_detection_provider.py`, `map_location_provider.py`, and `country_intelligence_provider.py`. Wire to SYS_008 (Country Page) and SYS_013 (Admin Command Center) for auto country research and logistics geo-resolution. *Done when:* IP lookup resolves correct country; manual-pin fallback works on failure.
      - **Step 9 — Admin analytics AI:** Implement `admin_analytics_provider.py` for anomaly detection, trend forecasting, supplier risk scoring. Wire to SYS_013 dashboards. *Done when:* anomaly alert fires within 1 hour of data drift in staging.
      - **Step 10 — Automation engine foundation:** Implement the 20 automation engines as `backend/services/automation/{engine_name}_service.py` with `backend/jobs/automation_{engine_name}_worker.py` for async execution. Central registry in `backend/services/automation/automation_registry.py`. *Done when:* all 20 engines expose start/stop/dry-run/status endpoints.
      - **Step 11 — Platform governance dashboard:** Build Central Automation Dashboard (Admin UI) showing enable/disable per automation, execution priority, dependency graph, dry-run mode, audit trail, version control, and role-based permissions. *Done when:* admin can pause any automation, run dry-run, and view execution history.
      - **Step 12 — Testing & validation:** Write unit tests for every provider in `backend/tests/_test_provider/**`. Run each test twice per validation cycle. Archive results in `provider_test/`. Validate against product images in `image/` and sample receipts. *Done when:* all providers pass 2 consecutive validation cycles with zero failures.

      ## Discussion notes:
      - **Point 1 — Provider as adapter, not logic owner:** Providers are thin adapters around external AI services or optimized local models. They must not contain business logic; business logic lives in `backend/services/{domain}/*`. This preserves the P1 contract and allows providers to be swapped without touching orchestration code.
      - **Point 2 — Lightweight is non-negotiable:** The platform runs on VPS infrastructure where GPU memory is scarce. Providers must use quantized/distilled models (e.g., TinyLlama, DistilWhisper, MobileCLIP) or remote API fallbacks. Any model requiring > 2GB VRAM is rejected unless it runs on a dedicated worker node.
      - **Point 3 — Concurrent execution pools:** AI inference is CPU/GPU-bound. The provider registry must manage a bounded thread/process pool per provider type, with queue-depth monitoring and backpressure. Exhaustion returns explicit 429/503, never silent degradation.
      - **Point 4 — Test archive discipline:** Every validation cycle produces a timestamped archive in `provider_test/` containing inference outputs, latency histograms, and pass/fail counts. This creates an audit trail for model updates and helps detect regressions when swapping model versions.
      - **Point 5 — Automation as first-class citizen:** The 20 automation engines are not feature-specific plugins; they are platform primitives. Order Automation, Finance Automation, and Logistics Automation consume the same Workflow, Event, and Rule engines. This eliminates duplicated orchestration logic across domains.
      - **Point 6 — Dry-run and audit trail:** Every automation supports dry-run mode for testing. Every execution is logged to an append-only `automation_runs` table with actor=system:<job>, input hash, output hash, latency, and status. Failed executions go to an explicit Exception Queue (Rule #16 from EMS principles).
      - **Point 7 — Backend hybrid state:** Some existing AI code (`core/ai_controller.py`) predates the thin-router contract and still imports FastAPI or performs DB writes directly. New AI/automation code must comply with the target contract from day one; existing code is being migrated.
      - **Point 8 — Media bytes discipline:** Product images, scanned receipts, and generated thumbnails must never touch PostgreSQL columns. The flow is: upload → R2/S3 → `media_assets` metadata row → reference by ID in product, expense, and asset tables. Async workers handle virus scanning and thumbnail generation.

