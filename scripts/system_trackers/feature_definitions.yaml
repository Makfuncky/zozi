        PAY["Payout Engine<br/>(supplier + logistics settlement)"]
        COM["Commission Engine<br/>(per order item, immutable ledger)"]
        EX["Exception Queue<br/>(mismatches, low-confidence)"]
        AD["ADMIN: Finance page<br/>gateway wizard, charge approval,<br/>bank verification, money circuits"]
      end

      C1 -->|COD| L1
      C1 -->|Card| GW
      L1 --> L2 --> TR
      GW --> TR
      TR --> REC
      REC --> PAY
      PAY --> S3
      PAY --> L4
      TR --> COM
      COM --> PAY
      C3 -->|refund| REC
      REC -->|reverse entries| TR
      S4 --> COM
      L1 -->|charges approved by| AD
      AD -->|verifies| S1
      AD -->|verifies| L1
      AD -->|configures| GW
      AD -->|views| REC
      AD -->|manages| PAY
      AD -->|manages| EX
      ```

