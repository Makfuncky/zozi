  - id: SYS_005     #* Multi-Country Admin Onboarding & Management System
    name: Multi-Country Admin Onboarding & Management System
    update_version: "16-08-2026"
    description: |
      The Multi-Country Admin Onboarding & Management System is the operating "control plane" that lets any country be launched and run as a configuration package through admin-managed workflows — with full isolation and country-scoped management of employees, country heads, suppliers, customers, accounts, finance, banners, promotions, commissions, auto-tax detection, treasury, logistics, payment gateways, and reconciliation. It works hand-in-hand with the Country Intelligence feature (companion document `COUNTRY_INTELLIGENCE_AUTO_RESEARCH.md`), which supplies the research data used to seed each new country. The goal is to make launching a new country a **configuration-and-approval action**, not a code deployment. The system enforces **RLS on every country-scoped table** keyed on `country_code`, provides a **Draft → Approve → Publish → Rollback** lifecycle for country configurations, and implements a **3-layer RBAC** (Global Admin → Sub-Admin → Country-scoped roles) with country-dimensional permissions. An **Algorithmic Heuristic Engine** auto-populates sensible defaults for new countries (payment gateway ranking, commission tiers, KYC rules, COD reliance, payout settings, logistics model, fraud risk scoring). The **Admin Control Plane** provides a single control surface for country config CRUD with validation guardrails, version history, immutable audit logs, and preview endpoints.

      ## Capabilities:
      - **Two-sided country launch:** Country Intelligence (research profile) + Country Admin System (live configurable country) — research JSON seeds the configuration package; admin publishes via Draft→Approve→Publish→Rollback.
      - **Universal shared runtime:** Single code path for all countries — country context middleware with validated fallback (JWT → staff assignment → IP → header), universal tax service, logistics service, commission resolution, and product listing filtered by request country context.
      - **Admin control plane:** Country config CRUD with validation guardrails, Draft→Approve→Publish→Rollback lifecycle, version history via `CountryConfigVersion`, immutable audit logs, and preview endpoints for tax/logistics/commission outcomes.
      - **Country configuration package:** Data-only package containing identity (code, name, timezone, currency), tax (type/rate/name, inclusivity, reduced/exempt category maps), logistics (model + rates/zone payloads), commissions (category defaults and overrides), payments + feature flags + emergency toggles.
      - **14 country-scoped sub-systems:** Employees & Staff Management, Country Head & Hierarchy, Supplier Management, Customer Management, Banner & Promotion Management, Product & Supplier Management, Logistic Partner Management, Payment Gateway System, Accounts/Finance & Treasury, Auto-Tax Detection, Commission System, Feature Flags & Safety Switches, Localization, Analytics.
      - **Algorithmic heuristic engine:** Auto-populates defaults for new countries — payment gateway ranking (0-100), commission tiers by category adjusted by GDP/region, KYC rules by GDP tier, COD reliance by internet penetration, payout settings by GDP, logistics model by GDP/population, fraud risk scoring.
      - **Data isolation & RLS:** Enforced PostgreSQL RLS on `suppliers`, `products`, `orders`, `banners`, `promotions`, `employees`, `logistics_partners`, `payouts` keyed on `country_code`; `CountryContextMiddleware` sets context from JWT → staff assignment → IP → header; super-admin global view via `/admin/global/...` or `?country=all`.
      - **3-layer RBAC:** Global roles (`admin`, `sub_admin`) + country-scoped roles (`country_head`, `country_manager`, `country_finance`, `country_moderator`, `country_operations`); `ADMIN_PERMISSION_MAP` extended with `country_code` dimension; `CountryStaffAssignment` auto-syncs permissions into JWT claims.
      - **Country onboarding wizard:** `/admin/countries/new` → auto-populate from research JSON or `country_curated.py` → create all default configs → route through draft/approve/publish; supports country cloning (A → B with modifications).
      - **Cross-system integration:** Fraud detection (`fraud_risk_tier`), Chat/Video/Email (`CountryCommunicationThread`), Employee Management (`CountryStaffAssignment`), Treasury/Finance (country-scoped payouts, COD settlement, reconciliation).

      ## Non-negotiables:
      - **RLS on every country-scoped table** — `country_code` enforced at PostgreSQL level; cross-country reads return zero rows without global/admin role.
      - **Draft → Approve → Publish → Rollback** — every country configuration change goes through this lifecycle; version history via `CountryConfigVersion`; rollback target under 5 minutes.
      - **Thin routers** — `backend/routers/{surface}_{domain}_{feature}_router.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/{domain}/*`; controllers delegate.
      - **Event-driven writes** — services publish commands/events to outbox in the same transaction as business data; consumers subscribe.
      - **Config-as-data** — tax rates, logistics rules, commission defaults, payment methods, feature flags, safety switches stored in `configuration` tables, not hardcoded.
      - **No branch-specific runtime logic** — any new country launches by configuration package through admin workflows; no code deployment required for normal market updates.
      - **Country context middleware** — resolves country from JWT claim → staff assignment → IP detection → header with validated fallback; all `/admin/*` routers accept `country_code` path param and call `enforce_country_access()`.
      - **Append-only audit logs** — every publish/rollback/staff assignment/config change is logged; no UPDATE/DELETE on audit records.
      - **Preview before publish** — admins can validate tax/logistics/commission outcomes before publishing via preview endpoints.
      - **Approval policy enforced** — tax and commission publish requires finance/compliance approver roles; logistics and payments publish requires operations approver role.

      ## Step-by-step:
      - **Step 1 — Schema alignment & RLS enforcement:** Enable RLS on `suppliers`, `products`, `orders`, `banners`, `promotions`, `employees`, `logistics_partners`, `payouts`; verify `CountryContextMiddleware` sets `request.state.country_code` correctly; create Alembic migrations for backfill columns (`country_code` FK on global tables). *Done when:* RLS verified for every country-scoped table; cross-country query returns zero rows for non-admin.
      - **Step 2 — Country config CRUD & lifecycle:** Implement `country_configs` master table CRUD with Draft→Approve→Publish→Rollback states; version history via `CountryConfigVersion`; immutable audit logs; preview endpoints for tax/logistics/commission outcomes. *Done when:* admin can create draft, approve, publish, and rollback a country config with version history.
      - **Step 3 — 14 sub-system universalization:** Scope all `/admin/*` routers with `enforce_country_access(country_code)`; ensure employees, suppliers, products, orders, banners, promotions, logistics partners, payment gateways, finance, tax, commissions, feature flags are all country-scoped with isolated data. *Done when:* country manager sees only assigned countries' data across all 14 sub-systems.
      - **Step 4 — Algorithmic heuristic engine:** Implement `country_heuristic_engine.py` (`generate_ecommerce_defaults()`) with payment gateway ranking (0-100), commission tiers by GDP/region, KYC rules by GDP tier, COD reliance by internet penetration, payout settings by GDP, logistics model by GDP/population, fraud risk scoring. *Done when:* new country auto-populates all configs with sensible defaults.
      - **Step 5 — 3-layer RBAC:** Extend `ADMIN_PERMISSION_MAP` with `country_code` dimension; implement `CountryStaffAssignment` auto-sync of permissions into JWT claims; frontend `useCountryPermission(permission, countryCode)` hook guards admin components. *Done when:* country head sees only assigned countries; permissions matrix matches section 8.2.
      - **Step 6 — Country onboarding wizard:** Build `/admin/countries/new` wizard — auto-populate from research JSON or `country_curated.py` → create all default configs → route through draft/approve/publish; support country cloning (A → B with modifications). *Done when:* new country launched via wizard without code deployment.
      - **Step 7 — Frontend tab matrix:** Implement all missing tabs (Analytics, Localization) and per-country operational pages under `/admin/{cc}/...`; wire frontend `apiFetchWithCountry()` to inject `X-Country-Code` header; country selector in `AdminLayout` shows only assigned countries. *Done when:* all 16 tabs functional; country selector filters correctly.
      - **Step 8 — Cross-system integration:** Wire `CountryCommunicationThread` for comms, `CrossCountryCustomerSession` for cross-border shopping, `fraud_risk_tier` for fraud scoring, treasury/reconciliation for country-scoped payouts and COD. *Done when:* all integration points verified with Playwright smoke tests.
      - **Step 9 — Hardening & launch gates:** Chaos tests for RLS fail-closed per country; restore drills; Playwright role-login and admin browser flows; verify all 5 launch gates (data readiness, functional correctness, security/isolation, operational readiness, browser confidence). *Done when:* all gates green + sign-off.

      ## Discussion notes:
      - **Point 1 — Configuration over code:** The fundamental principle is that launching a new country must not require a code deployment. All market-specific logic (tax rates, logistics rules, payment methods, commission defaults, feature flags) lives in `configuration` tables editable by admins. The heuristic engine seeds sensible defaults, but every value is overridable via the admin UI.
      - **Point 2 — RLS as the security boundary:** Country isolation is enforced at the PostgreSQL level via RLS, not in application code. This means even if a bug bypasses middleware, the database still enforces isolation. The `app.current_country_code` session variable is set by `CountryContextMiddleware` and consumed by RLS policies.
      - **Point 3 — Shared runtime vs country-specific code:** The runtime is universal — the same code path serves all countries. Country-specific behavior comes from data (country_configs rows), not from `if country == 'OM'` branches. The only exception is legacy helpers being migrated out.
      - **Point 4 — Heuristic engine as onboarding accelerator:** The `generate_ecommerce_defaults()` function proposes sensible defaults so onboarding is near one-click. However, every proposed value must be reviewable and overridable before publish. The engine is a starting point, not a final authority.
      - **Point 5 — 3-layer RBAC design:** Permissions are open and in the Admin's hand. Admin creates categories and grants permission to Sub-Admin, who grants permission to Employees. The `country_code` dimension is added to every permission, so a Country Head only sees their assigned countries. This replaces the fragmented current role system.
      - **Point 6 — Draft/Publish/Rollback as safety net:** The Draft→Approve→Publish→Rollback lifecycle ensures that any configuration change can be previewed, approved by the right role, and rolled back within 5 minutes if something goes wrong. `CountryConfigVersion` records each published state for audit and cloning.
      - **Point 7 — Backend hybrid state:** Several existing routers (`country_admin.py`, `country_staff.py`, `country_payouts.py`) and controllers predate the thin-router contract and still import FastAPI or perform DB writes directly. These are being migrated; new country code must comply with the target contract from day one.
      - **Point 8 — Cross-country customer sessions:** `CrossCountryCustomerSession` tracks customers shopping across countries. This is a deliberate exception to strict country isolation — customers can browse other countries' catalogs, but their primary context and data residency remain tied to their home country.

