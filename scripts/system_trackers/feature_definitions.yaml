  - id: SYS_011     #* Email System (Transactional · Newsletter · Campaigns · Runtime Provider)
    name: Email System (Transactional · Newsletter · Campaigns · Runtime Provider)
    update_version: "16-08-2026"
    description: |
      The Email System is the unified email delivery platform for the ZOZI marketplace, covering transactional emails (verification, password reset, order/payment/refund/return/shipment milestones), newsletter subscription management, marketing campaign orchestration with A/B testing, and runtime provider configuration with hot-reload. The system implements a smart addressing router: internal employee addresses are delivered in-database (instant, free, audited), while external addresses are routed through SMTP relay with DLP scanning and allow-list checks. `EmailProviderConfig` is the runtime source of truth for provider credentials, sender addresses, and delivery modes, persisted via Alembic and cached with hot-reload. All media attachments use `media_assets` for metadata only (bytes in R2/S3). Event-driven writes publish to outbox in the same transaction; Resend webhooks ingest delivery events and suppressions. The frontend provides web admin dashboards for campaign/template/provider management and customer-facing surfaces for verification, password reset, and newsletter preferences.

      ## Capabilities:
      - **Transactional Email Delivery:** Customer email verification (send + resend), password reset flow, and milestone emails for order creation, payment, refund, return, and shipment updates — all routed through purpose-specific sender identities (verification, password_reset, transactional, notification, alert, promotional, login_verification, default).
      - **Smart Internal-First Addressing Router:** Composer/recipient resolver searches the employee directory first; matching internal `users.email` addresses receive in-database delivery (instant, audited, free). External addresses pass through SMTP relay with DLP scanning, role-based allow-lists, and mandatory compliance BCC for sensitive roles.
      - **Newsletter Subscription Management:** Customer-facing subscribe, unsubscribe (with token), and preference management flows; public newsletter landing page and reusable signup components on web and mobile.
      - **Email Template & Campaign Management:** Admin CRUD for email templates and campaigns; campaign send queue with background-job processing; recipient tracking; open/click tracking via link rewriting; A/B subject-line testing with winner selection and analytics.
      - **Runtime Provider Configuration:** DB-backed `EmailProviderConfig` as the single source of truth for provider credentials, sender addresses, and delivery mode; admin API to read, update, and test-send configuration; hot-reload via cache invalidation without restart; capability flags exposed (never secrets) in API responses.
      - **Resend Webhook & Delivery Events:** Webhook ingestion for Resend delivery events; persistent `EmailDeliveryEvent` table; suppression list (`EmailSuppression`) with upsert logic; delivery status queries and sender address resolution.
      - **Sender Purpose Mapping:** Purpose-specific sender identity mapping (default, promotional, transactional, notification, alert, verification, login_verification, password_reset) resolved at send time from DB config first, env config second, preview fallback last.
      - **Admin Oversight & Analytics:** Admin email dashboard with campaign management, template management, delivery settings tab, provider config manager, campaign analytics, and suppression visibility.

      ## Non-negotiables:
      - **All media bytes in object storage (R2/S3), never in-database blobs** — `media_assets` stores only metadata (url, mime, hash, w/h, ai_status).
      - **RLS on every email table** keyed on `country_code`; cross-country reads return zero rows without global/admin role.
      - **Thin routers** — `backend/routers/{surface}_{domain}_{feature}_router.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/{domain}/*`; controllers delegate.
      - **Event-driven writes** — services publish commands/events to outbox in the same transaction as business data; consumers subscribe.
      - **Alembic is the single schema source of truth** — all schema changes via migrations with downgrade + contract tests; no `create_all` in prod.
      - **No silent fallbacks** — any unavailable pipeline (SMTP relay, webhook ingestion, provider) reports explicit error mode with audited alternate path.
      - **Config-as-data** — retention policies, DLP rules, allow-lists, sender purposes, and delivery modes stored in `configuration` tables, not hardcoded.
      - **Background jobs for heavy async work** — campaign send queue and batch operations run off the request path via background jobs/Celery.

      ## Step-by-step:
      - **Step 1 — Schema alignment & gap fill:** Verify existing email models (`EmailVerificationToken`, `PasswordResetToken`, `NewsletterSubscriber`, `EmailTemplate`, `EmailCampaign`, `CampaignRecipient`, `EmailProviderConfig`, `EmailSuppression`, `EmailDeliveryEvent`) are in correct domain schemas, RLS policies enforced, Alembic migrations present with downgrade + contract tests. *Done when:* drift gate green + RLS verified for every email table.
      - **Step 2 — Transactional email completion:** Wire email verification (send + resend), password reset, and milestone emails (order/payment/refund/return/shipment) through `transactional_email_service` with purpose-specific sender identity mapping, DLP scanning before external send, and role-based allow-lists. *Done when:* end-to-end transactional email flows pass for all milestone types.
      - **Step 3 — Smart internal addressing router:** Implement recipient resolver that checks `users.email` against internal directory first; in-database delivery for internal matches; SMTP relay with DLP + allow-list + compliance BCC for external matches. *Done when:* internal email never touches SMTP; external DLP block test passes.
      - **Step 4 — Newsletter subscription management:** Complete subscribe, unsubscribe (token-based), and preference management flows; public newsletter landing page and reusable signup components on web and mobile. *Done when:* subscribe/unsubscribe/preference flows E2E pass.
      - **Step 5 — Admin campaign & template management:** Implement admin email dashboard with template CRUD, campaign CRUD, campaign send queue, recipient analytics, open/click tracking, and A/B subject testing with winner selection. *Done when:* campaign creation → send → analytics flow E2E passes.
      - **Step 6 — Runtime provider configuration:** Complete admin API for `GET/PUT /email/config/runtime` and `POST /email/config/test-send`; implement hot-reload via cache invalidation; ensure capability flags exposed (never secrets); wire purpose-specific sender identity mapping. *Done when:* provider config update takes effect without restart; test-send delivers successfully.
      - **Step 7 — Resend webhook & delivery events:** Implement webhook ingestion for Resend delivery events; persist `EmailDeliveryEvent` and `EmailSuppression` records; provide admin suppression management and delivery event querying. *Done when:* webhook events persist correctly; suppression list blocks sends as expected.
      - **Step 8 — Mobile parity & gap fill:** Add mobile admin UI for provider settings and test-send; add suppression-list management UI for support/admin operations; expand transactional email triggers for invoices, finance exceptions, and deeper logistics exception handling. *Done when:* mobile admin provider-config parity passes; suppression management UI available.

      ## Discussion notes:
      - **Point 1 — Internal-first vs external relay:** The smart addressing router must check `users.email` against the recipient list before hitting SMTP. Internal-first delivery is instant, free, and fully audited in-database. External relay requires DLP scan + allow-list check + compliance BCC. This split must be transparent to the composer UI.
      - **Point 2 — Runtime provider config as source of truth:** `EmailProviderConfig` replaces hardcoded env vars as the runtime source of truth. Admin can change provider credentials, sender addresses, and delivery mode without restart. The cache invalidation pattern ensures hot-reload; fallback chain is DB config → env config → preview fallback.
      - **Point 3 — Purpose-specific sender identity mapping:** Different email types (verification, password_reset, transactional, promotional, etc.) require different sender identities. This mapping is stored in `EmailProviderConfig` and resolved at send time, ensuring correct FROM addresses and branding per use case.
      - **Point 4 — Event-driven delivery tracking:** Resend webhooks deliver delivery events asynchronously. The system must persist these events and update suppression lists without blocking the send path. Webhook ingestion failures must be retried and reported explicitly.
      - **Point 5 — DLP and compliance:** External email sends must pass DLP scanning (PII/keywords) before relay. Sensitive roles require mandatory BCC to compliance. These checks must happen before the SMTP relay is invoked, with explicit error reporting on DLP block.
      - **Point 6 — A/B testing and analytics:** Campaign A/B subject testing requires storing both variants, tracking opens/clicks per variant, and automatically selecting the winner. Analytics must be queryable and surfaced in the admin dashboard without blocking send operations.
      - **Point 7 — Newsletter subscription state machine:** Subscribe, unsubscribe (with token), and preference changes must be idempotent and auditable. Token-based unsubscribe must work without authentication. Preference changes must propagate to future campaign sends.
      - **Point 8 — Existing codebase state:** The email system already has substantial implementation (`backend/controllers/email_controller.py`, `backend/utils/email_service.py`, `backend/services/email_event_service.py`, `backend/services/transactional_email_service.py`). New email code must comply with the target thin-router/controller/service contract from day one, migrating any legacy fat routers or DB-writing controllers.

