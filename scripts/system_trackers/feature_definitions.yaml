  - id: SYS_014     #* Supplier Product Upload � Speed-First Automation-First Modal Flow (Photo-First � Voice-First � 5-Step � Under 30s)
    name: Supplier Product Upload � Speed-First Automation-First Modal Flow
    update_version: "16-08-2026"
    description: |
      Build the **ZOZI Supplier Product Upload** as a modal-popup-driven, automation-first 5-step system at `/supplier/products/add` that completes a full product upload (including BG removal, AI analysis, all variant quantity fills, and publish) **in under 30 seconds** for an experienced supplier. The flow supports two equal entry paths: **Process A � Photo-First** (upload/capture image ? BG removal ? AI detect ? auto-fill) and **Process B � Voice-First** (upload/capture image ? BG removal ? voice note ? NLP parse ? auto-fill). Both paths converge at the same variant quantity popups and final verify-publish step.

      **Step 1 � Media Upload Modal:** Supplier taps "Add Product" ? modal with [Take Photo] [Upload File] drag-and-drop zone (JPG/PNG/WebP, 10 MB max), [?? Voice Note] button, and [? Magic Editing] button. Native `capture="environment"` for mobile camera.

      **Step 2 � Parallel Processing:** On Next, fires `Promise.all([removeBg(), analyzeImage()])` on backend via `POST /supplier/upload/analyze-parallel`. Processing modal shows dual progress bars (BG removal + AI analysis), typical total 5�8 s. Auto-closes when both complete.

      **Step 2b � Photo Editing Canvas (optional):** Full-screen canvas panel with 6 BG model one-tap buttons (br05�br13) and image tools (sharpen, denoise, white balance, auto light). "Done ?" returns processed blob.

      **Step 3 � AI Results + Field Review:** Modal shows all AI-filled fields as editable inline items: Name, Description, Category, Tags (chips), Color(s) (auto-detected + add more), Fabric/Type (chip grid from `zozi_variant_config.json`), Price (AI-suggested pre-filled). "Next: Set Quantities ?" button.

      **Step 4 � Quantity Popups per Color:** One modal per color, cycling through colors. Each shows all relevant variant axes (apparel: S/M/L/XL; electronics: storage�RAM; beauty: volume/scent; jewelry: karat/plating). "Fill All = 50" shortcut button fills all inputs at once. Keyboard-friendly: Tab moves between inputs, Enter advances to next color.

      **Step 5 � Final Review & Publish:** Product image thumbnail + all details. Total stock auto-calculated. Three buttons: [Edit Details] (re-opens AI Results), [Edit Images] (re-opens Photo Edit), [? Publish] (POST + success screen "Thank you for using ZOZI").

      **Voice Path (Process B):** Dedicated voice-recording bottom sheet with waveform animation. NLP parse result displayed as editable chips before confirming. Output feeds into same Step 3 AI Results modal.

      **Variant Config System:** Driven by `zozi_variant_config.json` (apparel, electronics, beauty, jewelry, etc.). `backend/services/suppliers/variant_config_service.py` exposes `get_axes_for_category(category, subcategory)` and `get_material_options(product_type)`. Frontend `lib/variantConfig.ts` wraps the config for UI rendering.

      ## Capabilities:
      - **Modal-popup-driven 5-step upload flow:** Step 1 Media Upload, Step 2 Parallel Processing, Step 2b Photo Edit, Step 3 AI Results, Step 4 Quantity per Color, Step 5 Verify & Publish � all as focused modals, not multi-page wizard.
      - **Photo-First and Voice-First parity:** Both paths produce identical product output; voice note ? NLP parse ? same auto-filled fields as image AI analysis.
      - **Parallel BG removal + AI analysis:** Single `POST /supplier/upload/analyze-parallel` endpoint using `asyncio.gather`; cuts Step 2 time by ~40% vs sequential round-trips.
      - **AI auto-fill with human review:** Name, description, category, tags, colors, fabric/type, price suggestion � all auto-detected; supplier retains full edit control before publish.
      - **Variant quantity popups:** One popup per color with relevant variant axes per category; "Fill All = 50" shortcut; keyboard-friendly.
      - **Photo editing canvas:** 6 BG models (br05�br13) + image tools (sharpen, denoise, white balance, auto light) integrated into flow.
      - **Voice transcription + NLP:** `POST /supplier/upload/voice-transcribe` endpoint; NLP parse extracts product name, colors, fabric, quantity hints from spoken description.
      - **Speed target = 30 seconds:** Image selected <1s, parallel processing 5�8s, review 3�5s, quantities 2s � N colors, publish 2�3s; 2-color total ~18s, 4-color ~26s.
      - **Config-driven variant axes:** Product type axes (color/size, storage/RAM, volume/scent, karat/plating) from `zozi_variant_config.json`, not hardcoded arrays.
      - **Supplier-scoped RLS:** All upload queries filtered by `supplier_id`; cross-supplier reads return zero rows without global/admin role.

      ## Non-negotiables:
      - **Thin routers** � `backend/routers/suppliers/supplier.py` parse/validate only; no business logic or DB writes.
      - **Controllers import no FastAPI** � `supplier_upload_controller.py` orchestrates auth/permissions, delegates to services; never own DB writes.
      - **Services own the database** � all persistence in `backend/services/suppliers/*`; controllers delegate.
      - **Alembic is the single schema source of truth** � all schema changes via migrations with downgrade + contract tests; no `create_all` in prod.
      - **RLS on every supplier table** keyed on `supplier_id`; cross-supplier reads return zero rows without global/admin role.
      - **Decimal-only** for prices, ratings, and monetary values; never float.
      - **No media bytes in database** � media metadata in `media_assets` (url, mime, hash); bytes in R2/S3.
      - **Event-driven writes** � product-change events publish to outbox in the same transaction as business data; consumers invalidate caches.
      - **Config-as-data** � variant axes from `zozi_variant_config.json`, not hardcoded; adding a category requires only a config change.
      - **Background jobs for heavy async work** � BG removal and AI analysis run off the request path via background jobs; parallel endpoint coordinates but does not block.
      - **Cursor pagination, never OFFSET** on supplier product lists.
      - **Append-only audit** � every upload/publish/edit action logged to `supplier_audit_logs` or equivalent.
      - **Read before you change.** Read every existing supplier upload file in full before editing; map current flow; freeze variant config schema before build.

      ## Step-by-step:
      - **Step 1 � Audit & freeze:** Read all existing supplier upload code (`/supplier/products/add`, routers, services, frontend pages) in detail; map current flow; freeze variant config schema + permission strings. Done when: current-flow map signed off; old routes listed for replacement.
      - **Step 2 � Backend parallel endpoint:** Implement `POST /supplier/upload/analyze-parallel` using `asyncio.gather` for BG removal + AI analysis; returns combined JSON with bg_removed_url, name, category, tags, colors, variants, price_suggestion. Done when: endpoint returns in <10s with all fields populated.
      - **Step 3 � Variant config service:** Implement `backend/services/suppliers/variant_config_service.py` + `GET /supplier/upload/variant-axes`; load `zozi_variant_config.json` at startup; expose `get_axes_for_category` and `get_material_options`. Done when: all 4 category types (apparel, electronics, beauty, jewelry) return correct axes.
      - **Step 4 � Frontend orchestrator + modals:** Build `uploadOrchestrator.ts` state machine (idle ? media ? processing ? photo_edit ? ai_results ? quantity ? verify ? done); implement 6 new components (UploadModal, ProcessingModal, PhotoEditModal, AIResultsModal, QuantityModal, VerifyPublishModal, VoiceModal). Done when: photo flow completes in <30s in Playwright.
      - **Step 5 � Page migration:** Replace `/supplier/products/add` inline layout with single "Add Product" button opening UploadModal; all subsequent steps driven by orchestrator modals. Done when: old scrollable page removed.
      - **Step 6 � Voice & NLP:** Wire `POST /supplier/upload/voice-transcribe`; NLP parse extracts product name, colors, fabric, quantity hints; voice result displayed as editable chips before confirming. Done when: voice flow produces identical output to photo flow.
      - **Step 7 � Testing:** Playwright tests for photo flow, voice flow, all category axes; speed budget validation. Done when: all 3 test cases pass; 2-color upload =18s, 4-color =26s.
      - **Step 8 � Close-out:** Full E2E supplier journey, RLS fail-closed test, schema-drift gate, update `CODEBASE_STATUS_MATRIX_DETAILED.md`. Done when: matrix green; old duplicate upload flow removed.

      ## Discussion notes:
      - **Point 1 � Modal over wizard:** Every step is a focused modal/bottom-sheet, not a multi-page wizard. Keeps supplier context, reduces cognitive load, and enables instant re-entry to any step (Edit Details ? back to AI Results, Edit Images ? back to Photo Edit).
      - **Point 2 � Parallel processing discipline:** BG removal and AI analysis fire simultaneously via `asyncio.gather`. The single `analyze-parallel` endpoint replaces two sequential round-trips, cutting Step 2 by ~40%. Never add sequential waits in the orchestrator.
      - **Point 3 � Variant config as data:** Product variant axes come from `zozi_variant_config.json`, not hardcoded arrays. Adding a new category (e.g., home goods) requires only a config entry, not code changes. The frontend `variantConfig.ts` wrapper makes this transparent to UI components.
      - **Point 4 � Voice-first parity:** Voice path produces identical output to photo path. NLP fills the same fields (name, description, tags, colors, fabric). Quantity popups are identical. This avoids maintaining two separate product schemas.
      - **Point 5 � Speed as non-functional requirement:** Under 30s is a hard target, not a nice-to-have. Every modal must cache results so re-opening is instant. Parallel API calls, debounced auto-save, and "Fill All = 50" are the primary levers.
      - **Point 6 � Media never touches the database:** All image/video bytes go to R2/S3 via the media service. Only metadata (url, mime, hash, width, height) lives in `media_assets`. The BG removal service returns a signed URL, not a blob.

