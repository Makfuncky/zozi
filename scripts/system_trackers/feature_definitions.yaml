  - id: SYS_008     #* Promotion Engine & Loyalty System
    name: Promotion Engine & Loyalty System
    update_version: "16-08-2026"
    description: |
      The Promotion Engine & Loyalty System is the modular, rules-based promotion and loyalty platform for Zozi. It supports **tiered order discounts**, **referral points (ZOZI coins)**, **campaign coupons**, **supplier-funded promotions**, **buy-one-get-one (BOGO)**, **flash sales**, and **loyalty programs** (Bronze/Silver/Gold tiers). The engine is deterministic, auditable, scalable, and fully admin-managed per country. All promotions are recorded in an immutable **Promotion Ledger** and evaluated in a configurable precedence order with stacking/best-only modes. The system inherits constitutional P1 rules: **RLS `country_code`, Alembic-only migrations, event-driven writes (outbox), append-only audit, no silent fallbacks, Decimal-only money math, thin routers, controllers import no FastAPI, services own the database, config-as-data, monthly partitioning, keyset cursors, read/write split**. Strategy: **complete + wire the existing skeleton; do not rebuild.**

      ## Capabilities:
      - **Promotion rules engine:** Custom rules evaluator applies promotions based on conditions in precedence order; supports stacking (multiple promotions combined) or best-only (single best discount) — Admin chooses per campaign.
      - **Order tier discounts:** Admin-configurable thresholds (e.g., 10 OMR → 0.500 OMR off, 25 OMR → 1.500 OMR off, 50 OMR → 4.000 OMR off, 100+ OMR → custom % or fixed) applied server-side at checkout after coupons but before taxes/shipping.
      - **Referral program (ZOZI coins):** Referrer earns 100 points + referee earns 100 points on first paid order; 1,000 points = 1 OMR redeemable on purchases; minimum redemption threshold 1,000 points; points expiry configurable (recommend 12 months); max monthly cap (recommend 20 referrals/month).
      - **Campaign coupons:** Percentage or fixed-amount coupon codes, country-scoped, admin-managed; validation against minimum order, usage limits, expiry; soft-delete/archive with usage-history guard.
      - **Supplier-funded promotions:** Supplier-funded discounts with signed agreement and audit trail; promotion ledger tracks supplier contribution per order item.
      - **BOGO promotions:** Buy 1 Get 1 Free, Buy 2 Get 1 Free, custom ratios; applies to specific products/categories; free item is cheapest qualifying item; inventory validation.
      - **Flash sales:** Time-limited discounts with countdown timer, limited stock, automatic end when time expires or stock depleted; no stacking unless specified; notification via push/SMS/email.
      - **Loyalty program (Zozi Elite):** Bronze (0-500 points, 5% extra), Silver (501-1000 points, 10% extra + free shipping >50 OMR), Gold (1001+ points, 15% extra + priority support); automatic tier upgrades; points earned per OMR spent.
      - **ZOZI coin economy management:** 60-90 day coin expiry with automated reminder notifications; clear exchange rate display (1000 ZOZI Coins = 1 OMR); partial redemption support (part cash, part ZOZI).
      - **Promotion ledger:** Immutable ledger records every promotion application (promotion_id, type, applied_to, user_id, order_id, discount_amount, points_awarded, points_redeemed, source, stacking_flag, created_at, expires_at, admin_id, adjusted_flag).
      - **Admin Promotion Builder:** Master ON/OFF controls, promotion rules set by Admin, stacking mode control, numeric controls (points, caps, delays), percentage controls (max discount percent), amount controls (max discount amount), tier CRUD editor (add/edit/delete/toggle/sort), live discount preview calculator.
      - **Fraud prevention:** Email+phone verification for referrals, payment confirmation before awarding, same IP/device blocking, ML-based clustering for self-referral, rate limiting + CAPTCHA for flash sales, monthly points cap, anomaly detection alerts.
      - **Country-to-country separation:** Every promotion, coupon, tier, and loyalty rule is country-scoped via `country_code` RLS; Admin manages promotions per assigned country; no cross-country promotion leakage.
      - **Checkout integration:** Server-side promotion evaluation during order pricing; promotion applications written to `promotion_ledger_entries`; default config keeps engine OFF to avoid behavior regressions until Admin enables it.

      ## Non-negotiables:
      - **All promotions country-scoped** — RLS `country_code` enforced on every promotion table; cross-country reads return zero rows without global/admin role.
      - **Deterministic evaluation** — same cart always produces the same promotion result; no random or time-based variance in rule evaluation.
      - **Immutable promotion ledger** — every application is append-only; no UPDATE/DELETE on `promotion_ledger_entries`.
      - **Event-driven writes** — services publish commands/events to outbox in the same transaction as business data; consumers subscribe.
      - **Decimal-only money math** — Python `Decimal` + Postgres `NUMERIC(16,4)` everywhere; **no floats** (Penny-Rounding law).
      - **Thin routers** — `backend/routers/{surface}_{domain}_{feature}_router.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/{domain}/*`; controllers delegate.
      - **No silent fallbacks** — any unavailable pipeline (AI rules, cache, notification) reports explicit error mode with audited alternate path.
      - **Config-as-data** — promotion rules, stacking modes, tier thresholds, loyalty rules, expiry periods stored in `configuration` tables, not hardcoded.
      - **Monthly partitioning on `events.outbox_events` and `promotion_ledger_entries`** for 100K-scale retention; keyset cursors for hot lists.
      - **Fraud detection mandatory** — referral velocity monitoring, IP/device fingerprinting, ML anomaly detection; flagged events route to Exception Queue.
      - **Read/write split** — `get_db()` → primary (writes only); `get_read_db()` → replica (catalog, search, analytics reads); dashboards/reports served from materialized views + read replicas.

      ## Step-by-step:
      - **Step 1 — Schema & RLS enforcement:** Add missing promotion tables (`promotions`, `promotion_applications`, `user_points`, `points_transactions`, `promotion_ledger_entries` extensions), verify RLS policies on all promotion tables keyed by `country_code`, register in `COUNTRY_AWARE_TABLES`, apply monthly partitioning to `promotion_ledger_entries`, create Alembic migrations with downgrade + contract tests. *Done when:* drift gate green + RLS verified for every promotion table.
      - **Step 2 — Promotion rules engine & evaluator:** Implement `PromotionEngine` (rules evaluator, precedence order, stacking/best-only logic), `PromotionEvaluator` (fetch active promotions from DB/cache, evaluate rules, calculate final discount, record in ledger). Cache active promotions in Redis. *Done when:* identical cart produces identical discount every time; precedence order enforced correctly.
      - **Step 3 — Admin Promotion Builder & APIs:** Build `/admin/promotions/builder` panel with master ON/OFF, rule configuration, stacking mode, numeric/percentage/amount controls, tier CRUD editor, live discount preview calculator. Wire backend APIs (`GET/PUT /admin/promotions/config`, `GET/POST/PUT/DELETE /admin/promotions/tiers`, `POST /admin/promotions/preview`). *Done when:* Admin can create, edit, preview, and enable/disable any promotion type per country.
      - **Step 4 — Order tier discounts & checkout integration:** Implement server-side order-tier discount application during order pricing when `engine_enabled=true` and `allow_order_tier_discounts=true`; write applications to `promotion_ledger_entries`; default config keeps engine OFF. *Done when:* order total reflects tier discount; ledger entry created atomically.
      - **Step 5 — Coupon codes & validation:** Implement coupon CRUD (global + country-scoped), validation flow (normalize code → lookup → check expiry → usage count → minimum order → calculate discount → cap at maximum), soft-delete/archive with usage-history guard, bulk archive/restore. *Done when:* coupon validation returns correct discount quote; expired coupons return 410; hard delete blocked if usage exists.
      - **Step 6 — Referral program & ZOZI coins:** Implement referral code generation, referee validation (email+phone verified, first paid order, not refunded), points awarding (100 each), points ledger with expiry and monthly cap, redemption flow (minimum 1,000 points = 1 OMR), partial redemption support. *Done when:* referrer and referee both receive points; redemption applies partial cash+coins correctly.
      - **Step 7 — BOGO, flash sales, and loyalty:** Implement BOGO engine (cheapest qualifying item first, inventory validation), flash sale engine (countdown timer, stock depletion, rate limiting + CAPTCHA), loyalty tier engine (automatic upgrades, points multiplier per tier, benefits application). *Done when:* BOGO applies correct free item; flash sale ends on time/stock; loyalty tier upgrades correctly.
      - **Step 8 — Fraud prevention & monitoring:** Implement fraud detection module (IP/device fingerprinting, ML-based clustering, referral velocity monitoring, flash sale bot detection); real-time monitoring dashboard; anomaly alerts to Exception Queue. *Done when:* suspicious referral network flagged; flash sale bot rate-limited.
      - **Step 9 — Frontend builder & customer surfaces:** Build Admin Promotion Builder UI, Coupons Panel, Tier Editor, Preview Calculator; Customer-facing coupon entry, points balance display, referral card, rewards history, scratch-card reveal, available coupons list with expiry; loyalty tier status and benefits display. *Done when:* Admin manages all promotion types; customer sees applied promotions line-by-line at checkout.
      - **Step 10 — E2E test & close-out:** Run full matrix (golden + all promotion types + stacking/best-only + fraud paths + no-fallback checks) on clean Postgres via Alembic; load-test hot lists; update `CODEBASE_STATUS_MATRIX_DETAILED.md` section-by-section. *Done when:* every row green and matrix committed.

      ## Discussion notes:
      - **Point 1 — Modular promotion types:** Each promotion type (order-tier, coupon, BOGO, flash sale, referral, loyalty, supplier-funded) is a pluggable module. The rules engine evaluates them in precedence order; stacking/best-only is configured per campaign. This allows new promotion types to be added without modifying core engine logic.
      - **Point 2 — ZOZI coin as dual-purpose currency:** ZOZI coins serve both as referral rewards and as a loyalty currency. The coin economy must be self-sustaining: coins are earned (referrals, purchases, streaks) and burned (redemptions, partial payments). Expiry and partial redemption prevent hoarding and encourage repeat purchases.
      - **Point 3 — Country-scoped promotions:** Every promotion, coupon, and loyalty rule is scoped to `country_code`. A promotion created for Oman must not apply to Saudi Arabia. RLS enforces this at the database level; the admin UI filters by assigned country. Global promotions (country_code=NULL) are visible in all countries.
      - **Point 4 — Deterministic evaluation:** The rules engine must produce the same result for the same cart every time. No random or time-based variance is allowed in rule evaluation. Cache invalidation happens only on explicit admin changes or campaign expiry.
      - **Point 5 — Fraud as first-class concern:** Referral fraud, coupon stacking abuse, points farming, and flash sale bots are not afterthoughts. The fraud detection module runs in real time during promotion evaluation and flags suspicious patterns to the Exception Queue. Admin sees fraud alerts alongside promotion analytics.
      - **Point 6 — Promotion as part of finance:** The promotion ledger feeds directly into the Finance & Treasury ERP (SYS_004). Discount amounts reduce GMV and revenue; supplier-funded promotions create payables; commission calculations use pre-discount or post-discount values depending on config. The ledger is the handshake between promotions and finance.
      - **Point 7 — Checkout integration discipline:** Promotion evaluation happens server-side during order pricing, never client-side. The client requests a preview, the server returns applied promotions, and the final order total includes all discounts. The default engine OFF state prevents behavior regressions during rollout.
      - **Point 8 — Backend hybrid state:** Several existing controllers (`promotion_controller.py`, `coupons_controller.py`) and routers predate the thin-router contract and still import FastAPI or perform DB writes directly. These are being migrated; new promotion code must comply with the target contract from day one.

