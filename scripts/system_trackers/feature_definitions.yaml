# =============================================================================
# ZOZI FEATURE DEFINITIONS — SPEC-DRIVEN (schema)
# =============================================================================
# ! This file defines the architecture rules (P1 per documents/NEW_STRUCTURE.md),
# ! the feature template (P2), and the status matrix structure (P3). The tracker
# ! reads these sections to verify backend/frontend completeness AND law
# ! conformance. Write WHAT a feature must do. NEVER write file names/paths in
# ! `description` — the tracker finds the evidence in the codebase. Only the
# ! optional `expected:` block may list target paths (use the P1 naming) so the
# ! tracker can verify them.
# =============================================================================
#
# =============================================================================
# P1 - ARCHITECTURE PRINCIPLES & RULES (per documents/NEW_STRUCTURE.md):
# =============================================================================
# * ## THREE AXES:  Module (WHO) = backend/modules/ · Domain (WHAT) = backend/domains/ · Feature (MAY) = backend/rbac/ + domains/*/features.py.  Country = orthogonal 4th axis (RLS scope, country_staff_assignments) — independent of the feature check.
# * ## BACKEND "circuit":  Client → Middleware (platform) → Module routers (thin, actor-scoped, require_feature) → Domain services (orchestrate + business logic + DB) → Domain models/repositories → Infrastructure providers/Redis → PostgreSQL (PgBouncer) + External APIs.
# *     - backend/modules/      → Keeping files [ backend/modules/{module}/{auth|routers|serializers}/ ] — Modules: customer, supplier, logistics, admin, employee. auth/ = per-actor login/session/device-binding against the module's OWN actor tables; routers/ = thin actor routers [ {domain}_{feature}_router.py ] carrying the AUTO-GENERATED marker when emitted (generator emits into modules/{m}/routers/, NOT flat routers/); each file may expose `router` + optional `public_router` (webhooks); modules/{m}/routers/__init__.py lists `routers`/`public_routers` for main.py discovery with prefix /api/{module}. THIN RULE: auth context + require_feature(...) + ONE domain-service call + return response_model — NO DB writes, NO business rules, NO FastAPI-heavy orchestration.
# *     - backend/domains/      → Keeping files [ backend/domains/{domain}/... ] — Canonical domains: identity (slim: shared users/auth_tokens/user_devices), customers, suppliers, catalog, orders, payments, finance (incl. receivables/payables/treasury/reporting/tax slices), logistics, hr, comms, media, country, governance. Internal anatomy per domain:
# *         services/   → single source of business logic + transactions; own get_db() sessions; the ONLY layer writing the domain's tables. HEAVY domains (>~8 services / >~12 tables) use vertical slices: domains/{domain}/{slice}/service.py (finance → ledger/, payouts/, treasury/, reporting/, tax/).
# *         models/     → SQLAlchemy ORM ONLY (tables/columns/relationships/indexes/__table_args__); flat within domain, one file per aggregate; all inherit infrastructure/database/base.Base; __table_args__ = {"schema": "<domain>"}; cross-domain FKs via STRING targets only (ForeignKey("schema.table.col")), relationship() intra-domain only; mixins from infrastructure/database/mixins.py; NO Pydantic, NO business logic, NO Base definition here.
# *         schemas/    → Pydantic request/response DTOs (the domain slice of legacy db/schemas.py).
# *         repositories/ (optional) → hot-path data access (keyset cursors, replica reads).
# *         policies/   → pure domain rules/guards, no IO (approval thresholds, state machines, maker-checker rules).
# *         features.py → AXIS-3 seed: this domain's permission atoms (finance.ledger, finance.reporting, hr.payroll...). SINGLE SOURCE; rbac/catalog.py aggregates via package scan (domains/*/features.py + domains/*/*/features.py).
# *         events.py / subscribers.py → published domain events / handlers consuming OTHER domains' events (registered at boot by main.py); the default replacement for cross-domain function calls.
# *         ports.py    → the ONLY sanctioned cross-domain READ interface (writes across domains = events only).
# *         read_models/→ CQRS-lite projections for dashboards (get_read_db(), materialized views); cross-domain dashboards live in governance/read_models/.
# *     - backend/rbac/         → catalog.py (aggregates features; single source of truth; served to frontend), roles.py ((module, role) → feature sets; replaces DEFAULT_ROLE_PERMISSION_MAP/ADMIN_PERMISSION_MAP), resolution.py (actor × role × country → effective set, Redis-cached), dependencies.py (require_feature(...), require_module(...)), service.py (grant/revoke, delegation, maker-checker), models.py (permission_categories, role_permission_assignments, user_permission_overrides).
# *     - backend/kernel/       → shared BUSINESS primitives (imports nothing above): money.py (Decimal money + FX, NEVER float), numbering.py (unified reference numbering ORD-/INV-/PAY-/BATCH-), country.py (CountryCode + RLS context helper), period.py (fiscal period/date ranges).
# *     - backend/infrastructure/ → platform, ZERO business logic, imports nothing from domains/modules/jobs: database/ (base.py Base+metadata, database.py engine + get_db()/get_read_db() + schema_translate_map, session.py, transaction.py, security.py = ONE canonical RLS enforcer replacing scattered rls_* middleware, mixins.py, seeds/ idempotent, setup/ check+health+reset, create_tables.py dev-only refuses prod, database_logging.py), redis/, storage/ (S3/R2; blobs NEVER in Postgres), messaging/ (event_bus.py in-proc → Redis/Celery later, ws_manager.py, webhook ingress), observability/, security/ (JWT, hashing, field encryption, zero-trust), utils/ (pure helpers only).
# *     - backend/providers/    → 3rd-party/AI adapters; subclass base provider, implement health_check(); called ONLY by domains/*/services/ and jobs/; NEVER by module routers. Subpackages: ai, analytics, auth, automation, comms, finance, geography, image, media, news, payments, security, voice, legacy.
# *     - backend/jobs/         → background workers/consumers (fraud_monitoring, ghost_order_detector, data_retention, payroll_run, payout_sweep, reconciliation_cron, bank_statement_importer, fx_revaluation, accrual_reversal, threat_feed_updater, mcp_server). MAY import domain services + subscribe to events; NEVER imported by domains.
# *     - backend/middleware/   → Keeping files [ backend/middleware/{function}_middleware.py - flat ] orchestrator.py (ordered pipeline) + modules: api_version, country_context, csrf, database_security, device_binding, impossible_travel, ip_extraction, logging, pci_dss_compliance, rate_limit, request_id, rls_dependency (delegates to infrastructure/database/security.py), security_headers, webhook_ip_whitelist, webhook_verification, zero_trust_auth. Enforces security/RLS/geo BEFORE module routers; imports only infrastructure/utils/settings/db(read-only).
# *     - backend/_legacy/      → DEPRECATED strangler shims (routers/, controllers/, services/, models/, db/, utils/) re-export ONLY; a shim is deleted when its domain slice is 100% auto-generation-ready and tests green; backend/DOMAIN_ALLOWLIST.yaml (temporary cross-domain imports) may ONLY shrink.
# * ## DEPENDENCY LAW: arrows point DOWN only — modules → domains → infrastructure; jobs → domains → infrastructure; providers ← services/jobs; middleware → infrastructure. Domains NEVER import modules; infrastructure imports nothing above it; cross-domain writes ONLY via events; cross-domain reads ONLY via ports.py/read_models; CI import-lint enforces; any require_feature("…") literal not in the rbac catalog = CI failure.
# *
# * ## DATABASE "circuit":
# *     - Engine (QueuePool sync today / AsyncPG at scale) behind PgBouncer (transaction mode) → get_db() one session (writes) / get_read_db() replica (catalog/search/analytics reads) → ORM models across DOMAIN Postgres schemas; Alembic is the single schema source of truth (create_all dev-only); schema_translate_map: PG transition maps domain→legacy physical schemas (config flip after ALTER ... SET SCHEMA), SQLite dev maps all→None (strips schema); RLS enforced on every session via ONE canonical enforcer (infrastructure/database/security.py); Redis fronts catalog/session/cache reads.
# *     - Hot lists use keyset cursors (NEVER OFFSET); cross-domain FKs string-target only, resolved from ORM metadata; check_connection_health() → SELECT 1 backs /health/ready.
# *     - Schema policy: each DOMAIN owns its own actor tables (domain-actor isolation). NO central "core"/"platform" user table:
# *        customer login → customers.profiles / customers.accounts, supplier login → suppliers.supplier_accounts, admin login → governance.admin_accounts, employee login → hr.employees, logistics login → logistics.logistics_partners, shared users/auth_tokens/user_devices → identity schema (slim identity domain).
# *        Shared reference data (countries, currencies, roles catalog) lives in country / configuration schemas.
# *        JWT sessions + token blacklist live in Redis, NOT in a DB schema.
# *
# *    ### 100K capacity requirements (what MUST be in place)
# *      1. Partitioning (MANDATORY for tables > 10M rows):
# *          governance.audit_logs   → monthly partition (created_at)
# *          governance.snapshots    → monthly partition
# *          comms.messages          → monthly partition
# *          orders.orders           → quarterly partition
# *          messaging.outbox_events → weekly partition (processed → delete)
# *          media.assets            → yearly partition
# *        Cold partitions archived to object storage after retention period.
# *      2. Read/write split:
# *          get_db()      → primary (writes only)
# *          get_read_db() → replica (catalog, search, analytics reads)
# *        Replica lag SLO: < 1s. Monitored via pg_stat_replication.
# *      3. Connection budget:
# *          App: pool_size=5 per process (NEVER more)
# *          PgBouncer: max_client_conn=1000, default_pool_size=50
# *          PostgreSQL: max_connections=100 (behind PgBouncer)
# *          Read replicas: same budget, 95% reads routed there
# *        Long transactions (>500ms) moved to jobs/ background workers.
# *      4. Redis topology:
# *          Phase A: single Redis + RDB persistence
# *          Phase B: Redis Sentinel (failover) + pub/sub for WS
# *          Phase C: Redis Cluster (sharded) for 100K+ ops/sec
# *      5. Retention & archive:
# *          sessions/carts/notifications → hard delete 30/90 days
# *          audit_logs/analytics         → archive to S3 after 2yr
# *          events.outbox                → hard delete 7d after processed
# *          media metadata               → keep forever (blobs in S3/R2)
# *        Implemented via pg_cron or jobs/data_retention.py nightly.
# *      6. Read model (Phase C only — when throughput justifies):
# *          CDC (Debezium) → Kafka → OpenSearch for catalog/search reads
# *          Redis hydrates price/stock after OpenSearch returns IDs
# *          Removes ~80% read load from PostgreSQL at scale
# *      7. Observability (required before claiming any phase):
# *          pg_stat_activity → connection saturation (< 80% SLO)
# *          pg_stat_replication → replica lag (< 1s SLO)
# *          pg_stat_statements → top slow queries (weekly review)
# *          Prometheus + Grafana dashboards + alerts
# *
# *     ### Design how database management must change to support:
# *         videos, images, chats, and "a range of things" (attachments, thumbnails, transcripts, reactions, moderation flags): blobs NEVER in Postgres — media.assets metadata (domain schema) + S3/R2 objects; comms attachments reference media.assets ids; transcripts/reactions/moderation flags as JSONB columns or child tables in comms schema; monthly partitions + TTL archive per retention policy.
# *
# * ## FRONTEND "circuit":  Web (Next.js 15) + Mobile (Expo RN) + shared (TS) → both call one FastAPI backend via apiFetch; actor-prefixed routes (/customer/*, /admin/*, ...) resolve to module routers; client contract unchanged.
# *   ### web_app (frontend/web_app, Next.js 15) "circuit":
# *     - frontend/web_app/src/app:        → route tree (layout/loading/error/page per folder); groups: customer, auth, admin/*, supplier/*, logistics-partner/*, employee/*, wishlist, profile, chatbot, tracking; app/api/ = Next server routes (auth proxy, currency, geo, errors).
# *     - frontend/web_app/src/components: → reusable UI: ui/ (design-system), admin/, auth/, chat/, comms/, country/, ems/, map/, supplier/.
# *     - frontend/web_app/src/styles:     → Tailwind globals + CSS variables / base styles.
# *     - frontend/web_app/src/lib:        → api/ (client.ts typed fetch wrapper, auth.ts, country.ts, errors.ts, index.ts), rbac.ts (fetches /rbac/catalog for UI gating); Zustand stores + useAuth/useApi via sibling hooks/.
# *     - frontend/web_app/src/hooks:      → data-fetching + WebSocket hooks (useApi, useAuth).
# *     - frontend/web_app/src/services:   → localizationService.ts, crossBorderService.ts, addressFormatService.ts.
# *     - frontend/web_app/src/theme:      → design tokens (colors/spacing/typography) consumed by Tailwind + components (NO inline <style>).
# *     - frontend/web_app/src/types:      → TS ambient/domain type decls (framer-motion.d.ts); shared types live in shared/src/types.ts.
# *     - frontend/web_app/src/utils:      → small helpers (test.ts); prefer shared/src/utils.
# *     - frontend/web_app/src/logo:       → brand logo assets.
# *     - frontend/web_app/tests/mocks:    → __mocks__ / test doubles for components & api.
# *     - frontend/web_app/root:           → next.config.ts (rewrites), middleware.ts, tailwind.config, playwright.config, e2e/.
# *
# *   ### mobile_app (frontend/mobile_app, Expo RN) "circuit":
# *     - frontend/mobile_app/app/:         → Expo Router .tsx screens + (auth)/(tabs) groups + admin/products/orders/supplier/logistics/employee/tracking/returns folders.
# *     - frontend/mobile_app/components/:  → ui/ (design-system components).
# *     - frontend/mobile_app/lib/:         → api.ts (client), authStore/cartStore/currencyStore/localeStore/notificationStore (Zustand), authPrompt, countryContext, geo, paymentService, socialAuth, expoSecureStorage, errorReporter (api + stores + auth + platform helpers).
# *     - frontend/mobile_app/theme/:       → mobile design tokens (mirrors web theme).
# *     - frontend/mobile_app/assets/:      → images / fonts / icons bundles.
# *     - frontend/mobile_app/android/:     → Expo-managed native Android project.
# *     - frontend/mobile_app/mocks/:       → test mocks.
# *     - frontend/mobile_app/e2e/:         → Playwright/Detox e2e tests.
# *     - frontend/mobile_app/scripts/:     → build / codegen scripts.
# *     - frontend/mobile_app/web-dist/:    → Expo web build output.
# *     - frontend/mobile_app/root:         → app.config.js, metro.config, babel.config, expo-env.d.ts, sentry, pnpm-workspace.
# *
# *   ### shared (frontend/shared) "circuit":
# *     - src: cross-platform TS — api-core.ts (apiFetch), money.ts, i18n.ts, localization.ts, cartHelpers/checkoutHelpers/orderHelpers/productHelpers/ticketHelpers/returnsApi/wishlistHelpers/notificationHelpers, permissions.ts (GENERATED from backend /rbac/catalog — replaces adminPermissions.ts; UI gating + backend gating share ONE source), statusColors.ts, requestCache.ts, realtime.ts, chatbot.ts, types.ts, theme.ts + theme.native.ts, components/, logo/, __tests__.
# *
# * ## Combine "circuit":
# *     - shared/src imported by web_app (@shared alias) and mobile_app (workspace pkg); keeps api-core, money/i18n, cart/checkout/order, permissions, types identical.
# *     - Transport: both call backend via apiFetch; web via next.config rewrites + middleware.ts → FastAPI; RN via lib/api.ts → same backend.
# *     - Backend: single FastAPI serves both; middleware/orchestrator applies security; module routers thin (require_feature) → domain services own DB + transactions → infrastructure providers/Redis; cross-domain only via events (writes) or ports/read_models (reads); rbac catalog single-sources features.
# *     - Monorepo: web_app (Next) + mobile_app (Expo) + shared (TS) + root docker-compose / Makefile / pnpm-workspace.
# *
# * ## Extra Files:
# *     - use the `_extra_files/**` for keeping temporary files for making changes, audit, testing of architecture & etc.
