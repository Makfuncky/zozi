  - id: SYS_015     #* Supplier Commission Structure - Countries wise vary and Product wise vary
    name: Supplier Commission Structure - Countries wise vary and Product wise vary
    update_version: "16-08-2026"
    description: |
      The Supplier Commission Structure is the canonical, deterministic hybrid commission model for the Zozi marketplace. It governs how commission rates are resolved per supplier order item during order processing, how the immutable commission ledger is populated, and how supplier settlements and payouts are calculated in Finance. The model is country-aware (category rates can vary by country) and product-aware (category-based and supplier/product override-based), giving Finance Admins full control without direct database access. Every commission change produces an append-only audit log, and all money fields use Decimal-only arithmetic.

      ## Capabilities:
      - **Deterministic Rate Resolution:** Resolve commission rate per order item through a fixed precedence chain: (1) active supplier-level admin override, (2) active category rate for the product category (country-scoped), (3) supplier badge tier rate, (4) global default rate, then apply low-value cap if order_value < LowValueThreshold.
      - **Country-Wise Category Rates:** Category commission rates can vary by country_code; Finance Admins manage them via Admin Panel Commission page and country commission endpoints. Country-scoped rates override global category rates.
      - **Product-Wise Overrides:** Admins can set per-supplier or per-product commission overrides that take precedence over category and badge rates.
      - **Badge Tiers & Supplier Fees:** Suppliers pay badge setup and recurring fees (None/Bronze/Silver/Gold/Platinum/Membership). Badge commission rates feed into the resolution chain when no override or category rate exists.
      - **Low-Value Cap:** For orders below LowValueThreshold (default 5.00 OMR), commission is capped at FixedCap (default 0.500 OMR) to protect micro-order economics.
      - **Margin Protection (Optional):** When estimated supplier margin is below MarginThreshold (default 10%), prefer a lower category rate or negotiated fixed-fee arrangement. Toggle-driven; requires reliable margin data source.
      - **Immutable Commission Ledger:** Every confirmed order item produces one immutable commission ledger row capturing all resolution inputs (override_rate, category_rate, badge_rate, global_default_rate, applied_rate, calculation_method, cap_applied, currency, etc.).
      - **Finance-Safe Settlement:** Supplier transaction ledger stores blended effective commission rate for the supplier slice of the order, ensuring honest displays and accurate payout calculations.
      - **Admin Panel Commission Page:** Five-tab interface (Global Rate, Category Rates, Supplier Overrides, Badge Tiers, Preview Calculator) for Finance Admins to manage the full commission system without direct DB access.
      - **Governance & Audit:** Only Finance Admins may change commission rules. Every change must include a reason/note and produce an audit log entry. Category rates reviewed quarterly; badge fees reviewed by market.
      - **KPI Monitoring:** Track average commission percentage, supplier churn, badge upgrades, commission disputes per 1,000 orders, category margin impact, and price competitiveness.

      ## Non-negotiables:
      - **Decimal-only arithmetic** -- all commission money fields use Python Decimal; never float for currency.
      - **Append-only commission ledger** -- CommissionLedgerEntry rows are immutable; adjustments are new rows with audit references.
      - **Thin routers** -- backend/routers/* parse/validate only; no business logic or DB writes.
      - **Controllers import no FastAPI** -- orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** -- all persistence in backend/services/finance/*; controllers delegate.
      - **RLS on every finance/supplier table** keyed on country_code and supplier_id; cross-country reads return zero rows without global/admin role.
      - **Alembic is the single schema source of truth** -- no ad-hoc DDL in code.
      - **No silent fallbacks** -- unavailable commission data sources (margin feed, category rate) report explicit error with audited fallback path.
      - **Config-as-data** -- global config, category rates, badge tiers, margin threshold, low-value cap are stored in database tables, not hardcoded.
      - **Event-driven writes** -- services publish commission-calculated events to outbox in the same transaction as ledger writes; consumers subscribe for downstream finance/payout jobs.
      - **Monthly partitioning on commission_ledger_entries** for 100K-scale retention; keyset cursors for all hot lists.

      ## Step-by-step:
      - **Step 1 -- Schema alignment & seed data:** Verify commission tables (CommissionGlobalConfig, CommissionCategoryRate, CommissionBadgeTier, CommissionLedgerEntry, ProductCommissionOverride, SupplierCountryCommission, CountryCommissionRate) exist with correct columns, RLS policies, and indexes. Seed default category rates and badge tiers idempotently. *Done when:* drift gate green + seed_commission() runs cleanly on empty DB.
      - **Step 2 -- Rate resolution engine:** Implement deterministic `get_effective_rate()` in `commission_engine.py` covering admin override -> country category rate -> product override -> badge rate -> global default -> low-value cap. Unit tests for every precedence branch and cap edge case. *Done when:* all example calculations in FEATURES.md reproduce exactly.
      - **Step 3 -- Country-wise category rates:** Wire country-scoped category rate CRUD through `commission_geography_service.py` and admin geography router. Ensure country_code upper-casing and active-toggle filtering. *Done when:* creating a country-specific category rate overrides global rate for that country only.
      - **Step 4 -- Admin overrides & product overrides:** Implement supplier-level and product-level commission override CRUD via `commission_service.py` and core commission controller. Validate active-toggle and reason/note requirements. *Done when:* supplier override takes precedence over category/badge/global for all that supplier's items.
      - **Step 5 -- Immutable commission ledger:** On order item confirmation, persist one CommissionLedgerEntry per item with all resolution inputs and outputs. Wire append-only constraint; disallow UPDATE/DELETE. *Done when:* confirmed order creates exactly one ledger row per item with all required fields populated.
      - **Step 6 -- Admin Panel Commission page:** Build five-tab interface (Global Rate, Category Rates, Supplier Overrides, Badge Tiers, Preview Calculator) with inline editing, active toggles, and preview calculator showing applied rate + calculation method + cap usage + ledger preview. *Done when:* Finance Admin can change global rate, see it reflected in preview, and audit log captures the change.
      - **Step 7 -- Finance & payout integration:** Wire commission totals into supplier settlement logic (gross - commission - VAT - gateway fees = net). Ensure supplier transaction ledger displays blended effective commission rate. *Done when:* delivered order supplier settlement shows correct commission deduction matching ledger.
      - **Step 8 -- Governance, KPI & rollout:** Implement governance rules (reason/note required, audit log on every change), KPI monitoring endpoints, and pilot rollout checklist. *Done when:* limited supplier cohort pilot passes and KPIs are visible in admin dashboard.

      ## Discussion notes:
      - **Point 1 -- Country-wise vs global category rates:** The commission model must support both global default category rates and country-specific overrides. The resolution chain checks country_code-scoped category rates first; if none exists for the order's country, it falls back to the global category rate. This keeps the data model simple while enabling per-market competitiveness.
      - **Point 2 -- Supplier vs product overrides:** Supplier-level override applies to all products from that supplier. Product-level override applies to a single product. Both are stored separately (SupplierCountryCommission vs ProductCommissionOverride) and resolved in the correct precedence order. The UI must surface which level is active and why.
      - **Point 3 -- Decimal-only is non-negotiable:** Commission calculations involve percentages, thresholds, and caps that compound rounding errors with floats. All money math must use Python Decimal with ROUND_HALF_UP. The DB stores DECIMAL/NUMERIC; the API transports strings or Decimals, never bare floats.
      - **Point 4 -- Immutable ledger vs adjustments:** Finance disputes must be handled as new ledger adjustment rows, not UPDATE/DELETE on existing rows. The original calculation must always be reconstructable. Adjustment rows reference the original ledger_id and include a dispute_reason and adjusted_by user id.
      - **Point 5 -- Badge fees are separate from commission rates:** Badge setup and recurring fees are billing events, not commission deductions. They must not leak into the commission ledger or order-item commission calculation. Badge fees appear in supplier billing history and statements only.
      - **Point 6 -- Low-value cap protects micro-orders:** Without the cap, a 1 OMR order at 15% yields only 0.15 OMR commission -- not worth the accounting overhead. The cap ensures minimum commission viability. The cap must be toggleable per market via global config.
      - **Point 7 -- Margin protection must be honest:** The margin protection rule should only auto-apply when Zozi has a reliable estimated supplier margin input. If no margin data source exists, the toggle should be disabled or the rule should fall back to Finance Admin category/supplier override management. A toggle without data must not pretend to make a real financial decision.
      - **Point 8 -- Backend hybrid state:** Several existing routers and controllers (admin_commission.py, core_commission_controller.py, admin_geography_configuration.py) predate the thin-router contract and still perform DB writes or import FastAPI patterns directly. New commission code must comply with the target contract from day one; existing code is being migrated.

