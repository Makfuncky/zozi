  - id: SYS_007     #* Payment System & Cash Management Cycle
    name: Payment System & Cash Management Cycle
    update_version: "16-08-2026"
    description: |
      The Payment System & Cash Management Cycle is the complete marketplace money-flow engine for Zozi, covering payment collection (Cash on Delivery + Pay by Card), payout settlement (Supplier + Logistic Partner), commission calculation, reconciliation (Bank System -> Supplier Payout -> Logistic Partner Payout -> COD Reconciliation -> Pay by Card Reconciliation -> Refund Reconciliation -> Payout Reconciliation), and refund management. It inherits constitutional rules from SYS_004 Finance & Treasury ERP System and the P1 architecture: **RLS `country_code`, Alembic-only migrations, event-driven writes (outbox), append-only audit, no silent fallbacks, Decimal-only money math, media bytes in R2/S3, thin routers, controllers import no FastAPI, services own the database, config-as-data, monthly partitioning, keyset cursors for hot lists, read/write split**. Strategy: **complete + wire the existing skeleton; do not rebuild.**

      ## Capabilities:
      - **Dual payment collection:** Cash on Delivery (logistic partner collects from customer, remits to Zozi treasury) and Pay by Card (payment gateway captures from customer, settles to Zozi treasury) — both paths converge into the same reconciliation and payout engine.
      - **Order cost decomposition:** Every order decomposes into 4 components — Product Price, Delivery Charges (Pick-Up + Drop-Off), VAT (5% of Product Price + Delivery Charges), ZOZI Service Charges (10-20% of Product Price) — all computed server-side with `Decimal` precision; party-wise breakdown visible in order summary.
      - **Logistics partner delivery settings:** Logistics partners manage country-scoped pickup/delivery city pairs with configurable charges via a "Delivery Settings" tab; admin approval workflow before charges go live; real-time cart lookup for fee calculation; support for multiple city pairs per partner.
      - **Automatic payout settlement:** Supplier payout auto-triggers 10 days after order delivery (both COD and Card); logistic partner payout auto-settles based on completed-order pickup + delivery charges; both reflect in supplier/logistics payout pages and order pages with payment/payout status visibility.
      - **Commission engine integration:** Hybrid commission model — Supplier Based Commission (fixed rate for all products from a supplier) and Product Based Commission (per-product rates) — wired into settlement and payout calculations; immutable commission_ledger_entries per order item.
      - **Payment gateway management:** Admin manages payment gateways via wizard (add/edit/test/delete/archive); universal connector with `BasePaymentGateway` contract, `PaymentGatewayRegistry` auto-discovery, `PaymentEngine` central router, smart routing with tier-based fallback, `ZoziPaymentEvent` universal webhook normalizer, AES-256-GCM credential vault, idempotency gate via `ProcessedWebhookEvent`.
      - **Bank reconciliation:** Auto-match bank statement lines against GL entries (amount exact + ref match + date ±3d); exception queue for mismatches; bulk reconcile; nightly variance cron; CSV/API import.
      - **COD reconciliation engine:** Logistic partner remits COD -> treasury matches against order-level COD receivable -> auto-settle pickup + delivery charges to partner -> flag variance for exception queue.
      - **Refund management:** Customer refund triggers reverse reconciliation — refund posts to GL, adjusts supplier payable, adjusts logistics payable (if COD), updates commission ledger, and notifies all parties; refund status visible on order and payout pages; auto-reconciles against original payment.
      - **Finance page clarity:** Admin Finance page shows clear money circuit: Pay by Card path (Order Delivered -> Collection Received -> Zozi Share -> Supplier Payout -> Logistic Partner Settlement) and Cash on Delivery path (Order Delivered -> Logistic collects -> Zozi Keep -> Supplier Payout); dedicated Bank Account Page for Zozi bank details; bank verification for suppliers and logistics partners.
      - **Supplier/Logistic Partner bank account management:** Supplier and logistics partners enter bank details in their profile pages; details reflect to payment management and payout systems; KYC verification enforced before payout dispatch.
      - **Product/Category/Weight/Distance charge rules:** Hybrid model — flat fees for in-city, distance + weight for inter-city; product/category overrides for bulky or fragile items; logistics partner revenue tied to actual effort (weight + distance).
      - **Append-only audit:** Every collection, payout, reconciliation, refund, and commission action is logged immutably; no UPDATE/DELETE on financial records.
      - **No silent fallbacks:** Any unavailable pipeline (payment gateway, bank import, OCR, SMTP relay) reports explicit error mode with audited alternate path.
      - **Monthly partitioning on finance and audit tables** for 100K-scale retention; keyset cursors for all hot lists.
      - **Config-as-data** — payment methods, commission rules, payout rules, tax rates, logistics charges stored in `configuration` tables, not hardcoded.

      ## Non-negotiables:
      - **Event-based reconciliation** — Orders/Logistics/Payments publish outbox events; only `TreasuryService`/`GeneralLedgerService` write to the GL; this feature consumes events to drive collection, payout, and reconciliation.
      - **Money math** — Python `Decimal` + Postgres `NUMERIC(16,4)` everywhere; **no floats** (Penny-Rounding law).
      - **Dual payment path convergence** — COD and Card paths must converge into identical payout/reconciliation data structures; no divergent code paths for the two payment methods.
      - **10-day supplier payout SLA** — supplier payout auto-triggers 10 days after order delivery for both COD and Card; manual override requires Maker-Checker.
      - **Maker-Checker on payouts** — payout batches live in `payout_batches(draft)` until a second, distinct user with approve rights posts; checker ≠ maker enforced.
      - **Append-only audit logs** — `finance_audit_logs`, `communication_audit_trails`, `employee_activity_logs` are immutable; no UPDATE/DELETE allowed.
      - **No silent fallbacks** — any unavailable pipeline (payment gateway, bank import, OCR, transcription, SMTP relay) reports explicit error mode with audited alternate path.
      - **Decimal-only** — all money fields use `Decimal` + `NUMERIC(16,4)`; no float math anywhere.
      - **RLS `country_code`** on every payment/finance table; cross-country reads return zero rows without global/admin role.
      - **Monthly partitioning on `audit.audit_logs`, `events.outbox_events`, `finance.*`** for 100K-scale retention; keyset cursors for all hot lists.
      - **Config-as-data** — payment methods, commission rules, payout rules, tax rates, logistics charges stored in `configuration` tables, not hardcoded.
      - **Read/write split** — `get_db()` -> primary (writes only); `get_read_db()` -> replica (catalog, search, analytics reads); dashboards/reports served from materialized views + read replicas.
      - **Thin routers** — `backend/routers/{surface}_{domain}_{feature}_router.py` parse/validate only; no business logic.
      - **Controllers import no FastAPI** — orchestrate auth/permissions, delegate to services; never own DB writes.
      - **Services own the database** — all persistence in `backend/services/{domain}/*`; controllers delegate.
      - **Idempotency law** — every webhook, payout batch, and reconciliation line carries an idempotency key; retries can never double-post.
      - **AES-256-GCM credential vault** — payment gateway secret keys and webhook secrets encrypted before touching the database; MEK injected via env var/KMS.

      ## Step-by-step:
      - **Step 1 — Payment settings & logistics charges schema:** Add `logistics_partner_service_areas` (country, pickup_city, pickup_charges, delivery_city, delivery_charges, approval_status, approved_by, approved_at) with RLS on `country_code`; add `supplier_bank_accounts` and `logistics_partner_bank_accounts`; seed default commission rules (supplier-based + product-based); create Alembic migrations with downgrade + contract tests. *Done when:* logistics partner can create city-pair charges, admin approves, cart pulls charges in real time.
      - **Step 2 — Dual payment collection wiring:** Wire COD path (logistic collects -> remits to Zozi treasury -> `cod_receivable` Dr/Cr) and Card path (gateway captures -> `gateway_clearing` Dr/Cr) into the same outbox event pipeline; both emit `PaymentCollected` event consumed by TreasuryService. *Done when:* both paths produce identical ledger entries for the same order amount.
      - **Step 3 — Supplier payout automation:** Implement nightly cron (`payout_batch_worker.py`) that queries commission_ledger_entries + payout_rules for orders delivered 10+ days ago -> generates `payout_batches(draft)` -> Maker-Checker dispatch -> supplier pre-review SMS/email links -> bank transfer -> `payout_batch_items(settled)`. *Done when:* supplier sees payout status on payout page and order page for both COD and Card orders.
      - **Step 4 — Logistics partner payout & settlement:** Implement settlement calculation per completed order (pickup_charges + delivery_charges) -> nightly sum per partner -> payout statement -> push to finance -> bank transfer; COD remittance engine matches logistic remittances against order COD receivable. *Done when:* logistics partner sees payment status and payout status on payout page and order page.
      - **Step 5 — Commission engine wiring:** Hybrid commission resolution (supplier-based override -> category rate -> badge tier -> global default -> low-value cap); immutable `commission_ledger_entries` per order item; wired into supplier settlement (gross − commission − VAT on commission − gateway fee deductions = net payable). *Done when:* commission preview calculator shows correct split for all order items.
      - **Step 6 — Payment gateway wizard & universal connector:** Admin manages gateways via wizard (CRUD, credential vault, test connection, routing rules); `BasePaymentGateway` contract enforced; `PaymentGatewayRegistry` auto-discovery; `PaymentEngine` smart routing with tier-based fallback; `ZoziPaymentEvent` universal webhook normalizer; AES-256-GCM credential vault. *Done when:* new gateway added without core logic changes; webhook normalizer handles all live adapters.
      - **Step 7 — Bank reconciliation:** Nightly `bank_reconciliation_worker.py` imports bank statements (CSV/API) -> `bank_statement_lines` -> auto-match against GL (`amount exact + ref match + date ±3d`) -> `is_reconciled`; exception queue for mismatches; bulk reconcile; variance alert. *Done when:* bank statement imports reconcile with zero variance on clean test data.
      - **Step 8 — Refund reconciliation:** Customer refund triggers reverse entries — refund posts to GL, reverses supplier payable, reverses logistics payable (if COD), reverses commission ledger, updates `RefundLedger`; refund status visible on order and payout pages; auto-reconciles against original payment. *Done when:* refund completes with zero ledger variance and all parties see updated status.
      - **Step 9 — Finance page redesign & money circuit clarity:** Redesign admin finance page — remove clutter, shift Zozi bank account to dedicated Bank Account Page, show clear Pay by Card and Cash on Delivery money circuits, bank verification for suppliers and logistics partners, connect order placement to finance in real time. *Done when:* admin can trace any order from placement to payout in under 60 seconds.
      - **Step 10 — E2E test & close-out:** Run full cycle tests (COD and Card paths from order placement to supplier/logistics payout), reconciliation variance tests, refund tests, chaos tests; update `CODEBASE_STATUS_MATRIX_DETAILED.md` section-by-section. *Done when:* every row green and matrix committed.

      ## Discussion notes:
      - **Point 1 — Dual payment path convergence:** COD and Card are not separate systems — they are two collection methods that must converge into identical payout/reconciliation data structures. The only divergence is the collection leg (logistic vs gateway); from reconciliation onward, both paths are identical. This prevents double maintenance and ensures consistent reporting.
      - **Point 2 — Logistics charges as configuration, not hardcode:** Pickup/delivery charges are managed by logistics partners via a "Delivery Settings" tab, approved by admin, and queried by the cart in real time. This means charges are data, not code — adding a new city pair requires no deploy. The approval workflow prevents stale or fraudulent charges from affecting customer carts.
      - **Point 3 — 10-day payout SLA as configurable rule:** The 10-day supplier payout period is currently hardcoded in business logic; it should be moved to `payout_rules` as a configurable parameter. This allows per-supplier or per-country overrides without code changes.
      - **Point 4 — Commission as first-class finance:** Commission is not an afterthought calculated at payout time. It is computed per order item at delivery, recorded in immutable `commission_ledger_entries`, and wired into the settlement engine. The supplier sees the true realized commission percentage on every transaction.
      - **Point 5 — Reconciliation as event-driven pipeline:** Every financial action (payment captured, COD remitted, payout dispatched, refund issued) emits an outbox event consumed by TreasuryService. Reconciliation is not a batch report — it is a continuous, event-driven pipeline. Mismatches are caught in real time and routed to the Exception Queue.
      - **Point 6 — Refund as reverse financial event:** A refund is not a separate system — it is the reverse of the original financial event. Refunding a Card order reverses the gateway clearing and supplier payable. Refunding a COD order reverses the COD receivable and logistics payable. This symmetry ensures that refunds never create orphaned ledger entries.
      - **Point 7 — Bank verification before payout:** Supplier and logistics partner bank accounts must be verified before any payout is dispatched. This is enforced at the payout batch level — unverified accounts are excluded from batch generation and flagged for admin action. The verification flow includes micro-deposit confirmation or open-banking verification.
      - **Point 8 — Backend hybrid state:** Several existing controllers (`payments_controller.py`, `treasury_controller.py`, `logistics_controller.py`) predate the thin-router contract and still import FastAPI or perform DB writes directly. These are being migrated; new payment/cash-management code must comply with the target contract from day one.

