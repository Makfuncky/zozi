# P3 - documents/CODEBASE_STATUS_MATRIX_AUTO.md structure:
# =============================================================================
# ~ feature_tracker.py does everything else: finds files, tables, routes, tests, and computes the completion percentage AGAINST THE NEW_STRUCTURE tree.
# ~ The tracker auto-extracts checkpoints from `description`:
# ~    `schema.table`         -> DB-table checkpoint (schema must equal owning domain)
# ~    `/route/{param}/...`   -> API-route checkpoint (must resolve to a module router)
# ~    UPPER_CASE statuses    -> state-machine checkpoint
# ~    `snake_case` backticks -> field/identifier checkpoint
# ~    **bold phrases**       -> capability checkpoint
# ~    **Step N — ...**       -> milestone checkpoint
# ~ AUDIT GATES the tracker + CI must run (to ensure NEW_STRUCTURE is implemented properly):
# ~    1. Import-law scan: modules→domains→infrastructure only; domains never import modules; cross-domain `from domains.X.(services|models|repositories)` outside X = FAIL (ports/events/read_models allowed); providers imported only by services/jobs.
# ~    2. Feature-catalog check: every require_feature("…") literal exists in rbac catalog (aggregated from domains/*/features.py + slices); shared/src/permissions.ts generated from /rbac/catalog.
# ~    3. Schema discipline: every ORM model declares __table_args__ schema == owning domain; naming lint (snake_case, plural, <thing>_id, created_at/updated_at, country_code, is_deleted); Base defined ONLY in infrastructure/database/base.py.
# ~    4. Thin-router check: module routers contain no DB writes / no business rules; auto_router --verify passes; generated routers carry AUTO-GENERATED marker and live in modules/{m}/routers/.
# ~    5. Metadata integrity: exactly one class per __tablename__ across Base.metadata; class identity legacy-is-new (shims re-export same objects); alembic check / schema-audit shows 0 drift.
# ~    6. Strangler shrink: no NEW code under _legacy/ (forbidden-folder-scan); DOMAIN_ALLOWLIST.yaml entries only decrease; shim deleted when its slice is green.
# ~    7. Existing gates still run: scripts/coherence_gate.py --check, tests/architecture gates, router-generation, schema-audit.yml.
# ~ Best worked example: feature SYS_007 (Order Tracker).
