# ============================================================================
# ZOZI FEATURE DEFINITIONS — MASTER TRACKER
# ============================================================================
# HOW TO USE:
#   1. Each feature below describes ONE row in the status matrix
#   2. Update `description` with small text explaining what "done" means
#   3. List expected files, patterns, models, routes, tests
#   4. Run: python scripts/feature_tracker.py
#   5. Output: updated CODEBASE_STATUS_MATRIX.md with real percentages
#
# STATUS KEY:
#   ✅ Complete · ⚠️ Partial · ❌ Not Yet Built · 🔍 Scanning
# 
# HOW TO ADD A NEW FEATURE:
#   Open scripts/feature_definitions.yaml
#   Add a new entry under systems_overview
# 
#   - id: SYS_028
#     name: "My New Feature"
#     todo_ref: "#42"
#     scope: "Customer · Admin"       # ← auto-routes to Sections II & V
#     matrix_section: "§II §V"
#     weight: 7                        # 1-10 importance for weighted %
#     description: >
#       Small text describing what "done" looks like.
#       This is used by Ollama for semantic analysis.
#     expected:
#       backend_files:
#         - backend/controllers/my_feature_controller.py
#         - backend/routers/my_feature.py
#       backend_patterns:
#         - "def my_feature_handler"
#       frontend_web:
#         - frontend/web_app/src/app/my-feature/page.tsx
#       frontend_mobile:
#         - frontend/mobile_app/app/my-feature.tsx
#       models: [MyFeatureModel]
#       api_routes:
#         - "GET /my-feature"
#         - "POST /my-feature"
#       tests:
#         - backend/tests/test_my_feature.py
# ============================================================================

meta:
  project: ZOZI E-Commerce Platform
