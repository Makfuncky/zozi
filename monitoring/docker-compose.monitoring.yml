version: '3.8'

services:
  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: zozi-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring

  # Promtail - Log shipping agent
  promtail:
    image: grafana/promtail:latest
    container_name: zozi-promtail
    volumes:
      - ./loki-config.yaml:/etc/loki/promtail-config.yaml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/loki/promtail-config.yaml
    networks:
      - monitoring

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: zozi-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - monitoring

  # Grafana - Dashboards and visualization
  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: zozi-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - monitoring

  # Tempo - Distributed tracing
  tempo:
    image: grafana/tempo:latest
    container_name: zozi-tempo
    ports:
      - "3200:3200"
      - "4320:4320"
    volumes:
      - tempo_data:/tmp/tempo
    command: -config.file=/etc/tempo.yaml
    networks:
      - monitoring

volumes:
  loki_data:
  prometheus_data:
  grafana_data:
  tempo_data:

networks:
  monitoring: