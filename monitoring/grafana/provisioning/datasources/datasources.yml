apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: request_id
          matcherRegex: '"request_id":"(\w+)"'
          url: '${__value.raw}'
          urlDisplayLabel: 'Request ID: '
