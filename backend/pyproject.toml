[project]
name = "zozi-backend"
version = "0.1.0"
description = "ZOZI Marketplace Backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.2",
    "uvicorn[standard]==0.35.0",
    "gunicorn==26.0.0",
    "starlette>=1.6.0,<1.7.0",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "valkey==6.1.1",
    "pyjwt==2.13.0",
    "bcrypt==5.0.0",
    "pyotp==2.10.0",
    "passlib[bcrypt]==1.7.4",
    "email-validator==2.3.0",
    "celery==5.4.0",
    "apscheduler==3.11.3",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "aiofiles==25.1.0",
    "puremagic==2.2.0",
    "Pillow==12.2.0",
    "numpy==2.2.6",
    "structlog==26.1.0",
    "sentry-sdk==2.68.1",
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-instrumentation==0.65b0",
    "opentelemetry-instrumentation-fastapi==0.65b0",
    "opentelemetry-instrumentation-asgi==0.65b0",
    "opentelemetry-instrumentation-sqlalchemy==0.65b0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "slowapi==0.1.10",
    "limits==5.8.0",
    "cachetools==5.5.0",
    "python-slugify==8.0.4",
    "tzdata==2025b",
    "babel==2.18.0",
    "phonenumbers==9.0.35",
    "faker==40.36.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "feedparser==6.0.12",
    "schedule==1.2.2",
    "text-unidecode==1.3",
    "stripe==15.3.1",
    "duckdb==1.5.5",
    "duckdb-engine==0.17.0",
    "cryptography==50.0.1",
    "fastapi-limiter-valkey>=0.2.0",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx>=0.23.1",
    "factory-boy>=3.3.3",
    "testcontainers>=4.15.0",
    "pytest-xdist>=3.6.1",
    "pytest-cov>=6.0.0",
    "websockets==16.1.1",
    "import-linter>=2.14",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::sqlalchemy.exc.SADeprecationWarning",
]
log_cli = false
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "postgres: marks tests that require PostgreSQL",
]
