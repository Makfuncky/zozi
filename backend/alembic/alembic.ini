# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = %(here)s

# Migrations import the shared idempotent helpers as
# `from migration_helpers import ...`. Alembic only puts the `versions/`
# directory on sys.path, not the `alembic/` package that holds the module, so
# without this every migration that uses the helpers fails at import with
# ModuleNotFoundError and `alembic heads` / `alembic upgrade` cannot run.
# (Rewriting the imports to `alembic.migration_helpers` is NOT a safe
# alternative: `backend/alembic/` would shadow the alembic library itself.)
prepend_sys_path = %(here)s

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s.py

# timezone to use when rendering the date within the migration file
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
sourceless = false

# path_separator
path_separator = os

# database URL - overridden by DATABASE_URL env var in env.py
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

