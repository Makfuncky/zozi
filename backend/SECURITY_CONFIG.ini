# Zozi Security Configuration - 100% Free Stack
# All tools listed are free/open-source

[security]
# === FREE TOOLS IMPLEMENTATION ===

# 1. NETWORK SECURITY (FREE)
# - ModSecurity + OWASP CRS (Apache 2.0) - WAF
# - iptables + fail2ban (GPL) - Firewall/IDS
# - Let's Encrypt (MIT) - TLS certificates
# - Nginx (200BSD) - Reverse proxy

# 2. SECRETS MANAGEMENT (FREE)
# Option A: Azure Key Vault (free tier: 10 secrets, 500 transactions/month)
# Option B: HashiCorp Vault Community Edition (MPL 2.0)
# Option C: Ansible Vault (GPL) for development
# Option D: Encrypted environment files with Fernet (Apache 2.0)

# 3. RATE LIMITING (FREE)
# - Redis Community Edition (BSD) - In-memory store
# - In-memory fallback (Python dict) - No external dependency

# 4. MONITORING & LOGGING (FREE)
# - PostgreSQL (PostgreSQL License) - Audit logs
# - Grafana Cloud (AGPL) - Free tier: 3 users, 10k series
# - systemd journal - System logs

# 5. FILE VALIDATION (FREE)
# - python-magic (GPL) - Magic byte detection
# - Built-in extension whitelist

# === PRODUCTION HARDENING ===

[security.hsts]
enabled = true
max_age = 31536000
include_subdomains = true
preload = true

[security.csp]
default_src = "'self'"
script_src = "'self' https://js.stripe.com"
style_src = "'self' https://fonts.googleapis.com"
font_src = "'self' https://fonts.gstatic.com"
img_src = "'self' data: blob: https:"
connect_src = "'self' ws: wss: https://api.stripe.com https://api.tap.company"
frame_src = "https://js.stripe.com"
object_src = "'none'"
base_uri = "'self'"
form_action = "'self'"
report_uri = "/csp-report"

[security.permissions_policy]
camera = "()"
microphone = "()"
geolocation = "()"
payment = "()"
fullscreen = "()"

[security.rate_limits]
# Per-path rate limits (requests per minute)
auth_login = 10
auth_register = 5
auth_forgot = 5
auth_reset = 5
auth_2fa = 5
payments = 20
cart = 30
orders = 20
admin_payouts = 5
admin_backup = 3

# Default limits
default_requests = 60
default_window_seconds = 60

[security.password_policy]
min_length = 8
require_uppercase = true
require_lowercase = true
require_digit = true
require_special = true
special_chars = "!@#$%^&*()_+-=[]{}|;':\",./<>?"
max_age_days = 90
history_count = 5

[security.session]
max_age_seconds = 3600
absolute_timeout_seconds = 86400
idle_timeout_seconds = 1800
require_mfa_paths = ["/admin", "/payments", "/payouts", "/wallet", "/profile/security"]

[security.webhooks]
# Time window for timestamp validation (seconds)
max_age_seconds = 300
# Allowed providers
providers = ["stripe", "tap", "paypal"]

[security.audit]
# Log all security events
log_successful_logins = true
log_failed_logins = true
log_password_changes = true
log_permission_changes = true
log_financial_operations = true

# Append-only audit logs
append_only = true
table_prefix = "audit_"

[security.file_uploads]
# Maximum file size (bytes)
max_size_bytes = 10485760  # 10MB
# Allowed image types (by magic bytes)
allowed_images = ["jpeg", "png", "gif", "webp", "bmp"]
# Allowed document types
allowed_documents = ["jpeg", "png", "gif", "webp", "pdf"]
