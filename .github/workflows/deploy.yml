name: Deploy — Staging & Production

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: "Skip pre-deploy tests (emergency only)"
        required: false
        type: boolean
        default: false

# Permissions for deployment
permissions:
  contents: read
  deployments: write

# Ensure only one deploy runs at a time per environment
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/zozi-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/zozi-frontend

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Pre-deploy Validation
  # ═══════════════════════════════════════════════════════════════
  pre-deploy-checks:
    name: Pre-deploy Validation
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.skip_tests }}
    env:
      APP_ENV: test
      SECRET_KEY: pre-deploy-validation-key
      TEST_ADMIN_PASSWORD: admin123
      TEST_SUPPLIER_PASSWORD: supplier123
      TEST_CUSTOMER_PASSWORD: customer123
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 pytest-timeout==2.3.1

      - name: Run architecture law gates
        working-directory: backend
        run: |
          python -m pytest tests/architecture/test_import_laws.py \
                        tests/architecture/test_architecture_gates.py \
                        tests/architecture/test_laws_complete.py \
                        -v --timeout=60

      - name: Run critical path tests
        working-directory: backend
        run: |
          python -m pytest tests/domains/accounts/ \
                        tests/domains/orders/ \
                        tests/domains/finance/ \
                        tests/domains/catalog/ \
                        -v --timeout=30 -q -m "not slow and not integration"

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Deploy Backend to Railway (Staging)
  # ═══════════════════════════════════════════════════════════════
  deploy-backend-staging:
    name: Deploy Backend → Railway (Staging)
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging') &&
      (github.event.inputs.skip_tests || needs.pre-deploy-checks.result == 'success')
    environment:
      name: staging
      url: https://staging-api.zozi.com
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Deploy to Railway Staging
        run: |
          railway up --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Run database migrations
        run: |
          railway run --environment staging -- alembic upgrade head
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: Verify deployment health
        run: |
          sleep 10
          curl -sf https://staging-api.zozi.com/health || exit 1
          echo "✅ Backend staging deployment healthy"

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Deploy Frontend to Vercel (Staging)
  # ═══════════════════════════════════════════════════════════════
  deploy-frontend-staging:
    name: Deploy Frontend → Vercel (Staging)
    runs-on: ubuntu-latest
    needs: [pre-deploy-checks]
    if: |
      always() &&
      (github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging') &&
      (github.event.inputs.skip_tests || needs.pre-deploy-checks.result == 'success')
    environment:
      name: staging
      url: https://staging.zozi.com
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: |
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: |
          vercel build --preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_STAGING }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Deploy to Vercel (Preview)
        run: |
          vercel deploy --prebuilt --preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ═══════════════════════════════════════════════════════════════
  # Job 4: Deploy Backend to Railway (Production)
  # ═══════════════════════════════════════════════════════════════
  deploy-backend-production:
    name: Deploy Backend → Railway (Production)
    runs-on: ubuntu-latest
    needs: [deploy-backend-staging]
    if: |
      always() &&
      (github.event_name == 'release' || github.event.inputs.environment == 'production') &&
      needs.deploy-backend-staging.result == 'success'
    environment:
      name: production
      url: https://api.zozi.com
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Deploy to Railway Production
        run: |
          railway up --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Run database migrations
        run: |
          railway run --environment production -- alembic upgrade head
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}

      - name: Verify deployment health
        run: |
          sleep 15
          curl -sf https://api.zozi.com/health || exit 1
          echo "✅ Backend production deployment healthy"

      - name: Notify deployment success
        if: success()
        run: |
          echo "::notice::🚀 Backend deployed to production at $(date -u)"

  # ═══════════════════════════════════════════════════════════════
  # Job 5: Deploy Frontend to Vercel (Production)
  # ═══════════════════════════════════════════════════════════════
  deploy-frontend-production:
    name: Deploy Frontend → Vercel (Production)
    runs-on: ubuntu-latest
    needs: [deploy-frontend-staging]
    if: |
      always() &&
      (github.event_name == 'release' || github.event.inputs.environment == 'production') &&
      needs.deploy-frontend-staging.result == 'success'
    environment:
      name: production
      url: https://zozi.com
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_PRODUCTION }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Deploy to Vercel (Production)
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Notify deployment success
        if: success()
        run: |
          echo "::notice::🚀 Frontend deployed to production at $(date -u)"

  # ═══════════════════════════════════════════════════════════════
  # Job 6: Post-deploy Smoke Tests
  # ═══════════════════════════════════════════════════════════════
  smoke-tests:
    name: Post-deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-backend-production, deploy-frontend-production]
    if: always() && needs.deploy-backend-production.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Backend health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf https://api.zozi.com/health; then
              echo "✅ Backend health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ Backend health check failed after 5 attempts"
          exit 1

      - name: Frontend health check
        run: |
          for i in 1 2 3 4 5; do
            if curl -sf https://zozi.com -o /dev/null; then
              echo "✅ Frontend health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ Frontend health check failed after 5 attempts"
          exit 1

      - name: API critical path check
        run: |
          # Verify core API endpoints respond
          curl -sf https://api.zozi.com/api/v1/catalog/products?limit=1 || exit 1
          echo "✅ Catalog API responding"
