name: Security Scanning

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Python Dependency Audit (pip-audit)
  # ═══════════════════════════════════════════════════════════════
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --output pip-audit-results.json --format json || true

      - name: Display results
        if: always()
        run: |
          if [ -f pip-audit-results.json ]; then
            cat pip-audit-results.json
          fi

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: backend/pip-audit-results.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Node.js Dependency Audit (npm audit)
  # ═══════════════════════════════════════════════════════════════
  node-audit:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web_app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/web_app/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run npm audit
        run: npm audit --json > npm-audit-results.json || true

      - name: Display results
        if: always()
        run: |
          if [ -f npm-audit-results.json ]; then
            cat npm-audit-results.json
          fi

      - name: Upload npm audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: frontend/web_app/npm-audit-results.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Container Scanning (Trivy)
  # ═══════════════════════════════════════════════════════════════
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Display Trivy results
        if: always()
        run: |
          if [ -f trivy-results.json ]; then
            cat trivy-results.json
          fi

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Job 4: Source Code Scanning (Semgrep)
  # ═══════════════════════════════════════════════════════════════
  semgrep:
    name: Semgrep Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config=auto --json --output=semgrep-results.json . || true

      - name: Display Semgrep results
        if: always()
        run: |
          if [ -f semgrep-results.json ]; then
            cat semgrep-results.json
          fi

      - name: Upload Semgrep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Job 5: Secret Detection (Gitleaks)
  # ═══════════════════════════════════════════════════════════════
  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --report-format json --report-path gitleaks-results.json
        continue-on-error: true

      - name: Upload Gitleaks results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Job 6: Security Tests (pytest)
  # ═══════════════════════════════════════════════════════════════
  security-tests:
    name: Security Tests (pytest)
    runs-on: ubuntu-latest
    needs: [bandit]
    env:
      APP_ENV: test
      SECRET_KEY: ci-test-secret-key-not-for-production
      DATABASE_URL: sqlite:///./test_security.db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 pytest-timeout==2.3.1

      - name: Run security tests
        run: python -m pytest tests/security/ -x -q --timeout=30

  # ═══════════════════════════════════════════════════════════════
  # Job 7: Python Security Linter (Bandit)
  # ═══════════════════════════════════════════════════════════════
  bandit:
    name: Python Security Linter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r . -f json --output bandit-results.json || true

      - name: Display Bandit results
        if: always()
        run: |
          if [ -f bandit-results.json ]; then
            cat bandit-results.json
          fi

      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: backend/bandit-results.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # Job 8: Security Scan Gate
  # ═══════════════════════════════════════════════════════════════
  security-success:
    name: Security Scan Gate
    runs-on: ubuntu-latest
    needs: [python-audit, node-audit, container-scan, semgrep, gitleaks, bandit, security-tests]
    if: always()
    steps:
      - name: Check security scan results
        run: |
          echo "Security scans completed. Review artifacts for details."
          echo "Note: Some scans may have found issues - review the uploaded artifacts."
