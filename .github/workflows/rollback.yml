name: Rollback — Emergency Recovery

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to roll back"
        required: true
        type: choice
        options:
          - staging
          - production
      scope:
        description: "Components to roll back"
        required: true
        type: choice
        options:
          - backend
          - frontend
          - all
      reason:
        description: "Reason for rollback"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: rollback-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Emergency Rollback — ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "zozi-ci"
          git config user.email "ci@zozi.com"

      - name: Rollback backend (Railway)
        if: ${{ github.event.inputs.scope == 'backend' || github.event.inputs.scope == 'all' }}
        run: |
          set -euo pipefail
          ENV="${{ github.event.inputs.environment }}"
          TOKEN_VAR="RAILWAY_TOKEN_$(echo $ENV | tr '[:lower:]' '[:upper:]')"
          RAILWAY_TOKEN="${{ secrets[TOKEN_VAR] }}"
          RAILWAY_PROJECT_ID="${{ secrets.RAILWAY_PROJECT_ID }}"

          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "::error::Missing Railway secrets for environment: $ENV"
            exit 1
          fi

          echo "::group::Backend rollback — $ENV"
          echo "$HOME/.railway/bin" >> $GITHUB_PATH
          curl -fsSL https://railway.app/install.sh | sh

          LAST_COMMIT=$(git rev-parse HEAD~1)
          echo "Rolling back Railway $ENV to commit: $LAST_COMMIT"

          railway run --environment "$ENV" -- alembic downgrade -1
          railway up --environment "$ENV" --detach
          railway run --environment "$ENV" -- alembic upgrade head

          echo "::notice::🔙 Backend $ENV rolled back to $LAST_COMMIT"
          echo "::group::"

      - name: Rollback frontend (Vercel)
        if: ${{ github.event.inputs.scope == 'frontend' || github.event.inputs.scope == 'all' }}
        run: |
          set -euo pipefail
          ENV="${{ github.event.inputs.environment }}"
          VERCEL_ENV="production"
          URL_VAR="NEXT_PUBLIC_API_URL_$(echo $ENV | tr '[:lower:]' '[:upper:]')"

          if [ "$ENV" = "staging" ]; then
            VERCEL_ENV="preview"
          fi

          echo "::group::Frontend rollback — $ENV ($VERCEL_ENV)"
          npm install -g vercel@latest

          vercel pull --yes --environment="$VERCEL_ENV" \
            --token="${{ secrets.VERCEL_TOKEN }}"

          vercel rollback --yes \
            --token="${{ secrets.VERCEL_TOKEN }}" \
            --org-id="${{ secrets.VERCEL_ORG_ID }}" \
            --project-id="${{ secrets.VERCEL_PROJECT_ID }}"

          echo "::notice::🔙 Frontend $ENV ($VERCEL_ENV) rolled back"
          echo "::group::"

      - name: Verify rollback health
        if: ${{ github.event.inputs.scope == 'backend' || github.event.inputs.scope == 'all' }}
        run: |
          set -euo pipefail
          ENV="${{ github.event.inputs.environment }}"
          BASE_URL="https://api.zozi.com"

          if [ "$ENV" = "staging" ]; then
            BASE_URL="https://staging-api.zozi.com"
          fi

          echo "::group::Health verification — $ENV"
          for i in 1 2 3 4 5; do
            if curl -sf "$BASE_URL/health" > /dev/null; then
              echo "✅ Backend health check passed ($ENV)"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::❌ Backend health check failed after 5 attempts ($ENV)"
          exit 1

      - name: Verify frontend rollback
        if: ${{ github.event.inputs.scope == 'frontend' || github.event.inputs.scope == 'all' }}
        run: |
          set -euo pipefail
          ENV="${{ github.event.inputs.environment }}"
          FRONTEND_URL="https://zozi.com"

          if [ "$ENV" = "staging" ]; then
            FRONTEND_URL="https://staging.zozi.com"
          fi

          echo "::group::Frontend verification — $ENV"
          for i in 1 2 3 4 5; do
            if curl -sf "$FRONTEND_URL" -o /dev/null; then
              echo "✅ Frontend responding ($ENV)"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::❌ Frontend check failed after 5 attempts ($ENV)"
          exit 1

      - name: Verify critical API paths
        if: ${{ github.event.inputs.scope == 'backend' || github.event.inputs.scope == 'all' }}
        run: |
          set -euo pipefail
          ENV="${{ github.event.inputs.environment }}"
          BASE_URL="https://api.zozi.com"

          if [ "$ENV" = "staging" ]; then
            BASE_URL="https://staging-api.zozi.com"
          fi

          echo "::group::Critical API verification — $ENV"
          curl -sf "$BASE_URL/api/v1/catalog/products?limit=1" || exit 1
          echo "✅ Catalog API responding ($ENV)"
          echo "::group::"

      - name: Notify rollback result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "::notice::🔙 Rollback to ${{ github.event.inputs.environment }} completed successfully"
          else
            echo "::error::❌ Rollback to ${{ github.event.inputs.environment }} FAILED — manual intervention required"
            exit 1
          fi
