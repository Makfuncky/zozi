name: Schema Drift Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  schema-audit:
    name: Schema Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Run schema drift audit
        working-directory: backend
        run: |
          uv run pytest tests/architecture/test_alembic_autogenerate_check.py -v
