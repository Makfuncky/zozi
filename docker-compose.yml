services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zozimarketplace}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Valkey Cache
  valkey:
    image: valkey:9.0-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping || redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      - DATABASE_URL_DIRECT=postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      - VALKEY_URL=valkey://valkey:6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required — define it in root .env (e.g., SECRET_KEY=openssl rand -hex 32)}
      - FIELD_ENCRYPTION_SALT=${FIELD_ENCRYPTION_SALT:-dev-field-encryption-salt}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://frontend:3000}
      - CELERY_BROKER_URL=valkey://valkey:6379/1
      - CELERY_RESULT_BACKEND=valkey://valkey:6379/2
      - CELERY_TASK_ALWAYS_EAGER=false
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # Celery Worker - ML/AI tasks (background removal, image analysis)
  celery-worker-ml:
    build: ./backend
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      - VALKEY_URL=valkey://valkey:6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required — define it in root .env}
      - CELERY_BROKER_URL=valkey://valkey:6379/1
      - CELERY_RESULT_BACKEND=valkey://valkey:6379/2
      - CELERY_TASK_ALWAYS_EAGER=false
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: celery -A celery_app worker -Q ml -c 2 -l info --max-tasks-per-child=50
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Celery Worker - Periodic tasks (schedulers, reconciliation)
  celery-worker-periodic:
    build: ./backend
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      - VALKEY_URL=valkey://valkey:6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required — define it in root .env}
      - CELERY_BROKER_URL=valkey://valkey:6379/1
      - CELERY_RESULT_BACKEND=valkey://valkey:6379/2
      - CELERY_TASK_ALWAYS_EAGER=false
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: celery -A celery_app worker -Q periodic -c 2 -l info --max-tasks-per-child=100

  # Celery Worker - Payout tasks
  celery-worker-payouts:
    build: ./backend
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      - VALKEY_URL=valkey://valkey:6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required — define it in root .env}
      - CELERY_BROKER_URL=valkey://valkey:6379/1
      - CELERY_RESULT_BACKEND=valkey://valkey:6379/2
      - CELERY_TASK_ALWAYS_EAGER=false
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: celery -A celery_app worker -Q payouts -c 4 -l info --max-tasks-per-child=100

  # Celery Worker - Email tasks
  celery-worker-emails:
    build: ./backend
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      - VALKEY_URL=valkey://valkey:6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required — define it in root .env}
      - CELERY_BROKER_URL=valkey://valkey:6379/1
      - CELERY_RESULT_BACKEND=valkey://valkey:6379/2
      - CELERY_TASK_ALWAYS_EAGER=false
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: celery -A celery_app worker -Q emails -c 4 -l info --max-tasks-per-child=100

  # Celery Beat Scheduler
  celery-beat:
    build: ./backend
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?Set POSTGRES_USER in root .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      - VALKEY_URL=valkey://valkey:6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required — define it in root .env}
      - CELERY_BROKER_URL=valkey://valkey:6379/1
      - CELERY_RESULT_BACKEND=valkey://valkey:6379/2
      - CELERY_TASK_ALWAYS_EAGER=false
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    command: celery -A celery_app beat -l info --scheduler celery.beat.PersistentScheduler

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: web_app/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - backend

volumes:
  postgres_data:
  valkey_data:
